# 마롱이 관리 페이지 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/admin.md(SPEC-450~457), 도메인: docs/01-domain/admin.md, 표 설명: docs/05-erd/admin.md(새 표 없음, 통화 함수 call.month_budget 하나). 2026-11-24 기능 변경 3(같은 날 체크포인트 통과, D148·D161): API-280 app.devices·app.behind 설명(SPEC-460). 같은 날 기능 변경 4(체크포인트 전 제안): API-300 업데이트 내역(docs/04-functional-spec/admin-changelog.md, SPEC-500~504)
openapi: 3.1.0
info:
  title: 마롱이 관리 페이지 API
  version: 0.3.0-draft
  description: |-
    관리 페이지 다시 만들기(part admin, 2026-11-23 체크포인트 통과 D135)가 새로 더하는 API 두 개예요. 관리 페이지의 나머지 API는 지금 계약 그대로 읽어요: 초대 링크·회원·한도·티켓·로그인 끊기(api/unified.openapi.yaml의 API-235~243), 그림 비용·아이템(api/pet-app.openapi.yaml의 API-263~266), 앱 버전(api/app-update.openapi.yaml의 API-267, PR #101). 그 형식은 이 파일에서 다시 정하지 않아요.

    - 관리자 경로(`/chat/admin/api/`)는 Cloudflare Access 뒤에 있고, 서버가 `Cf-Access-Jwt-Assertion`을 다시 확인한 뒤 그 이메일의 해시가 관리자 해시(`MARONG_ADMIN_EMAIL_SHA256`)와 같은지 봐요(통합 앱 SPEC-395, 지금 `marong/app_admin.py`의 `require_admin`). 아니면 403 `not_allowed`예요. 증명이 없어도 401을 쓰지 않아요(API-267과 같음).
    - 쓰기 요청(POST)은 `Origin`이 `https://marong.corthex-hq.com`이어야 해요. 아니면 403 `cross_site`예요. 본문은 없어요.
    - 오류는 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요. JSON 응답은 모두 `Cache-Control: no-store`예요.
    - 응답에는 대화 글, 기억, 사진, 설치 ID, FCM 설치 ID, 로그인 토큰, 초대 링크 토큰과 주소, 이메일이 없어요(REQ-580). API-280의 주의 항목은 친구 이름 없이 개수만 줘요. API-281은 API-240 목록과 같은 초대 링크 줄(`Invite`, 메모 `note`와 쓴 사람 `usedBy.name` 포함)을 돌려줘요. 관리자가 이미 목록에서 보는 값이에요.
    - 페이지(`/chat/admin/`, `/chat/admin/members`, `/chat/admin/members/{friendId}`, `/chat/admin/invites`, `/chat/admin/app`, `/chat/admin/costs`)는 HTML이라 이 계약에 넣지 않았어요. 화면은 07 사이트맵과 08 화면 정의(docs/08-screens/admin.md)예요.
    - API 282~299번은 이 part를 위해 비워 둬요.

    계약에서 정한 것(Claude 제안, 2026-11-23 체크포인트에서 승인 D135).
    1. 개요(API-280)는 다섯 부분(사용량, 통화, 그림, 앱, 초대 링크 만료 수)을 따로 읽어요. 동시에 읽지 않고 연결 하나에서 차례로 읽어요(명세 SPEC-451·3.2). 한 부분이 실패하거나 1초를 넘기면 그 칸만 `null`이고(초대 링크 만료 수는 칸이 없어 주의 항목 `invite_expiring`만 빠짐) 응답은 200이에요. 회원 수조차 읽지 못하거나(DB에 닿지 않음) 연결을 2초 안에 받지 못하면 503이에요.
    2. 돈 값은 소수 둘째 자리 문자열, 비율은 내림한 정수 퍼센트예요(usage-limit 계약과 같음).
    3. 거두기(API-281)는 같은 요청을 두 번 받아도 같은 결과예요(이미 거둔 링크 → 200, `revokedAt` 그대로). 쓴 링크와 기간 지난 링크는 409 `invite_closed`예요. API-281은 동희님이 '초대 링크 거두기'를 더하기로 답한 뒤에만 구현해요(질문 2).

    깨지는 변경: 없음. 두 경로 모두 새것이고, 지금 경로와 응답은 그대로예요.

    0.2.0(2026-11-24 기능 변경 3, D146. 같은 날 체크포인트 통과: D148 3-9·3-10, D161): 응답 모양은 그대로이고 API-280 `app.devices`의 뜻만 바뀌어요. `devices`는 앱 지워진 폰(API-267 0.3.0의 `removedAt`이 있는 폰)을 뺀 수예요. `behind`는 식이 그대로이고 API-267의 `behind`가 앱 지워진 폰에서 false라 그 폰이 들지 않아요(SPEC-460).

    0.3.0(2026-11-24 기능 변경 4 '업데이트 내역', 체크포인트 전 제안. 0.2.0은 먼저 합쳐진 기능 변경 3(PR #127)이 씀): 읽기 API 하나(API-300 `GET /chat/admin/api/changes`)를 더해요. API-282~299는 위대로 이 part에 남겨 두고, 같은 날 다른 설계와 겹치지 않게 300번을 잡았어요.
    1. 내역은 DB가 아니라 저장소 폴더 `marong/changelog/`의 JSON 파일이에요(반영 단위마다 하나, SPEC-500). 운영에서는 앱 서버 코드 자리의 같은 폴더를 요청마다 읽어요. 캐시·쓰기·쿼리 값이 없어요.
    2. 형식이 틀린 파일은 빼고 그 수를 `skipped`로 줘요. 응답은 200이에요(SPEC-501).
    3. 근거 주소(`url`)는 서버가 만들어요(공개 저장소의 PR·커밋 주소).
    4. 페이지 `/chat/admin/changes`(SCR-220)는 HTML이라 이 계약에 넣지 않았어요.
    깨지는 변경: 없음. 새 경로 하나이고 다른 경로와 응답은 그대로예요.
servers:
- url: https://marong.corthex-hq.com
paths:
  /chat/admin/api/overview:
    get:
      operationId: getAdminOverview
      summary: 관리 페이지 개요
      description: 개요(SCR-169)가 불러요. 회원 수, 오늘 사용 합, 이번 달 통화 합과 월 예산(UTC 달, 통화 함수 `call.month_budget`), 이번 달 그림 비용(한국 시각 달, API-266과 같은 서버 함수), 앱 버전 요약(API-267과 같은 서버 함수), 주의 항목(TERM-241)을 줘요(SPEC-451, 457).
      security:
      - cfAccess: []
      x-corthex:
        id: API-280
        spec:
        - SPEC-451
        - SPEC-457
        omit:
          '400': 입력이 없음(쿼리·본문 없음)
          '401': 관리자 확인은 증명이 없어도 403 not_allowed(머리 설명)
          '404': 경로가 가리키는 것이 없음
          '409': 읽기만 함
          '429': 관리자 한 명이 화면을 열 때만 불러요. 횟수 제한 없음
      responses:
        '200':
          description: 개요. 한 부분을 읽지 못하면 그 칸만 null
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
              examples:
                attention:
                  summary: 손볼 일 다섯 가지
                  value:
                    members:
                      count: 3
                      unlinked: 1
                    usageToday:
                      day: '2026-11-25'
                      chatTurns: 41
                      callSeconds: 1260
                      images: 2
                      units: 420
                    callMonth:
                      month: 2026-11
                      spentUsd: '121.40'
                      budgetUsd: '150.00'
                      percent: 80
                      state: warn
                    images:
                      month: 2026-11
                      totalUsd: '21.10'
                      budgetPercent: 85
                    app:
                      latest:
                        versionName: 0.3.3
                        versionCode: 11
                        publishedAt: '2026-11-24T05:00:00Z'
                      paused: false
                      devices: 2
                      behind: 1
                    attention:
                    - kind: call_budget
                      level: warn
                      value: 80
                      target: /chat/admin/costs
                    - kind: image_budget
                      level: warn
                      value: 85
                      target: /chat/admin/costs
                    - kind: app_behind
                      level: warn
                      value: 1
                      target: /chat/admin/app
                    - kind: invite_expiring
                      level: warn
                      value: 1
                      target: /chat/admin/invites
                    - kind: unlinked_friend
                      level: warn
                      value: 1
                      target: /chat/admin/members
                calm:
                  summary: 손볼 일 없음
                  value:
                    members:
                      count: 3
                      unlinked: 0
                    usageToday:
                      day: '2026-11-25'
                      chatTurns: 12
                      callSeconds: 0
                      images: 0
                      units: 12
                    callMonth:
                      month: 2026-11
                      spentUsd: '30.00'
                      budgetUsd: '150.00'
                      percent: 20
                      state: ok
                    images:
                      month: 2026-11
                      totalUsd: '2.00'
                      budgetPercent: 10
                    app:
                      latest:
                        versionName: 0.3.3
                        versionCode: 11
                        publishedAt: '2026-11-24T05:00:00Z'
                      paused: false
                      devices: 2
                      behind: 0
                    attention: []
                part-failed:
                  summary: 통화 합과 앱 요약을 읽지 못함
                  value:
                    members:
                      count: 3
                      unlinked: 0
                    usageToday:
                      day: '2026-11-25'
                      chatTurns: 12
                      callSeconds: 0
                      images: 0
                      units: 12
                    callMonth: null
                    images:
                      month: 2026-11
                      totalUsd: '2.00'
                      budgetPercent: null
                    app: null
                    attention: []
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/invites/{inviteId}/revoke:
    post:
      operationId: revokeInvite
      summary: 초대 링크 거두기
      description: 초대 링크 화면(SCR-202)이 확인 줄 뒤에 불러요. 열린 초대 링크의 `revoked_at`을 지금(앱 시계, API-240과 같음)으로 정하는 UPDATE 하나예요. 바뀌지 않으면 없음 → 404, 이미 거둠 → 200 그대로(그 뒤 기간이 지났어도), 쓴·기간 지난 링크 → 409 차례로 정해요. 가입·잇기·다시 로그인은 이미 `revoked_at`을 보고 거절해요(SPEC-455). 2026-11-23 질문 2의 답 '더함'(D137)으로 넣어요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-281
        status: active
        spec:
        - SPEC-455
        omit:
          '400': 본문이 없고 경로 id의 형식이 틀리면 404(없는 것과 같음)
          '401': 관리자 확인은 증명이 없어도 403 not_allowed(머리 설명)
          '429': 관리자 한 명이 누를 때만 불러요. 횟수 제한 없음
      parameters:
      - name: inviteId
        in: path
        required: true
        description: 초대 링크 id(API-240 줄의 `id`). 정수가 아니면 404
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
      responses:
        '200':
          description: 거둔 초대 링크. 이미 거둔 링크도 같은 응답이고 `revokedAt`이 처음 값
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRevoked'
              examples:
                revoked:
                  value:
                    invite:
                      id: 12
                      kind: join
                      note: 시험 메모
                      state: revoked
                      expiresAt: '2026-11-30T05:00:00Z'
                      createdAt: '2026-11-23T05:00:00Z'
                      usedAt: null
                      revokedAt: '2026-11-23T06:10:00Z'
                      usedBy: null
        '403':
          $ref: '#/components/responses/AdminOrCrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InviteClosed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/changes:
    get:
      operationId: getAdminChanges
      summary: 업데이트 내역
      description: 업데이트 내역 화면(SCR-220)이 불러요. 저장소 폴더 `marong/changelog/`(운영은 앱 서버 코드 자리의 같은 폴더)의 반영 단위 파일을 모두 읽어, 형식 검사를 지난 단위를 새것부터 줘요(SPEC-501, 차례는 명세 3.3). 틀린 파일은 빼고 `skipped`에 세요. 폴더가 없으면 빈 목록이에요. 2026-11-24 기능 변경 4, 체크포인트 전 제안.
      security:
      - cfAccess: []
      x-corthex:
        id: API-300
        status: proposed
        spec:
        - SPEC-500
        - SPEC-501
        terms: [CTX-026, TERM-176, TERM-270, TERM-271]
        omit:
          '400': 입력이 없음(쿼리·본문 없음)
          '401': 관리자 확인은 증명이 없어도 403 not_allowed(머리 설명)
          '404': 경로가 가리키는 것이 없음. 폴더가 없어도 200 빈 목록
          '409': 읽기만 함
          '429': 관리자 한 명이 화면을 열 때만 불러요. 횟수 제한 없음
          '503': DB를 읽지 않음. 파일을 읽지 못하면 500
      responses:
        '200':
          description: 반영 단위 목록(새것부터)과 읽지 못한 파일 수
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChanges'
              examples:
                normal:
                  summary: 서버 단위 하나와 앱 단위 하나(합성 예)
                  value:
                    units:
                    - id: 20261124-admin
                      kind: server
                      title: 관리 페이지 다시 만들기
                      deployedOn: '2026-11-24'
                      sortOn: '2026-11-24'
                      app: null
                      backfilled: true
                      evidence:
                      - label: 'PR #116'
                        url: https://github.com/kodonghui/marong2/pull/116
                      items:
                      - type: improved
                        area: admin
                        title: 관리 페이지 화면 나누기
                        before: 관리자 화면 하나에 초대 링크·회원·비용이 함께 있었어요
                        after: 개요·회원·초대 링크·앱 버전·비용·아이템 여섯 탭으로 나눠 봐요
                        evidence:
                        - label: 'PR #116'
                          url: https://github.com/kodonghui/marong2/pull/116
                    - id: app-0.3.4
                      kind: app
                      title: 새 버전 바로 받기와 지금 설치
                      deployedOn: '2026-11-23'
                      sortOn: '2026-11-23'
                      app:
                        versionName: 0.3.4
                        versionCode: 12
                      backfilled: true
                      evidence:
                      - label: 'PR #110'
                        url: https://github.com/kodonghui/marong2/pull/110
                      items:
                      - type: improved
                        area: app
                        title: 새 버전 받기
                        before: 기록 없음
                        after: 새 버전이 나오면 몇 분 안에 받아 두고, 홈과 글 대화에서 '지금 설치'로 깔아요
                        evidence:
                        - label: 'PR #110'
                          url: https://github.com/kodonghui/marong2/pull/110
                    skipped: 0
                empty:
                  summary: 폴더가 없거나 비었음
                  value:
                    units: []
                    skipped: 0
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/Internal'
components:
  x-corthex:
    errors:
      cross_site:
        status: 403
        meaning: 쓰기 요청의 Origin이 없거나 다름
        message: 잠깐 문제가 생겼어요. 다시 해 볼까요?
        client: 공통 오류 줄과 추적 id
      not_allowed:
        status: 403
        meaning: 관리자 경로에 Access 증명이 없거나 관리자 계정이 아님
        message: 관리자만 볼 수 있어요
        client: 관리 페이지가 막힘 상태
      not_found:
        status: 404
        meaning: 그 id의 초대 링크가 없거나 경로 id의 형식이 틀림
        message: 그 링크를 찾을 수 없어요
        client: 목록을 다시 불러옴
      invite_closed:
        status: 409
        meaning: 이미 쓴 링크이거나 기간이 지난 링크라 거둘 수 없음
        message: 이미 쓰였거나 기간이 지난 링크예요
        client: 그 줄을 목록의 새 상태로 바꿈
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어요. 다시 해 볼까요?
        client: 공통 오류 줄과 추적 id
      db_unavailable:
        status: 503
        meaning: DB에 닿지 않음(API-280은 연결을 2초 안에 받지 못할 때도)
        message: 잠깐 문제가 생겼어요. 다시 해 볼까요?
        client: 공통 오류 줄과 추적 id
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: 관리자 경로 전용. Cloudflare Access가 붙이는 JWT를 서버가 다시 확인하고 이메일 해시를 관리자 해시와 비교해요(통합 앱 SPEC-395)
  headers:
    NoStore:
      description: 저장하지 않음
      schema:
        type: string
        const: no-store
  responses:
    AdminForbidden:
      description: 관리자 아님(Access 증명 없음 포함)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-allowed:
              value:
                type: https://marong.corthex-hq.com/problems/not-allowed
                title: 관리자만 볼 수 있음
                status: 403
                code: not_allowed
                traceId: 4bf92f3577b34da6
    AdminOrCrossSite:
      description: 관리자 아님, 또는 쓰기 요청의 Origin이 다름
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-allowed:
              value:
                type: https://marong.corthex-hq.com/problems/not-allowed
                title: 관리자만 볼 수 있음
                status: 403
                code: not_allowed
                traceId: 4bf92f3577b34da6
            cross-site:
              value:
                type: https://marong.corthex-hq.com/problems/cross-site
                title: 다른 주소에서 온 쓰기
                status: 403
                code: cross_site
                traceId: 4bf92f3577b34da7
    NotFound:
      description: 그 초대 링크가 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: https://marong.corthex-hq.com/problems/not-found
                title: 찾지 못함
                status: 404
                code: not_found
                traceId: 4bf92f3577b34da8
    InviteClosed:
      description: 이미 쓴 링크이거나 기간이 지난 링크
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invite-closed:
              value:
                type: https://marong.corthex-hq.com/problems/invite-closed
                title: 거둘 수 없는 링크
                status: 409
                code: invite_closed
                traceId: 4bf92f3577b34da9
    Internal:
      description: 예상하지 못한 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://marong.corthex-hq.com/problems/internal
                title: 서버 오류
                status: 500
                code: internal
                traceId: 4bf92f3577b34daa
    DbUnavailable:
      description: DB에 닿지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            db-unavailable:
              value:
                type: https://marong.corthex-hq.com/problems/db-unavailable
                title: DB에 닿지 않음
                status: 503
                code: db_unavailable
                traceId: 4bf92f3577b34dab
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - cross_site
          - not_allowed
          - not_found
          - invite_closed
          - internal
          - db_unavailable
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
    Usd:
      type: string
      description: 달러, 소수 둘째 자리까지(usage-limit 계약의 Usd와 같음)
      pattern: ^[0-9]{1,6}\.[0-9]{2}$
    AdminOverview:
      type: object
      additionalProperties: false
      required:
      - members
      - usageToday
      - callMonth
      - images
      - app
      - attention
      properties:
        members:
          type: object
          additionalProperties: false
          required:
          - count
          - unlinked
          properties:
            count:
              type: integer
              minimum: 0
              description: 프로필이 있는 친구 수(API-236 `members`의 길이)
            unlinked:
              type: integer
              minimum: 0
              description: 프로필이 없는 기존 친구 수(API-236 `unlinked`의 길이)
        usageToday:
          description: 오늘(한국 시각 04:00에 바뀜) 프로필이 있는 친구의 사용량 합. 읽지 못하면 null
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - day
            - chatTurns
            - callSeconds
            - images
            - units
            properties:
              day:
                type: string
                format: date
              chatTurns:
                type: integer
                minimum: 0
              callSeconds:
                type: integer
                minimum: 0
              images:
                type: integer
                minimum: 0
              units:
                type: integer
                minimum: 0
        callMonth:
          description: 이번 UTC 달의 통화 비용 합과 월 예산(TERM-014). 함수 실패·1초 넘음이면 null
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - month
            - spentUsd
            - budgetUsd
            - percent
            - state
            properties:
              month:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}$
              spentUsd:
                $ref: '#/components/schemas/Usd'
              budgetUsd:
                description: 월 예산(call.settings의 monthly_budget_usd, DB 제약으로 0보다 큼, 없으면 150)
                $ref: '#/components/schemas/Usd'
              percent:
                description: 내림(합 ÷ 예산 × 100)
                type: integer
                minimum: 0
              state:
                type: string
                enum:
                - ok
                - warn
                - exhausted
                - hard_stop
                description: 80·100·120% 문턱(call_cost.STATE와 같음)
        images:
          description: 이번 한국 시각 달의 그림 비용(API-266과 같은 서버 함수). 읽지 못하면 null
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - month
            - totalUsd
            - budgetPercent
            properties:
              month:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}$
              totalUsd:
                $ref: '#/components/schemas/Usd'
              budgetPercent:
                description: 예산이 있는 종류 가운데 가장 큰 비율(내림). 예산이 모두 없으면 null
                type:
                - integer
                - 'null'
                minimum: 0
        app:
          description: API-267을 만드는 서버 함수의 결과에서 센 요약. 읽지 못하거나 그 함수가 없으면 null
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - latest
            - paused
            - devices
            - behind
            properties:
              latest:
                description: API-267의 `latest`와 같은 모양. 릴리스가 없으면 null
                oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - versionName
                  - versionCode
                  - publishedAt
                  properties:
                    versionName:
                      type: string
                      pattern: ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$
                    versionCode:
                      type: integer
                      minimum: 1
                      maximum: 2100000000
                    publishedAt:
                      type: string
                      format: date-time
              paused:
                type: boolean
              devices:
                type: integer
                minimum: 0
                description: API-267 `devices` 가운데 `removedAt`이 null인 폰 수(90일 안에 보고했고 앱이 지워지지 않은 폰, 0.2.0 기능 변경 3)
              behind:
                type: integer
                minimum: 0
                description: 그 가운데 `behind`가 참인 폰 수(앱 지워진 폰은 API-267의 `behind`가 false라 들지 않음)
        attention:
          type: array
          description: 주의 항목(TERM-241). 기능 명세 3.3의 차례, 종류마다 많아야 한 줄
          maxItems: 6
          items:
            $ref: '#/components/schemas/AttentionItem'
    AttentionItem:
      type: object
      additionalProperties: false
      required:
      - kind
      - level
      - target
      properties:
        kind:
          type: string
          enum:
          - call_budget
          - image_budget
          - app_paused
          - app_behind
          - invite_expiring
          - unlinked_friend
        level:
          type: string
          enum:
          - warn
          - danger
        value:
          type: integer
          minimum: 0
          description: 퍼센트(call_budget, image_budget) 또는 개수(app_behind, invite_expiring, unlinked_friend). app_paused에는 없음
        target:
          type: string
          enum:
          - /chat/admin/costs
          - /chat/admin/app
          - /chat/admin/invites
          - /chat/admin/members
    InviteRevoked:
      type: object
      additionalProperties: false
      required:
      - invite
      properties:
        invite:
          description: API-240의 줄과 같은 모양(api/unified.openapi.yaml의 Invite, 다시 정하지 않음). 거둔 뒤라 `state`는 revoked이고 `revokedAt`이 있어요
          $ref: './unified.openapi.yaml#/components/schemas/Invite'
    AdminChanges:
      type: object
      additionalProperties: false
      description: 업데이트 내역(API-300, 0.3.0). 단위 차례는 명세 3.3(sortOn 늦은 것부터, 같은 날은 id 거꾸로)
      required:
      - units
      - skipped
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/ChangeUnit'
        skipped:
          type: integer
          minimum: 0
          description: 읽지 못해 뺀 파일 수(깨짐, 32KB 넘음, 형식 틀림, 개인 정보 패턴, id 겹침)
    ChangeUnit:
      type: object
      additionalProperties: false
      description: 반영 단위 하나(TERM-271). 저장소 파일 `marong/changelog/<id>.json`과 같은 값에 `sortOn`과 근거 주소를 더한 것
      required:
      - id
      - kind
      - title
      - deployedOn
      - sortOn
      - app
      - backfilled
      - evidence
      - items
      properties:
        id:
          type: string
          description: 서버는 반영 폴더 이름(임의 글자를 뺀 것)이나 지난 반영의 `<날짜>-pr<번호>`, 앱은 `app-<버전 이름>`
          pattern: ^([0-9]{8}-[a-z0-9][a-z0-9-]{0,39}|app-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$
        kind:
          type: string
          enum:
          - server
          - app
        title:
          type: string
          minLength: 1
          maxLength: 40
        deployedOn:
          type:
          - string
          - 'null'
          format: date
          description: 반영일(한국 시각 날짜). 지난 기록에서 반영 기록을 찾지 못한 서버 단위만 null
        sortOn:
          type: string
          format: date
          description: 차례에 쓰는 날짜. deployedOn이 있으면 그 값, null이면 id 앞 여덟 자리
        app:
          description: 앱 단위만. 서버 단위는 null
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - versionName
            - versionCode
            properties:
              versionName:
                type: string
                pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
              versionCode:
                type: integer
                minimum: 1
        backfilled:
          type: boolean
          description: 지난 기록에서 채운 단위(SPEC-504)
        evidence:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ChangeEvidence'
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/ChangeItem'
    ChangeItem:
      type: object
      additionalProperties: false
      required:
      - type
      - area
      - title
      - before
      - after
      - evidence
      properties:
        type:
          type: string
          description: added 추가, improved 개선, fixed 수정, removed 제거
          enum:
          - added
          - improved
          - fixed
          - removed
        area:
          type: string
          description: app 앱, web 웹, call 통화, chat 대화, admin 관리, legacy 카톡·디스코드
          enum:
          - app
          - web
          - call
          - chat
          - admin
          - legacy
        title:
          type: string
          minLength: 1
          maxLength: 40
        before:
          type: string
          minLength: 1
          maxLength: 100
          description: 변경 전. added면 '없음', 근거가 없으면 '기록 없음'(지난 기록만)
        after:
          type: string
          minLength: 1
          maxLength: 100
          description: 변경 후. removed면 '없음', 근거가 없으면 '기록 없음'(지난 기록만)
        evidence:
          type: array
          minItems: 1
          maxItems: 10
          description: 파일에서 항목의 근거가 비면 서버가 단위의 근거를 넣어 줘요
          items:
            $ref: '#/components/schemas/ChangeEvidence'
    ChangeEvidence:
      type: object
      additionalProperties: false
      required:
      - label
      - url
      properties:
        label:
          type: string
          description: 'PR #<번호> 또는 커밋 해시(7~40자)'
          pattern: '^(PR #[1-9][0-9]{0,4}|[0-9a-f]{7,40})$'
        url:
          type: string
          format: uri
          pattern: ^https://github\.com/kodonghui/marong2/(pull/[1-9][0-9]{0,4}|commit/[0-9a-f]{7,40})$
