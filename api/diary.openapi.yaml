  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 300
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - invalid_request
          - unauthenticated
          - not_allowed
          - cross_site
          - no_dm
          - not_found
          - stale_revision
          - busy
          - not_ready
          - fix_limit
          - redraw_limit
          - too_many_requests
          - drawing_budget
          - fix_failed
          - db_unavailable
          - internal
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
        errors:
          type: array
          maxItems: 10
          description: 검증 오류 위치. 보낸 값은 담지 않음
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                enum:
                - body
                - date
                - month
                - before
                - revision
                - text
                - change
                - weather
                - hidden
                - stamped
                - hair
                - glasses
                - top
                - Idempotency-Key
              reason:
                type: string
                enum:
                - required
                - too_short
                - too_long
                - bad_format
                - out_of_range
                - reused
            additionalProperties: false
      additionalProperties: false
    DiaryDate:
      type: string
      format: date
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: 일기 날짜(TBL-105 diary_date). 그 일기 하루(04:00~다음 날 04:00, 한국 시각)가 시작한 한국 날짜
    Revision:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 판 번호(TBL-107 revision). 쓰기가 1을 만들고 고치기·마음 날씨·새 장면이 하나씩 더해요
    Weather:
      type: string
      description: sunny 맑음 | cloudy 구름 | rain 비 | snow 눈 | rainbow 무지개
      enum:
      - sunny
      - cloudy
      - rain
      - snow
      - rainbow
    Latest:
      type: object
      required:
      - date
      - enabled
      properties:
        date:
          description: 준비되고 숨기지 않은 가장 늦은 일기 날짜. 없으면 null
          oneOf:
          - $ref: '#/components/schemas/DiaryDate'
          - type: 'null'
        enabled:
          type: boolean
          description: 이 친구의 일기가 켜져 있는지(가장 나중에 더한 TBL-103 줄의 값, 시작 날짜와 상관없이)
      additionalProperties: false
    MonthDays:
      type: object
      required:
      - month
      - days
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        days:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/MonthDay'
      additionalProperties: false
    MonthDay:
      type: object
      required:
      - date
      - weather
      - stamped
      properties:
        date:
          $ref: '#/components/schemas/DiaryDate'
        weather:
          $ref: '#/components/schemas/Weather'
        stamped:
          type: boolean
      additionalProperties: false
    DiaryDay:
      type: object
      required:
      - date
      - state
      - prev
      - next
      - diary
      properties:
        date:
          $ref: '#/components/schemas/DiaryDate'
        state:
          type: string
          description: none 일기 없음·미래·다른 친구에게 간 주소 | writing 마롱이가 아직 쓰는 중(속 상태 pending·writing·drawing) | skipped 얘기가 적어 쉰 날 | failed 못 쓴 날 | ready 일기장에 보임
          enum:
          - none
          - writing
          - skipped
          - failed
          - ready
        prev:
          description: 이 날보다 이른 날 가운데 준비되고 숨기지 않은 가장 가까운 날. 없으면 null
          oneOf:
          - $ref: '#/components/schemas/DiaryDate'
          - type: 'null'
        next:
          description: 이 날보다 늦은 날 가운데 준비되고 숨기지 않은 가장 가까운 날. 없으면 null
          oneOf:
          - $ref: '#/components/schemas/DiaryDate'
          - type: 'null'
        diary:
          description: state가 ready일 때만 있어요. 아니면 null
          oneOf:
          - $ref: '#/components/schemas/DiaryContent'
          - type: 'null'
      additionalProperties: false
    DiaryContent:
      type: object
      required:
      - revision
      - title
      - weather
      - body
      - drawing
      - hidden
      - stampedAt
      - busy
      - fix
      - redraw
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        title:
          type: string
          minLength: 2
          maxLength: 20
          description: 지금 판의 제목. 화면에는 textContent로만 넣어요
        weather:
          $ref: '#/components/schemas/Weather'
        body:
          type: string
          minLength: 60
          maxLength: 160
          description: 지금 판의 글(공백 포함). 화면은 원고지 칸에 한 칸 한 글자로 써요
        drawing:
          $ref: '#/components/schemas/Drawing'
        hidden:
          type: boolean
        stampedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 도장을 찍은 시각. 안 찍었으면 null
        busy:
          type:
          - string
          - 'null'
          enum:
          - fix
          - redraw
          - null
          description: 지금 고치는 중(fix, 90초까지)이나 다시 그리는 중(redraw)
        fix:
          $ref: '#/components/schemas/FixState'
        redraw:
          $ref: '#/components/schemas/RedrawState'
      additionalProperties: false
    Drawing:
      type: object
      required:
      - id
      - kind
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: 지금 그림 id. 기본 그림이면 null이고 화면이 기본 그림을 그려요
        kind:
          type: string
          description: ai 'AI가 그린 그림' | placeholder '기본 그림'(REQ-170)
          enum:
          - ai
          - placeholder
      additionalProperties: false
    FixState:
      type: object
      required:
      - left
      - blocked
      properties:
        left:
          type: integer
          minimum: 0
          maximum: 5
          description: 남은 고치기 수(성공한 것만 셈)
        blocked:
          type:
          - string
          - 'null'
          enum:
          - fix_limit
          - busy
          - null
          description: 지금 고치기를 누를 수 없는 이유. 누를 수 있으면 null
      additionalProperties: false
    RedrawState:
      type: object
      required:
      - left
      - blocked
      - last
      properties:
        left:
          type: integer
          minimum: 0
          maximum: 2
          description: 남은 다시 그리기 수(성공한 것만 셈)
        blocked:
          type:
          - string
          - 'null'
          enum:
          - redraw_limit
          - busy
          - drawing_budget
          - null
          description: 지금 다시 그리기를 누를 수 없는 이유. 누를 수 있으면 null
        last:
          description: 마지막 다시 그리기 결과(TBL-105 redraw_result·redraw_at). 없으면 null
          oneOf:
          - $ref: '#/components/schemas/LastRedraw'
          - type: 'null'
      additionalProperties: false
    LastRedraw:
      type: object
      required:
      - result
      - at
      properties:
        result:
          type: string
          description: done 새 그림 | scene_rejected 바꿀 점으로 만든 장면이 검사에 떨어짐('그 말로는 그릴 수 없어. 이름이나 숫자는 빼고 적어 줘') | draw_failed 장면 다시 쓰기나 그림이 실패함('지금은 못 그렸어') | draw_refused 그림 모델이 거절함('지금은 못 그렸어') | drawing_budget 그 사이 그림 월 예산을 다 씀
          enum:
          - done
          - scene_rejected
          - draw_failed
          - draw_refused
          - drawing_budget
        at:
          type: string
          format: date-time
      additionalProperties: false
    HiddenPage:
      type: object
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - date
            - title
            properties:
              date:
                $ref: '#/components/schemas/DiaryDate'
              title:
                type: string
                minLength: 2
                maxLength: 20
            additionalProperties: false
        nextBefore:
          description: 다음 묶음을 부를 before. 더 없으면 null
          oneOf:
          - $ref: '#/components/schemas/DiaryDate'
          - type: 'null'
      additionalProperties: false
    Look:
      type: object
      description: 내 모습 카드(TBL-104). 화면은 한국어 이름으로 보여요(04의 3.6)
      required:
      - hair
      - glasses
      - top
      properties:
        hair:
          type: string
          description: long 긴 머리 | bob 단발 | short 짧은 머리 | ponytail 묶은 머리 | curly 곱슬머리
          enum:
          - long
          - bob
          - short
          - ponytail
          - curly
        glasses:
          type: string
          description: none 안경 없음 | round 동그란 안경 | square 네모 안경
          enum:
          - none
          - round
          - square
        top:
          type: string
          description: 윗옷 색(하양, 검정, 회색, 남색, 베이지, 분홍, 노랑, 초록)
          enum:
          - white
          - black
          - gray
          - navy
          - beige
          - pink
          - yellow
          - green
      additionalProperties: false
    LookResult:
      type: object
      required:
      - look
      properties:
        look:
          oneOf:
          - $ref: '#/components/schemas/Look'
          - type: 'null'
      additionalProperties: false
    FixRequest:
      type: object
      required:
      - revision
      - text
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        text:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: 고칠 말(앞뒤 공백을 빼고 1~200자). 모델에는 '친구가 보낸 고칠 말 데이터'로 감싸서 보내요
      additionalProperties: false
    FixResult:
      type: object
      required:
      - sceneChanged
      - day
      properties:
        sceneChanged:
          type: boolean
          description: 새 판에서 장면이 바뀌었는지. true면 화면이 다시 그리기를 권해요(그림은 그대로)
        day:
          $ref: '#/components/schemas/DiaryDay'
      additionalProperties: false
    RedrawRequest:
      type: object
      required:
      - revision
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        change:
          type: string
          maxLength: 200
          default: ''
          description: 바꿀 점(0~200자). 비면 같은 장면으로 새로 그려요
      additionalProperties: false
    RedrawResult:
      type: object
      required:
      - day
      properties:
        day:
          $ref: '#/components/schemas/DiaryDay'
      additionalProperties: false
    WeatherRequest:
      type: object
      required:
      - revision
      - weather
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        weather:
          $ref: '#/components/schemas/Weather'
      additionalProperties: false
    HiddenRequest:
      type: object
      required:
      - hidden
      properties:
        hidden:
          type: boolean
      additionalProperties: false
    StampRequest:
      type: object
      required:
      - stamped
      properties:
        stamped:
          type: boolean
      additionalProperties: false
