# 마롱이의 일기 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/diary.md(SPEC-150~168), DB: marong/migrations/016_diary.sql(TBL-103~109)
openapi: 3.1.0
info:
  title: 마롱이의 일기 API
  version: 0.1.0-draft
  description: |-
    마롱이 앱과 브라우저의 일기장 화면이 디스코드 DM 봇의 글 대화 서버와 주고받는 계약이에요. 원본은 이 파일이고 코드는 이 파일을 따라가요(06단계). 글 대화 API(`api/app-chat.openapi.yaml`)와 같은 서버(127.0.0.1:8796)·같은 로그인이고, 새 모듈 `marong/app_diary.py`가 `/chat/diary/` 아래를 맡아요. 터널 규칙·Access·앱은 바꾸지 않아요.

    - 로그인은 글 대화와 같아요. 봇이 `Cf-Access-Jwt-Assertion`을 다시 확인하고 이메일 해시로 통화 친구와 그 친구의 디스코드 DM 연결을 찾아요. 일기는 그 친구 id로만 찾아서, 남의 일기는 없는 것과 같아요(SPEC-158).
    - 쓰기 요청(POST·PUT·DELETE)은 `Origin`이 `https://marong.corthex-hq.com`이어야 해요. 본문은 16KB까지예요(글 대화와 같은 서버 한도).
    - 오류는 글 대화와 같은 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요.
    - 응답에는 장면, 하루 모음, 모델 이름, 비용이 없어요(SPEC-158). 로그에는 일기 날짜, 상태, 판 번호, 결과 코드만 남겨요(REQ-177).
    - 페이지 `/chat/diary/`, `/chat/diary/{YYYY-MM-DD}`와 `diary.js`·`diary.css`는 HTML과 파일이라 이 계약에 넣지 않았어요. 화면은 07 사이트맵에 있어요.
    - 그림 파일만 `Cache-Control: private, max-age=31536000, immutable`이고 다른 응답은 글 대화처럼 `no-store`예요.

    계약에서 정한 것(Claude 제안, 2026-11-16, 검토 대상).
    1. 검증 오류는 400이에요(422는 쓰지 않음). 글 대화와 같아요.
    2. 일기가 없는 날, 미래, 다른 친구에게 간 주소는 404가 아니라 200의 `state` none이에요. 날짜로 로그인한 친구 자신의 일기만 찾아서 남의 일기가 있는지도 드러나지 않아요(SPEC-158).
    3. 그림 id는 형식이 틀려도 404예요. 그림 주소는 화면이 받은 값만 쓰고 `<img>`는 오류 본문을 읽지 못해서예요. 다른 입력의 형식 오류는 400이에요.
    4. 화면에는 일기 줄의 속 상태(`pending`·`writing`·`drawing`)를 `writing` 하나로 보여요. 다시 그리기는 `ready` 안의 `busy`로 보여요.
    5. 바꾸는 요청이 지금 값과 같으면 200이고 판이 늘지 않아요(마음 날씨, 숨기기, 도장, 내 모습 카드).
    6. 고치기와 다시 그리기는 `Idempotency-Key`가 꼭 있어야 해요. 같은 키는 적어도 24시간 동안 처음과 같은 상태 번호와 `code`를 돌려줘요(성공이면 `sceneChanged`도 같고, `day`는 지금 모습). 처음 요청이 아직 도는 중이면 409 `busy`, 같은 키를 다른 날이나 다른 일에 쓰면 400이에요.
    7. 고치기의 모델 실패(시간 넘김, 연결 오류, 5xx, 거절, 키 없음, 한도, 형식 틀림)는 모두 503 `fix_failed` 하나예요. 화면이 할 일(쓴 말을 두고 나중에 다시)이 같아서예요. 종류는 TBL-106의 `outcome`에만 남아요.
    8. 다시 그리기는 202로 받고 끝은 한 날 응답의 `redraw.last`로 알려요. 장면 다시 쓰기와 그림 모델의 실패는 오류 응답이 아니라 `scene_rejected`, `draw_failed`, `draw_refused`, `drawing_budget` 결과예요(SPEC-161).
    9. 마음 날씨 바꾸기는 고치는 중이나 그리는 중이면 409 `busy`예요. 그 사이 판이 바뀌지 않게요(04 SPEC-162에 이 예외를 더함).
    10. `GET /chat/diary/api/latest`를 더했어요. `/chat/diary/`가 가장 최근 일기를 열 때와, 일기가 하나도 없을 때 '아직 없어'와 '꺼져 있어'를 고를 때 써요(04의 3.8에 더함).

    Open: 그림 파일의 1년 캐시가 Cloudflare Access 뒤 앱 창(WebView)에서 실제로 기기에 남는지는 04의 7.3 실측(REQ-176) 때 봐요.
servers:
- url: https://marong.corthex-hq.com
  description: Cloudflare Access 뒤. 터널이 /chat/ 아래만 봇으로 보내요
- url: http://127.0.0.1:8796
  description: 서버 안에서 직접(배포 확인용). Access 증명이 없어 API는 401이에요
security:
- cfAccess: []
paths:
  /chat/diary/api/latest:
    get:
      operationId: getDiaryLatest
      summary: 가장 최근 일기 날짜와 일기 켜짐
      description: 일기장 첫 주소(`/chat/diary/`)가 불러요. 준비되고(ready) 숨기지 않은 가장 늦은 날짜와, 이 친구의 일기가 켜져 있는지(가장 나중에 더한 설정 줄의 값, 시작 날짜와 상관없이)를 줘요. 날짜가 없으면 null이고, 화면은 enabled로 '아직 일기가 없어'와 '일기가 꺼져 있어'를 골라요.
      x-corthex:
        id: API-108
        spec:
        - SPEC-150
        - SPEC-158
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음
          '409': 읽기만 함
          '429': 읽기만 함
      responses:
        '200':
          description: 가장 최근 일기 날짜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Latest'
              examples:
                latest:
                  value:
                    date: '2026-11-16'
                    enabled: true
                none-yet:
                  value:
                    date: null
                    enabled: true
                diary-off:
                  value:
                    date: null
                    enabled: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/diary/api/days:
    get:
      operationId: listDiaryMonth
      summary: 한 달 달력
      description: 그 달(일기 날짜 기준)의 준비되고(ready) 숨기지 않은 일기마다 날짜, 지금 판의 마음 날씨, 도장이 있는지를 날짜순으로 줘요. 건너뛴 날, 못 쓴 날, 쓰는 중인 날, 숨긴 날은 목록에 없어 화면에서 빈 칸이에요.
      x-corthex:
        id: API-109
        spec:
        - SPEC-159
        - SPEC-162
        - SPEC-164
        omit:
          '404': 일기가 없는 달은 빈 목록
          '409': 읽기만 함
          '429': 읽기만 함
      parameters:
      - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: 그 달의 일기 날짜들(없으면 빈 목록)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthDays'
              examples:
                november:
                  value:
                    month: '2026-11'
                    days:
                    - date: '2026-11-14'
                      weather: cloudy
                      stamped: false
                    - date: '2026-11-17'
                      weather: rain
                      stamped: true
                empty:
                  value:
                    month: '2026-10'
                    days: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/diary/api/days/{date}:
    get:
      operationId: getDiaryDay
      summary: 일기장 한 날
      description: 로그인한 친구 자신의 그 날 일기를 줘요. 준비된 일기면 지금 판(제목, 마음 날씨, 글), 그림, 숨김, 도장, 고치는 중·그리는 중, 남은 고치기와 다시 그리기 수와 막힌 이유, 마지막 다시 그리기 결과가 있어요. 앞·뒤 날은 상태와 상관없이 늘 있어요(SPEC-159). 다시 그리기 뒤에는 화면이 2초마다 이 주소를 2분까지 불러 끝을 봐요(SPEC-161). 숨긴 날도 내용과 hidden true로 줘요(숨긴 일기 목록에서 열 때).
      x-corthex:
        id: API-110
        spec:
        - SPEC-158
        - SPEC-159
        - SPEC-160
        - SPEC-161
        - SPEC-163
        - SPEC-164
        omit:
          '404': 일기가 없는 날, 미래, 다른 친구에게 간 주소는 state none(200)
          '409': 읽기만 함
          '429': 읽기만 함. 다시 그리기 뒤 2초마다 불러도 돼요
      parameters:
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: 그 날 일기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryDay'
              examples:
                ready:
                  value:
                    date: '2026-11-16'
                    state: ready
                    prev: '2026-11-14'
                    next: null
                    diary:
                      revision: 2
                      title: 라면 먹은 날
                      weather: sunny
                      body: 오늘은 시험이 끝났다는 얘기를 들었다. 저녁은 떡볶이가 아니라 라면이었다고 해서 같이 웃었다. 나는 군밤이 먹고 싶었지만 꾹 참았다. 내일도 재밌는 얘기를 많이 해야지.
