          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteDiaryLook
      summary: 내 모습 카드 비우기
      description: 카드를 비워요. 다음 쓰기부터 친구가 나오지 않는 장면만 써요(REQ-174). 이미 비어 있어도 204예요.
      x-corthex:
        id: API-120
        spec:
        - SPEC-166
        omit:
          '400': 입력이 없음
          '404': 비어 있어도 204
          '409': 비어 있어도 204
          '429': 고치기와 다시 그리기만 1분 한도가 있음
      responses:
        '204':
          description: 비웠어요
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
components:
  x-corthex:
    errors:
      invalid_request:
        status: 400
        meaning: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖, 없는 날짜, 같은 멱등 키를 다른 일에 씀)
        message: 뭔가 잘못 보냈나 봐. 다시 해 볼게
        client: 고칠 말·바꿀 점의 칸 오류면 그 칸 옆에 보이고, 아니면 오류 상태와 추적 id
      unauthenticated:
        status: 401
        meaning: Access 로그인 증명이 없거나 맞지 않음
        message: 다시 들어와 줘
        client: 페이지를 새로 불러 Access 로그인으로
      not_allowed:
        status: 403
        meaning: 허용 목록에 없는 계정이거나 통화하는 친구가 꺼짐
        message: 이 계정으로는 일기장을 열 수 없어
        client: 쓸 수 없는 계정 상태. 다시 시도하지 않음
      cross_site:
        status: 403
        meaning: 다른 사이트에서 온 쓰기 요청
        message: 이 화면에서 다시 해 줘
        client: 오류 상태. 자동으로 다시 보내지 않음
      no_dm:
        status: 403
        meaning: 이 친구의 디스코드 DM 연결이 없거나 아직 DM을 한 번도 보내지 않음
        message: 디스코드 DM에서 마롱이한테 먼저 말 걸어 줘
        client: 디스코드 DM 먼저 상태. 다시 시도하지 않음
      not_found:
        status: 404
        meaning: 없는 그림이거나 로그인한 친구의 그림이 아님(형식이 틀린 id 포함)
        message: 그림을 찾지 못했어
        client: 그림 자리에 기본 그림을 보임
      stale_revision:
        status: 409
        meaning: 보낸 판 번호가 지금 판과 다름(그 사이 다른 화면에서 바뀜)
        message: 그 사이 일기가 바뀌었어. 새로 보여 줄게
        client: 한 날을 다시 불러 보여 주고, 쓴 고칠 말은 지우지 않음
      busy:
        status: 409
        meaning: 이 일기를 고치거나 다시 그리는 중(같은 멱등 키의 처음 요청이 아직 도는 중 포함)
        message: 지금 일기를 고치는 중이야. 조금만 기다려 줘
        client: 한 날을 2초마다 다시 불러 busy가 풀리면 버튼을 엶
      not_ready:
        status: 409
        meaning: 준비된(ready) 일기가 아님(쓰는 중, 쉰 날, 못 쓴 날, 없음)
        message: 아직 바꿀 수 있는 일기가 아니야
        client: 한 날을 다시 불러 그 상태를 보여 줌
      fix_limit:
        status: 409
        meaning: 이 일기의 고치기 다섯 번을 다 씀
        message: 이 일기는 다섯 번 다 고쳤어
        client: 고치기 버튼을 막음
      redraw_limit:
        status: 409
        meaning: 이 일기의 다시 그리기 두 번을 다 씀
        message: 그림은 두 번 다 다시 그렸어
        client: 다시 그리기 버튼을 막음
      too_many_requests:
        status: 429
        meaning: 고치기와 다시 그리기를 합쳐 1분에 5번 넘게 보냄
        message: 너무 빨라! 조금 있다가 해 줘
        client: Retry-After까지 버튼을 막고 남은 초를 보여 줌. 쓴 말은 지우지 않음
      drawing_budget:
        status: 429
        meaning: 이번 달(한국 시각) 그림 월 예산을 다 씀
        message: 이번 달 그림을 다 그렸어. 다음 달에 또 그려 줄게
        client: 다시 그리기 버튼을 막음
      fix_failed:
        status: 503
        meaning: 고치기 모델이 실패함(시간 넘김, 연결 오류, 5xx, 거절, 키 없음, 한도, 형식 틀림). 판과 남은 횟수는 그대로
        message: 지금은 못 고쳤어. 조금 있다가 다시 해 볼래?
        client: 쓴 고칠 말을 그대로 두고 다시 보내기 버튼
      db_unavailable:
        status: 503
        meaning: DB나 Access 공개키에 닿지 않음
        message: 잠깐 문제가 생겼어. 조금 있다가 다시 해 줘
        client: 다시 연결하는 중 상태. 5초 뒤부터 늘려 가며 다시
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태, 다시 시도, 추적 id 보여 줌
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access가 붙이는 JWT(RS256). 봇이 Access 공개키로 서명·aud·iss·exp를 확인하고 email을 허용 목록과 맞춘 뒤 sha256으로 통화 친구를 찾아요. 브라우저가 직접 넣지 않아요.
  headers:
    RetryAfter:
      description: 다시 보낼 수 있을 때까지의 초
      schema:
        type: string
        pattern: ^[0-9]{1,3}$
    CacheImmutable:
      description: 그림 id는 바뀌지 않아서 그 기기에만 1년 남겨요
      schema:
        type: string
        const: private, max-age=31536000, immutable
  parameters:
    Date:
      name: date
      in: path
      required: true
      description: 일기 날짜(그 일기 하루가 시작한 한국 날짜). 없는 날짜(2026-02-30)는 400
      schema:
        $ref: '#/components/schemas/DiaryDate'
    Month:
      name: month
      in: query
      required: true
      description: 달력의 달(일기 날짜 기준)
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    Before:
      name: before
      in: query
      required: false
      description: 이 날짜보다 이른 숨긴 일기(다음 묶음). 없으면 가장 늦은 것부터
      schema:
        $ref: '#/components/schemas/DiaryDate'
    DrawingId:
      name: id
      in: path
      required: true
      description: 그림 id(TBL-108 id). 형식이 틀려도 404
      schema:
        type: string
        format: uuid
        maxLength: 36
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 화면이 누를 때마다 만드는 UUID. 다시 보낼 때 같은 값을 써요(TBL-109)
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  responses:
    BadRequest:
      description: 요청이 틀림
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too-long:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: text
                  reason: too_long
            bad-date:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: date
                  reason: bad_format
            key-reused:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: Idempotency-Key
                  reason: reused
    Unauthenticated:
      description: 로그인 증명이 없거나 맞지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
