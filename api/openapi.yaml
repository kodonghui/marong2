components:
  x-corthex:
    errors:
      invalid_request:
        status: 400
        meaning: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
        message: 뭔가 잘못 보냈나 봐. 다시 해 볼게
        client: 한 번 다시 보내고, 또 오면 오류 상태와 추적 id
      unauthenticated:
        status: 401
        meaning: Access 로그인 증명이 없거나 맞지 않음
        message: 다시 들어와 줘
        client: 통화 중이 아니면 페이지를 새로 불러 Access 로그인으로. 통화 중이면 통화는 두고 신호 실패로 둠
      not_allowed:
        status: 403
        meaning: 허용 목록에 없는 계정이거나 통화하는 친구가 꺼짐
        message: 이 계정으로는 마롱이랑 통화할 수 없어
        client: 권한 상태. 다시 시도하지 않음
      cross_site:
        status: 403
        meaning: 다른 사이트에서 온 쓰기 요청
        message: 이 화면에서 다시 해 줘
        client: 오류 상태. 자동으로 다시 보내지 않음
      not_found:
        status: 404
        meaning: 없는 통화·기억이거나 이 친구 것이 아님
        message: 이미 지워졌거나 없는 통화야
        client: 목록으로. 지우기 뒤의 404는 이미 지워진 것으로 처리
      already_connecting:
        status: 409
        meaning: 같은 화면의 걸기가 이미 진행 중
        message: (보여 주지 않음)
        client: 먼저 보낸 걸기의 결과를 기다림
      taken_over:
        status: 409
        meaning: 다른 화면이 이 통화를 가져감
        message: 다른 화면에서 통화 중이야
        client: 통화 중 화면의 taken-over 상태와 '여기서 받기'
      stale_segment:
        status: 409
        meaning: 직전 구간이 이 통화의 마지막 구간이 아님(이미 누가 새 구간을 엶)
        message: (보여 주지 않음)
        client: 신호를 바로 보내 상태를 다시 맞춤
      call_ended:
        status: 409
        meaning: 통화가 이미 끝남
        message: 통화가 끝났어
        client: 통화 중 화면의 ended 상태와 다시 걸기
      call_active:
        status: 409
        meaning: 진행 중이거나 쉬는 중인 통화는 지울 수 없음
        message: 통화 끝나고 지울 수 있어
        client: 상세 화면에 안내 한 줄
      budget_exhausted:
        status: 429
        meaning: 이번 달(UTC) 통화 예산을 다 써서 새 통화를 막음
        message: 이번 달 통화는 여기까지야. 다음 달에 또 걸어 줘. 카톡으로는 계속 얘기할 수 있어!
        client: 통화 홈의 budget 상태. retryAt까지 통화 버튼을 막음
      budget_hard_stop:
        status: 429
        meaning: 이번 달 예산의 120%에 이르러 하던 통화도 끝냄
        message: 이번 달 통화는 여기까지야. 다음 달에 또 걸어 줘. 카톡으로는 계속 얘기할 수 있어!
        client: 통화를 끝내고 ended 상태에 이유 한 줄
      reconnect_limit:
        status: 429
        meaning: 10분 안에 자동 재연결이 3번을 넘음
        message: 연결이 자꾸 끊겨서 잠깐 끊을게. 다시 걸어 줘
        client: 통화를 끝내고 다시 걸기
      takeover_limit:
        status: 429
        meaning: 10분 안에 넘겨받기가 6번을 넘음
        message: 화면을 너무 자주 옮겼어. 조금 있다 다시 걸어 줘
        client: 안내 한 줄. 자동으로 다시 하지 않음
      capacity_full:
        status: 503
        meaning: 서버 전체 열린 구간이 3개
        message: 지금 전화가 몰렸어. 조금 있다 다시 걸어 줘
        client: 재연결이면 2초·5초 뒤 다시, 새 통화면 다시 걸기
      voice_unavailable:
        status: 503
        meaning: OpenAI 세션을 못 만듦(키 없음, OpenAI 오류·한도·10초 넘김)
        message: 마롱이가 지금 전화를 못 받아. 조금 있다 다시 걸어 줘
        client: 재연결이면 2초·5초 뒤 다시, 새 통화면 다시 걸기
      auth_unavailable:
        status: 503
        meaning: Access 공개키를 못 받아 로그인을 확인할 수 없음
        message: 잠깐 문제가 생겼어. 조금 있다 다시 해 줘
        client: 오류 상태와 다시 시도
      db_unavailable:
        status: 503
        meaning: DB에 닿지 못함
        message: 잠깐 문제가 생겼어. 조금 있다 다시 해 줘
        client: 오류 상태와 다시 시도
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태, 다시 시도, 추적 id 보여 줌
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access가 붙이는 JWT(RS256). 서버가 Access 공개키로 서명·aud·iss·exp를 확인하고 email의 sha256을 허용 목록과 맞춰요. 브라우저가 직접 넣지 않아요.
  headers:
    RetryAfter:
      description: 다시 해 볼 수 있는 때(초 또는 HTTP 날짜)
      schema:
        type: string
        maxLength: 40
  parameters:
    CallId:
      name: callId
      in: path
      required: true
      description: 통화 id(TBL-003 id)
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Cursor:
      name: cursor
      in: query
      required: false
      description: 앞 쪽 응답의 nextCursor
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: ^[A-Za-z0-9_-]+$
    Limit20:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Limit50:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 300
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - invalid_request
          - unauthenticated
          - not_allowed
          - cross_site
          - not_found
          - already_connecting
          - taken_over
          - stale_segment
          - call_ended
          - call_active
          - budget_exhausted
          - budget_hard_stop
          - reconnect_limit
          - takeover_limit
          - capacity_full
          - voice_unavailable
          - auth_unavailable
          - db_unavailable
          - internal
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
        retryAt:
          type: string
          format: date-time
          description: 예산 오류에서 다음 달 시작(UTC)
        errors:
          type: array
          maxItems: 10
          description: 검증 오류 위치. 보낸 값은 담지 않음
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                enum:
                - sdp
                - clientId
                - mode
                - previousSegmentId
                - segmentId
                - quietMs
                - micActive
                - limit
                - cursor
                - callId
                - memoryId
                - body
              reason:
                type: string
                enum:
                - required
                - too_short
                - too_long
                - bad_format
                - out_of_range
            additionalProperties: false
      additionalProperties: false
    Me:
      type: object
      required:
      - caller
      - canCall
      - blockedReason
      - activeCall
      additionalProperties: false
      properties:
        caller:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: 카톡 친구 이름(marong.friends.name)
        canCall:
          type: boolean
        blockedReason:
          type:
          - string
          - 'null'
          enum:
          - budget
          - null
        activeCall:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ActiveCall'
    ActiveCall:
      type: object
      required:
      - id
      - status
      - thisClient
      - lastBeatAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        status:
          type: string
          enum:
          - live
          - resting
        thisClient:
          type: boolean
        lastBeatAt:
          type: string
          format: date-time
    StartCallRequest:
      type: object
      required:
      - sdp
      - clientId
      additionalProperties: false
      properties:
        sdp:
          type: string
          minLength: 10
          maxLength: 32768
          pattern: ^v=0
          description: WebRTC SDP. 32KB까지(SPEC-003)
        clientId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: 페이지를 열 때 만든 화면 id
    SegmentRequest:
      type: object
      required:
      - sdp
      - clientId
      - mode
      - previousSegmentId
      additionalProperties: false
      properties:
        sdp:
          type: string
          minLength: 10
          maxLength: 32768
          pattern: ^v=0
          description: WebRTC SDP. 32KB까지(SPEC-003)
        clientId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        mode:
          type: string
          enum:
          - reconnect
          - wake
        previousSegmentId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: 이 화면이 마지막으로 가진 구간
    SegmentRef:
      type: object
      required:
      - id
      - mode
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        mode:
          type: string
          enum:
          - start
          - reconnect
          - wake
          - takeover
    CallStarted:
      type: object
      required:
      - call
      - segment
      - sdp
      additionalProperties: false
      properties:
        call:
          type: object
          required:
          - id
          - status
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            status:
              type: string
              enum:
              - live
        segment:
          $ref: '#/components/schemas/SegmentRef'
        sdp:
          type: string
          minLength: 10
          maxLength: 32768
          pattern: ^v=0
          description: OpenAI가 준 answer SDP
    SegmentOpened:
      type: object
      required:
      - segment
      - sdp
      additionalProperties: false
      properties:
        segment:
          $ref: '#/components/schemas/SegmentRef'
        sdp:
          type: string
          minLength: 10
          maxLength: 32768
          pattern: ^v=0
          description: WebRTC SDP. 32KB까지(SPEC-003)
    BeatRequest:
      type: object
      required:
      - clientId
      - segmentId
      - quietMs
      - micActive
      additionalProperties: false
      properties:
        clientId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        segmentId:
          oneOf:
          - type: 'null'
          - type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: 쉬는 중이면 null
        quietMs:
          type: integer
          minimum: 0
          maximum: 86400000
          description: 화면이 잰 마지막 말소리 뒤 시간
        micActive:
          type: boolean
    BeatResponse:
      type: object
      required:
      - action
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - none
          - rest
          - taken_over
          - ended
        endReason:
          type: string
          enum:
          - hangup
          - beat_lost
          - reconnect_limit
          - budget_hard_stop
          - admin
          description: action이 ended일 때만
    HangupRequest:
      type: object
      required:
      - clientId
      additionalProperties: false
      properties:
        clientId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    HangupResponse:
      type: object
      required:
      - call
      additionalProperties: false
      properties:
        call:
          type: object
          required:
          - id
          - status
          - endReason
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            status:
              type: string
              enum:
              - ended
            endReason:
              type: string
              enum:
              - hangup
              - beat_lost
              - reconnect_limit
              - budget_hard_stop
              - admin
    CallSummary:
      type: object
      required:
      - id
      - status
      - startedAt
      - endedAt
      - durationSeconds
      - organizeStatus
      - title
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        status:
          type: string
          enum:
          - live
          - resting
          - ended
        startedAt:
          type: string
          format: date-time
        endedAt:
          oneOf:
          - type: 'null'
          - type: string
            format: date-time
        durationSeconds:
          type: integer
          minimum: 0
          description: 구간이 열려 있던 시간의 합
        organizeStatus:
          type: string
          enum:
          - none
          - pending
          - running
          - done
          - skipped
          - failed
        title:
          type:
          - string
          - 'null'
          maxLength: 40
          description: 카드 요약 앞 40자
    CallList:
      type: object
      required:
      - items
      - nextCursor
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CallSummary'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 200
    Card:
      type: object
      required:
      - summary
      - decided
      - undecided
      - todos
      - askNext
      - truncated
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 400
        decided:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 100
        undecided:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 100
        todos:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 100
        askNext:
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 100
        truncated:
          type: boolean
    Turn:
      type: object
      required:
      - id
      - seq
      - role
      - content
      - startedAt
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        seq:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
          minLength: 1
          maxLength: 4000
        startedAt:
          type: string
          format: date-time
    MemoryItem:
      type: object
      required:
      - id
      - content
      - createdAt
      - callId
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
          minLength: 2
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        callId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    MemoryList:
      type: object
      required:
      - items
      - nextCursor
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MemoryItem'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 200
    CallDetail:
      type: object
      required:
      - call
      - card
      - memories
      - turns
      - transcriptDeletedAt
      additionalProperties: false
      properties:
        call:
          allOf:
          - $ref: '#/components/schemas/CallSummary'
          - type: object
            required:
            - endReason
            properties:
              endReason:
                oneOf:
                - type: 'null'
                - type: string
                  enum:
                  - hangup
                  - beat_lost
                  - reconnect_limit
                  - budget_hard_stop
                  - admin
        card:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Card'
        memories:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MemoryItem'
        turns:
          oneOf:
          - type: 'null'
          - type: array
            items:
              $ref: '#/components/schemas/Turn'
          description: 자막을 지운 통화는 null
        transcriptDeletedAt:
          oneOf:
          - type: 'null'
          - type: string
            format: date-time
    Health:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
