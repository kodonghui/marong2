# 마롱이 통화 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/spec.md, DB: marong/call/schema.sql
openapi: 3.1.0
info:
  title: 마롱이 통화 API
  version: 0.1.0-draft
  description: |-
    마롱이 통화 웹앱(PWA)과 통화 서버 사이의 계약이에요. 원본은 이 파일이고 코드는 이 파일을 따라가요(06단계).

    - 음성은 이 API를 지나지 않아요. 휴대폰과 OpenAI가 WebRTC로 직접 주고받고, 서버는 sideband로 같은 세션을 지켜봐요(REQ-026).
    - 모든 요청은 Cloudflare Access를 지나요. 서버는 `Cf-Access-Jwt-Assertion`을 다시 확인해요(SPEC-001). 쓰기 요청은 `Origin`이 앱 주소여야 해요(REQ-006).
    - 오류는 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요.

    계약에서 정한 것(Claude 제안, 2026-11-12, 검토 대상):
    1. 검증 오류는 400을 써요(422는 쓰지 않음).
    2. id 형식이 틀리면 400, 없거나 남의 것이면 404예요. 남의 것인지는 드러내지 않아요.
    3. 끊기를 다시 보내면 같은 200이에요. 지우기를 다시 보내면 404이고 화면은 '이미 지워졌어요'로 처리해요.
    4. 예산 한도는 성공이 아니라 429 오류예요. OpenAI 쪽 한도(429)는 우리 예산 오류로 바꾸지 않고 503 `voice_unavailable`로 내요.
    5. 신호(beat)는 상태가 맞지 않아도 409 대신 200의 `action`으로 알려 줘요.
    6. 새 통화는 201, 다른 화면의 통화를 넘겨받으면 200이에요.

    Open: 개발 서버에서 계약 시험(Schemathesis)을 돌릴 때 쓸 시험용 Access JWT 서명 키는 11단계에서 정해요.
    Open: 주소 `marong.corthex-hq.com`은 제안이에요(REQ-058).
servers:
- url: https://marong.corthex-hq.com
  description: 제안 주소(Cloudflare Access 뒤)
- url: http://127.0.0.1:8790
  description: 서버 안에서 직접(배포 확인용)
security:
- cfAccess: []
paths:
  /api/me:
    get:
      operationId: getMe
      summary: 내 상태 보기
      description: 통화 홈이 열릴 때와 돌아올 때 불러요. 예산 금액·80% 경고·이메일은 담지 않아요(SPEC-002).
      x-corthex:
        id: API-001
        spec:
        - SPEC-001
        - SPEC-002
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음
          '409': 읽기만 함
      security:
      - cfAccess: []
      responses:
        '200':
          description: 내 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                normal:
                  value:
                    caller:
                      name: 현경
                    canCall: true
                    blockedReason: null
                    activeCall: null
                budget-blocked:
                  value:
                    caller:
                      name: 현경
                    canCall: false
                    blockedReason: budget
                    activeCall: null
                active-elsewhere:
                  value:
                    caller:
                      name: 현경
                    canCall: true
                    blockedReason: null
                    activeCall:
                      id: 8f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
                      status: live
                      thisClient: false
                      lastBeatAt: '2026-11-12T12:00:15Z'
        '401':
          description: 로그인 증명이 없거나 맞지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-proof:
                  value:
                    type: https://marong.corthex-hq.com/problems/unauthenticated
                    title: Access 로그인 증명이 없거나 맞지 않음
                    status: 401
                    code: unauthenticated
                    traceId: 0af7651916cd43dd
        '403':
          description: 허용되지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                not-allowed:
                  value:
                    type: https://marong.corthex-hq.com/problems/not-allowed
                    title: 허용 목록에 없는 계정이거나 통화하는 친구가 꺼짐
                    status: 403
                    code: not_allowed
                    traceId: 4bf92f3577b34da6
        '503':
          description: 잠깐 쓸 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                auth-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/auth-unavailable
                    title: Access 공개키를 못 받아 로그인을 확인할 수 없음
                    status: 503
                    code: auth_unavailable
                    traceId: e457b5a2e4d86bd1
                db-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/db-unavailable
                    title: DB에 닿지 못함
                    status: 503
                    code: db_unavailable
                    traceId: 7c3e1f2a9b8d4c60
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        default:
          description: 예상하지 못한 오류
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  value:
                    type: https://marong.corthex-hq.com/problems/internal
                    title: 예상하지 못한 서버 오류
                    status: 500
                    code: internal
                    traceId: 1d2c3b4a59687f0e
  /api/calls:
    post:
      operationId: startCall
      summary: 통화 걸기(진행 중 통화가 있으면 넘겨받기)
      description: 새 통화면 201, 다른 화면의 진행 중 통화를 넘겨받으면 200이에요(SPEC-003, SPEC-009). 음성은 이 API를 지나지 않고 휴대폰과 OpenAI 사이 WebRTC로 오가요. 쓰기 요청이라 Origin이 앱 주소여야 해요.
      x-corthex:
        id: API-002
        spec:
        - SPEC-001
        - SPEC-003
        - SPEC-004
        - SPEC-005
        - SPEC-009
        - SPEC-023
        omit:
          '404': 경로가 id를 담지 않음. 진행 중 통화는 서버가 찾음
      security:
      - cfAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCallRequest'
            examples:
              new-call:
                value:
                  sdp: "v=0\r\no=- 4611731400430051336 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n(이하 생략)"
                  clientId: 2b7e1516-28ae-4d2a-9b1f-3c4d5e6f7a8b
      responses:
        '201':
          description: 새 통화를 걸었음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallStarted'
              examples:
                new-call:
                  value:
                    call:
                      id: 8f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
                      status: live
                    segment:
                      id: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
                      mode: start
                    sdp: "v=0\r\no=- 1234567890 2 IN IP4 0.0.0.0\r\ns=-\r\nt=0 0\r\n(이하 생략)"
        '200':
          description: 진행 중 통화를 이 화면으로 넘겨받았음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallStarted'
              examples:
                takeover:
                  value:
                    call:
                      id: 8f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
                      status: live
                    segment:
                      id: 6e7f8091-ab2c-4d3e-9f40-5b6c7d8e9fa0
                      mode: takeover
                    sdp: "v=0\r\no=- 1234567890 2 IN IP4 0.0.0.0\r\ns=-\r\nt=0 0\r\n(이하 생략)"
        '400':
          description: 요청이 틀림
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bad-sdp:
                  value:
                    type: https://marong.corthex-hq.com/problems/invalid-request
                    title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                    status: 400
                    code: invalid_request
                    traceId: 0af7651916cd43dd
                    detail: sdp가 v=0으로 시작하지 않음
                    errors:
                    - field: sdp
                      reason: bad_format
        '401':
          description: 로그인 증명이 없거나 맞지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-proof:
                  value:
                    type: https://marong.corthex-hq.com/problems/unauthenticated
                    title: Access 로그인 증명이 없거나 맞지 않음
                    status: 401
                    code: unauthenticated
                    traceId: 0af7651916cd43dd
        '403':
          description: 허용되지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                not-allowed:
                  value:
                    type: https://marong.corthex-hq.com/problems/not-allowed
                    title: 허용 목록에 없는 계정이거나 통화하는 친구가 꺼짐
                    status: 403
                    code: not_allowed
                    traceId: 00f067aa0ba902b7
                cross-site:
                  value:
                    type: https://marong.corthex-hq.com/problems/cross-site
                    title: 다른 사이트에서 온 쓰기 요청
                    status: 403
                    code: cross_site
                    traceId: 53995c3f42cd8ad8
        '409':
          description: 지금 상태와 맞지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                already-connecting:
                  value:
                    type: https://marong.corthex-hq.com/problems/already-connecting
                    title: 같은 화면의 걸기가 이미 진행 중
                    status: 409
                    code: already_connecting
                    traceId: 4bf92f3577b34da6
        '429':
          description: 한도에 닿음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                budget-exhausted:
                  value:
                    type: https://marong.corthex-hq.com/problems/budget-exhausted
                    title: 이번 달(UTC) 통화 예산을 다 써서 새 통화를 막음
                    status: 429
                    code: budget_exhausted
                    traceId: 00f067aa0ba902b7
                    retryAt: '2026-12-01T00:00:00Z'
                budget-hard-stop:
                  value:
                    type: https://marong.corthex-hq.com/problems/budget-hard-stop
                    title: 이번 달 예산의 120%에 이르러 하던 통화도 끝냄
                    status: 429
                    code: budget_hard_stop
                    traceId: 53995c3f42cd8ad8
                    retryAt: '2026-12-01T00:00:00Z'
                takeover-limit:
                  value:
                    type: https://marong.corthex-hq.com/problems/takeover-limit
                    title: 10분 안에 넘겨받기가 6번을 넘음
                    status: 429
                    code: takeover_limit
                    traceId: b7ad6b7169203331
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '503':
          description: 잠깐 쓸 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                voice-unavailable:
                  value:
                    type: https://marong.corthex-hq.com/problems/voice-unavailable
                    title: OpenAI 세션을 못 만듦(키 없음, OpenAI 오류·한도·10초 넘김)
                    status: 503
                    code: voice_unavailable
                    traceId: e457b5a2e4d86bd1
                capacity-full:
                  value:
                    type: https://marong.corthex-hq.com/problems/capacity-full
                    title: 서버 전체 열린 구간이 3개
                    status: 503
                    code: capacity_full
                    traceId: 7c3e1f2a9b8d4c60
                auth-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/auth-unavailable
                    title: Access 공개키를 못 받아 로그인을 확인할 수 없음
                    status: 503
                    code: auth_unavailable
                    traceId: 1d2c3b4a59687f0e
                db-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/db-unavailable
                    title: DB에 닿지 못함
                    status: 503
                    code: db_unavailable
                    traceId: 0af7651916cd43dd
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        default:
          description: 예상하지 못한 오류
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  value:
                    type: https://marong.corthex-hq.com/problems/internal
                    title: 예상하지 못한 서버 오류
                    status: 500
                    code: internal
                    traceId: 1d2c3b4a59687f0e
    get:
      operationId: listCalls
      summary: 지난 통화 목록
      description: 최근순 커서 쪽 나눔이에요(SPEC-018). 목록에는 자막·기억 내용이 없어요.
      x-corthex:
        id: API-006
        spec:
        - SPEC-018
        omit:
          '404': 경로가 id를 담지 않음
          '409': 읽기만 함
      security:
      - cfAccess: []
      parameters:
      - $ref: '#/components/parameters/Limit20'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 통화 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallList'
              examples:
                page:
                  value:
                    items:
                    - id: 8f1c2d3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
                      status: ended
                      startedAt: '2026-11-12T12:00:00Z'
                      endedAt: '2026-11-12T12:42:10Z'
                      durationSeconds: 2530
                      organizeStatus: done
                      title: 면접 준비랑 주말 성수 카페 얘기
                    nextCursor: MjAyNi0xMS0xMlQxMjowMDowMFp8OGYxYw
                empty:
                  value:
                    items: []
                    nextCursor: null
        '400':
          description: 요청이 틀림
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bad-cursor:
                  value:
                    type: https://marong.corthex-hq.com/problems/invalid-request
                    title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                    status: 400
                    code: invalid_request
                    traceId: 4bf92f3577b34da6
                    detail: 커서를 읽을 수 없음
                    errors:
                    - field: cursor
                      reason: bad_format
                bad-limit:
                  value:
                    type: https://marong.corthex-hq.com/problems/invalid-request
                    title: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖)
                    status: 400
                    code: invalid_request
                    traceId: 00f067aa0ba902b7
                    detail: limit은 1~50
                    errors:
                    - field: limit
                      reason: out_of_range
        '401':
          description: 로그인 증명이 없거나 맞지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                no-proof:
                  value:
                    type: https://marong.corthex-hq.com/problems/unauthenticated
                    title: Access 로그인 증명이 없거나 맞지 않음
                    status: 401
                    code: unauthenticated
                    traceId: 0af7651916cd43dd
        '403':
          description: 허용되지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                not-allowed:
                  value:
                    type: https://marong.corthex-hq.com/problems/not-allowed
                    title: 허용 목록에 없는 계정이거나 통화하는 친구가 꺼짐
                    status: 403
                    code: not_allowed
                    traceId: 4bf92f3577b34da6
        '503':
          description: 잠깐 쓸 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                auth-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/auth-unavailable
                    title: Access 공개키를 못 받아 로그인을 확인할 수 없음
                    status: 503
                    code: auth_unavailable
                    traceId: e457b5a2e4d86bd1
                db-down:
                  value:
                    type: https://marong.corthex-hq.com/problems/db-unavailable
                    title: DB에 닿지 못함
                    status: 503
                    code: db_unavailable
                    traceId: 7c3e1f2a9b8d4c60
