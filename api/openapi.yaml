              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                server-error:
                  value:
                    type: https://marong.corthex-hq.com/problems/internal
                    title: 예상하지 못한 서버 오류
                    status: 500
                    code: internal
                    traceId: 1d2c3b4a59687f0e
  /api/calls/{callId}/segments:
    post:
      operationId: openSegment
      summary: 같은 통화에 새 구간 열기(재연결·깨우기)
      description: 끊김 뒤 자동 재연결(`reconnect`, SPEC-007)과 쉬다가 깨우기(`wake`, SPEC-008, 결정 대기)가 같은 길을 써요. 예산을 다 써도(100%) 하던 통화라 열어 주고, 120%면 막아요.
      x-corthex:
        id: API-003
        spec:
        - SPEC-004
        - SPEC-007
        - SPEC-008
        - SPEC-023
      security:
      - cfAccess: []
      parameters:
      - $ref: '#/components/parameters/CallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
            examples:
              reconnect:
                value:
                  sdp: "v=0\r\no=- 4611731400430051336 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n(이하 생략)"
                  clientId: 2b7e1516-28ae-4d2a-9b1f-3c4d5e6f7a8b
                  mode: reconnect
                  previousSegmentId: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
              wake:
                value:
                  sdp: "v=0\r\no=- 4611731400430051336 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n(이하 생략)"
                  clientId: 2b7e1516-28ae-4d2a-9b1f-3c4d5e6f7a8b
                  mode: wake
                  previousSegmentId: 5d6e7f80-9a1b-4c2d-8e3f-4a5b6c7d8e9f
      responses:
        '201':
          description: 새 구간을 열었음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentOpened'
              examples:
                reconnect:
                  value:
                    segment:
                      id: 6e7f8091-ab2c-4d3e-9f40-5b6c7d8e9fa0
                      mode: reconnect
                    sdp: "v=0\r\no=- 1234567890 2 IN IP4 0.0.0.0\r\ns=-\r\nt=0 0\r\n(이하 생략)"
                wake:
                  value:
                    segment:
                      id: 6e7f8091-ab2c-4d3e-9f40-5b6c7d8e9fa0
                      mode: wake
                    sdp: "v=0\r\no=- 1234567890 2 IN IP4 0.0.0.0\r\ns=-\r\nt=0 0\r\n(이하 생략)"
        '400':
          description: 요청이 틀림
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                bad-mode:
