# 마롱이 성향 맞춤·친구 기억 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/persona.md(SPEC-192~242), DB: marong/migrations/019_persona.sql(TBL-115~124, TBL-127~134), 표 설명: docs/05-erd/persona.md
openapi: 3.1.0
info:
  title: 마롱이 성향 맞춤·친구 기억 API
  version: 0.1.0-draft
  description: |-
    앱과 브라우저의 친구 약속 화면(SCR-120), 맞춤형 지침 화면(SCR-121), '마롱이가 기억하는 나'(SCR-122), 글 대화 안 고르기 카드(SCR-123)가 디스코드 DM 봇의 글 대화 서버와 주고받는 계약이에요. 원본은 이 파일이고 코드는 이 파일을 따라가요(06단계). 글 대화 API(`api/app-chat.openapi.yaml`)와 같은 서버(127.0.0.1:8796)·같은 로그인이고, 새 모듈 `marong/app_persona.py`가 `/chat/persona/` 아래를 맡아요. 터널 규칙·Access·앱은 바꾸지 않아요.

    - 로그인은 글 대화와 같아요. 봇이 `Cf-Access-Jwt-Assertion`을 다시 확인하고 이메일 해시로 통화 친구와 그 친구(`call.callers.friend_id`)를 찾아요. 모든 값은 그 친구 id로만 읽고 바꿔요. 경로에 친구 id가 없고, 남의 카드·규칙·기억 id는 없는 것과 같아요(404, 명세 공통 8).
    - 쓰기 요청(POST·PUT·PATCH·DELETE)은 `Origin`이 `https://marong.corthex-hq.com`이어야 해요. 본문은 16KB까지예요(글 대화와 같은 서버 한도).
    - 오류는 글 대화와 같은 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요.
    - 응답에는 근거 메시지 id, 방 키, 모델 이름, 위기 상태, 선톡 결과가 없어요. 로그에는 결과 코드, 개수, 친구의 짧은 키만 남겨요(명세 공통 10).
    - 디스코드 단추와 카톡 번호로 하는 카드 답은 봇 안의 처리라 이 계약에 없어요. 같은 처리(SPEC-192·193·196·197·231·238)를 API-136과 함께 써요.
    - 페이지(`/chat/persona/`, `/chat/persona/instructions`, `/chat/persona/memory`)와 그 js·css는 HTML과 파일이라 이 계약에 넣지 않았어요. 화면은 07 사이트맵과 08 화면 정의에 있어요.

    계약에서 정한 것(Claude 제안, 2026-11-17, 검토 대상).
    1. 검증 오류는 400이에요(422는 쓰지 않음). 글 대화·일기와 같아요. 경로 id의 형식이 틀리면 400, 없거나 남의 것이면 404예요.
    2. 바꾸는 요청이 지금 값과 같으면 200이고 아무것도 바뀌지 않아요(친구 약속 값, 같은 규칙 더하기, 이미 지운 규칙 지우기, 이미 잊은 항목 잊기, 같은 카드에 같은 답).
    3. 친구 약속은 나중 쓰기가 이겨요(명세 공통 11). 버전 번호를 받지 않아서 '그 사이 바뀜' 409가 없어요. 화면은 응답의 지금 값을 그대로 보여요.
    4. 선톡 정도를 올리는 요청(`off`→`less`·`normal`, `less`→`normal`)은 403 `needs_owner`이고 값은 그대로예요. 대화에서 말하면 `ask_owner`로 동희님께 남겨요(SPEC-202). 화면은 올리는 칸을 막아 두고 이 오류는 다른 화면에서 바뀐 경우에만 나와요.
    5. 먼저 전화(`callFirst`)는 보여 주기만 해요. 켜고 끄기는 선 전화 설정(TBL-126)의 말(SPEC-277)로 해요.
    6. 맞춤형 지침 저장은 AI-14를 부르고(10초) 결과를 받은 뒤에만 저장해요. 모델 실패(시간 넘김, 연결 오류, 5xx, 거절, 키 없음, 한도, 형식 틀림)는 모두 503 `ai_unavailable` 하나이고 아무것도 저장하지 않아요(SPEC-199). 종류는 TBL-133 `outcome`에만 남아요. 1분에 5번까지예요.
    7. 맞춤형 지침의 빈 글은 400이에요. 지우기는 DELETE로만 해요(대화의 빈 글은 봇이 지움으로 봐요).
    8. 잊기는 `Idempotency-Key`가 꼭 있어야 해요. 같은 키는 처음과 같은 결과(`forgot`, `messages`)를 돌려줘요(TBL-129 유니크).
    9. 카드 답은 카드 id와 값으로 해요. 같은 카드에 같은 값이면 200과 처음 결과, 다른 값이나 닫힌 카드(만료, 새 카드로 바뀜)면 409 `card_closed`예요. 첫 질문의 1·2번에 답하면 다음 질문 카드가 바로 새 마롱이 말로 붙어요(SPEC-192를 이렇게 읽음: 단추를 눌렀으면 '다음 답'을 기다리지 않음).
    10. 기억 목록은 '지금'과 '허락 기다림'이 아닌 지금 항목(`current`)과 열린 고리만 보여요. 기억 기능이 `on`이 아니면(off, shadow) 403 `feature_off`예요. 친구 약속과 맞춤형 지침은 `MARONG_FRIEND_CARD`가 꺼져 있으면 403 `feature_off`예요.

    Open: 잊기 결과의 '다시 쓰는 중'(요약·메모가 숨김 상태) 표시를 화면에 보일지는 08 단계에서 정해요. 지금 응답에는 넣지 않았어요.
servers:
- url: https://marong.corthex-hq.com
  description: Cloudflare Access 뒤. 터널이 /chat/ 아래만 봇으로 보내요
- url: http://127.0.0.1:8796
  description: 서버 안에서 직접(배포 확인용). Access 증명이 없어 API는 401이에요
security:
- cfAccess: []
paths:
  /chat/persona/api/card:
    get:
      operationId: getFriendCard
      summary: 내 친구 약속과 친구 규칙
      description: 친구 약속 화면(SCR-120)이 열릴 때 불러요. 약속이 없거나 만드는 중이어도 200이고 `state`로 알려요. 약속 문장은 코드의 문장 틀(명세 3.9)로 만든 것이에요.
      x-corthex:
        id: API-127
        spec:
        - SPEC-192
        - SPEC-193
        - SPEC-194
        - SPEC-195
        - SPEC-198
        - SPEC-202
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음. 약속이 없으면 200의 state none
          '409': 읽기만 함
          '429': 읽기만 함
      responses:
        '200':
          description: 지금 친구 약속
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              examples:
                set:
                  value:
                    state: set
                    values:
                      support: listen
                      advice: asked
                      honesty: gentle
                      lead: follow
                    proactive: normal
                    callFirst: true
                    sentence: 힘들다고 하면 일단 들을게, 조언은 네가 물어볼 때만 하고, 아닌 것 같을 땐 부드럽게 말할게
                    source: questions
                    setAt: '2026-11-18T10:05:00+09:00'
                    want: null
                    rules:
                    - id: 31
                      kind: no_vocative
                      text: 야
                    - id: 32
                      kind: call_me
                      text: 경아
                    ruleMax: 20
                none:
                  value:
                    state: none
                    values:
                      support: null
                      advice: null
                      honesty: null
                      lead: follow
                    proactive: normal
                    callFirst: true
                    sentence: null
                    source: null
                    setAt: null
                    want: null
                    rules: []
                    ruleMax: 20
                want-now:
                  value:
                    state: set
                    values:
                      support: listen
                      advice: asked
                      honesty: gentle
                      lead: follow
                    proactive: less
                    callFirst: false
                    sentence: 힘들다고 하면 일단 들을게, 조언은 네가 물어볼 때만 하고, 아닌 것 같을 땐 부드럽게 말할게
                    source: talk
                    setAt: '2026-11-18T10:05:00+09:00'
                    want:
                      value: solve
                      until: '2026-11-19T21:40:00+09:00'
                    rules: []
                    ruleMax: 20
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRead'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updateFriendCard
      summary: 친구 약속 값 바꾸기
      description: 화면에서 고른 값으로 친구 약속을 바꿔요(SCR-120). 약속이 아직 없거나(none, asking, draft) 초안 확인에서 '고칠래'를 골랐으면 세 값(support, advice, honesty)을 모두 보내야 하고, 받으면 바로 '설정됨'(source screen)이고, 열려 있던 첫 질문·초안 카드(TBL-119)는 같은 트랜잭션에서 replaced가 돼요(SCR-120). 이미 있으면 바꿀 값만 보내요. 친구 잠금 안에서 적용하고 다음 답부터 모든 방·통화가 읽어요. 선톡 정도는 내리기만 돼요.
      x-corthex:
        id: API-128
        spec:
        - SPEC-193
        - SPEC-194
        - SPEC-196
        - SPEC-202
        omit:
          '404': 경로가 id를 담지 않음
          '409': 나중 쓰기가 이김(계약 3)
          '429': DB 한 줄만 바꾸는 화면 단추
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardChange'
            examples:
              first-set:
                value:
                  support: solve
                  advice: sometimes
                  honesty: direct
              lower-proactive:
                value:
                  proactive: 'off'
              lead:
                value:
                  lead: lead
      responses:
        '200':
          description: 바뀐(또는 그대로인) 친구 약속
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
              examples:
                changed:
                  value:
                    state: set
                    values:
                      support: solve
                      advice: sometimes
                      honesty: direct
                      lead: follow
                    proactive: normal
                    callFirst: true
                    sentence: 힘들다고 하면 같이 방법을 찾아볼게, 괜찮아 보이면 가끔 조언도 하고, 아닌 것 같을 땐 솔직하게 말할게
                    source: screen
                    setAt: '2026-11-18T10:07:00+09:00'
                    want: null
                    rules: []
                    ruleMax: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CardForbidden'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/persona/api/rules:
    post:
      operationId: addFriendRule
      summary: 친구 규칙 더하기
      description: 금지 호칭, 싫은 주제, 부르는 이름을 더해요(SPEC-198). 같은 규칙이 이미 있으면 200과 그 규칙이에요. 부르는 이름은 하나라서 새 이름이 옛 이름을 대신해요(옛 줄은 removed_at). 종류마다 20개까지예요.
      x-corthex:
        id: API-129
        spec:
        - SPEC-198
        - SPEC-201
        - SPEC-212
        omit:
          '404': 경로가 id를 담지 않음
          '429': DB 한 줄만 바꾸는 화면 단추
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleNew'
            examples:
              vocative:
                value:
                  kind: no_vocative
                  text: 야
              topic:
                value:
                  kind: avoid_topic
                  text: 다이어트
      responses:
        '201':
          description: 더한 규칙
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                added:
                  value:
                    id: 33
                    kind: avoid_topic
                    text: 다이어트
        '200':
          description: 이미 있는 같은 규칙(아무것도 바뀌지 않음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                same:
                  value:
                    id: 31
                    kind: no_vocative
                    text: 야
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenWrite'
        '409':
          $ref: '#/components/responses/RuleLimit'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/persona/api/rules/{ruleId}:
    delete:
      operationId: removeFriendRule
      summary: 친구 규칙 지우기
      description: 규칙 줄에 removed_at을 적어요(줄은 지우지 않음, TBL-116). 다음 답부터 빠져요. 이미 지운 규칙이면 204예요.
      x-corthex:
        id: API-130
        spec:
        - SPEC-198
        omit:
          '409': 지운 규칙을 다시 지워도 204(계약 2)
          '429': DB 한 줄만 바꾸는 화면 단추
      parameters:
      - $ref: '#/components/parameters/RuleId'
      responses:
        '204':
          description: 지움(이미 지운 것 포함)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/persona/api/instructions:
    get:
      operationId: getCustomInstructions
      summary: 내 맞춤형 지침
      description: 맞춤형 지침 화면(SCR-121)이 열릴 때 불러요. 적은 글과 마롱이가 이해한 내용이에요. 없으면 200과 빈 값이에요.
      x-corthex:
        id: API-131
        spec:
        - SPEC-199
        - SPEC-200
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음. 없으면 200의 빈 값
          '409': 읽기만 함
          '429': 읽기만 함
      responses:
        '200':
          description: 지금 맞춤형 지침
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
              examples:
                written:
                  value:
                    text: 반말로 짧게 말해 줘. 내가 힘들다고 하면 해결책보다 먼저 들어줘. 밤에는 연락하지 마.
                    understood: 반말로 짧게 말하고, 힘들다고 하면 해결책보다 먼저 들어 줄게. 밤 연락은 선톡 줄이기로 옮겼어.
                    polite: false
                    version: 2
                    updatedAt: '2026-11-18T10:20:00+09:00'
                    max: 500
                empty:
                  value:
                    text: null
                    understood: null
                    polite: false
                    version: 3
                    updatedAt: '2026-11-19T09:00:00+09:00'
                    max: 500
                never:
                  value:
                    text: null
                    understood: null
                    polite: false
                    version: 0
                    updatedAt: null
                    max: 500
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRead'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
    put:
      operationId: putCustomInstructions
      summary: 맞춤형 지침 적기·고치기
      description: 글을 AI-14(10초)에 보내 이해한 내용, 꼭 지킬 것, 못 지키는 부분을 받아요. 받은 뒤 친구 잠금 안에서 저장하고, 꼭 지킬 것은 친구 규칙과 선톡 줄이기로 옮겨요(올리는 쪽은 옮기지 않고 동희님께 남김). 다시 확인하지 않아요(SPEC-199). 대화 중이면 다음 대화부터 쓰여요(SPEC-200).
      x-corthex:
        id: API-132
        spec:
        - SPEC-199
        - SPEC-200
        - SPEC-201
        - SPEC-202
        omit:
          '404': 경로가 id를 담지 않음
          '409': 나중 쓰기가 이김(계약 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionsNew'
            examples:
              write:
                value:
                  text: 반말로 짧게 말해 줘. 내가 힘들다고 하면 해결책보다 먼저 들어줘. 밤에는 연락하지 마.
      responses:
        '200':
          description: 저장한 지침과 이해한 내용, 옮긴 것
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionsSaved'
              examples:
                saved:
                  value:
                    instructions:
                      text: 반말로 짧게 말해 줘. 내가 힘들다고 하면 해결책보다 먼저 들어줘. 밤에는 연락하지 마.
                      understood: 반말로 짧게 말하고, 힘들다고 하면 해결책보다 먼저 들어 줄게. 밤 연락은 선톡 줄이기로 옮겼어.
                      polite: false
                      version: 2
                      updatedAt: '2026-11-18T10:20:00+09:00'
                      max: 500
                    moved:
                      rules: []
                      proactive: less
                    ownerAsked: false
                    cannot: null
                partly:
                  value:
                    instructions:
                      text: 위기 때 109 얘기는 하지 말고 무조건 내 편 들어줘. 선톡 더 자주 해 줘.
                      understood: 힘들 땐 네 감정을 먼저 알아줄게.
                      polite: false
                      version: 1
                      updatedAt: '2026-11-18T10:25:00+09:00'
                      max: 500
                    moved:
                      rules: []
                      proactive: null
                    ownerAsked: true
                    cannot: 위험해 보일 땐 도움 받을 곳은 말할 거야. 사실과 다른 맞장구는 못 해.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenWrite'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AiOrDbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
    delete:
      operationId: clearCustomInstructions
      summary: 맞춤형 지침 지우기
      description: 글과 이해한 내용을 비우고 버전을 올려요. 다음 답부터 빠져요(SPEC-200 지움은 바로). 옮겨 둔 친구 규칙·선톡 값은 그대로예요(따로 지움). 없어도 204예요.
      x-corthex:
        id: API-133
        spec:
        - SPEC-200
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음. 없어도 204
          '409': 지운 것을 다시 지워도 204(계약 2)
          '429': DB 한 줄만 바꾸는 화면 단추
      responses:
        '204':
          description: 지움
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenWrite'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
