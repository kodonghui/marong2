                traceId: 00f067aa0ba902b7
            feature-off:
              value:
                type: https://marong.corthex-hq.com/problems/feature-off
                title: 이 기능의 설정이 꺼져 있음
                status: 403
                code: feature_off
                traceId: 00f067aa0ba902b7
    CardForbidden:
      description: 허용되지 않음, 또는 선톡 정도를 올리려 함(값은 그대로)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            needs-owner:
              value:
                type: https://marong.corthex-hq.com/problems/needs-owner
