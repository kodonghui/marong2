  /chat/persona/api/forgets:
    post:
      operationId: forgetMemory
      summary: 잊게 하기
      description: 기억 항목이나 열린 고리 하나를 잊게 해요. 한 트랜잭션(친구 잠금)에서 명세 3.20 줄기 전체를 하고(같은 근거 말의 항목·고리, 원문 '잊음' 표시, 검색 벡터, 요약·메모 숨김, 체크포인트), 끝난 뒤에만 200이에요(SPEC-230). 요약·메모 다시 쓰기는 뒤에서 이어져요. 이미 잊은 것이면 forgot 0이에요.
      x-corthex:
        id: API-135
        spec:
        - SPEC-230
        - SPEC-234
        - SPEC-233
        omit:
          '409': 잊은 것을 다시 잊어도 200의 forgot 0(계약 2), 같은 키는 처음 결과(계약 8)
