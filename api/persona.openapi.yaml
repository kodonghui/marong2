          $ref: '#/components/responses/CardClosed'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
components:
  x-corthex:
    errors:
      invalid_request:
        status: 400
        meaning: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖, 카드에 없는 값, 처음 약속에 세 값이 다 없음, 형식이 틀린 경로 id, 같은 멱등 키를 다른 대상에 씀)
        message: 뭔가 잘못 보냈나 봐. 다시 해 볼게
        client: 입력 칸 오류면 그 칸 옆에 보이고, 아니면 오류 상태와 추적 id
      unauthenticated:
        status: 401
        meaning: Access 로그인 증명이 없거나 맞지 않음
        message: 다시 들어와 줘
        client: 페이지를 새로 불러 Access 로그인으로
      not_allowed:
        status: 403
        meaning: 허용 목록에 없는 계정이거나 통화 친구가 마롱이 친구에 묶이지 않음
        message: 이 계정으로는 열 수 없어
        client: 쓸 수 없는 계정 상태. 다시 시도하지 않음
      cross_site:
        status: 403
        meaning: 다른 사이트에서 온 쓰기 요청
        message: 이 화면에서 다시 해 줘
        client: 오류 상태. 자동으로 다시 보내지 않음
      feature_off:
        status: 403
        meaning: 이 기능의 설정(MARONG_FRIEND_CARD, MARONG_FRIEND_MEMORY=on)이 꺼져 있음
        message: 이건 아직 준비 중이야
        client: 준비 중 상태. 다시 시도하지 않음
      needs_owner:
        status: 403
        meaning: 선톡 정도를 올리는 요청. 올리기는 동희님이 정함(SPEC-202)
        message: 선톡을 늘리는 건 동희가 정해. 대화에서 말해 주면 동희한테 남겨 둘게
        client: 값을 응답 전 값으로 되돌려 보이고, 올리는 칸을 막음
      not_found:
        status: 404
        meaning: 없는 규칙·항목·고리·카드이거나 로그인한 친구의 것이 아님(지금 보이지 않는 대체됨·철회됨 항목 포함)
        message: 찾지 못했어. 새로 보여 줄게
        client: 목록을 다시 불러 보여 줌
      card_closed:
        status: 409
        meaning: 카드가 만료됐거나 새 카드로 바뀌었거나 이미 다른 값으로 답함
        message: 이 카드는 이제 못 골라
        client: 카드 단추를 막고 글 대화를 다시 불러 지금 카드를 보여 줌
      rule_limit:
        status: 409
        meaning: 그 종류의 친구 규칙이 이미 20개
        message: 너무 많아서 하나 빼 줄래?
        client: 입력한 글을 두고 목록에서 지우기를 권함
      too_many_requests:
        status: 429
        meaning: 맞춤형 지침 저장을 1분에 5번 넘게 보냄
        message: 너무 빨라! 조금 있다가 해 줘
        client: Retry-After까지 저장 버튼을 막고 남은 초를 보여 줌. 쓴 글은 지우지 않음
      ai_unavailable:
        status: 503
        meaning: 맞춤형 지침을 읽는 모델(AI-14)이 실패함(10초 넘김, 연결 오류, 5xx, 거절, 키 없음, 한도, 형식 틀림). 아무것도 저장하지 않음
        message: 지금 잘 못 읽었어, 조금 뒤에 다시 말해 줄래?
        client: 쓴 글을 그대로 두고 다시 저장 버튼
      db_unavailable:
        status: 503
        meaning: DB나 Access 공개키에 닿지 않음
        message: 잠깐 문제가 생겼어. 조금 있다가 다시 해 줘
        client: 다시 연결하는 중 상태. 5초 뒤부터 늘려 가며 다시
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태, 다시 시도, 추적 id 보여 줌
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access가 붙이는 JWT(RS256). 봇이 Access 공개키로 서명·aud·iss·exp를 확인하고 email을 허용 목록과 맞춘 뒤 sha256으로 통화 친구를 찾아요. 브라우저가 직접 넣지 않아요.
  headers:
    RetryAfter:
      description: 다시 보낼 수 있을 때까지의 초
      schema:
        type: string
        pattern: ^[0-9]{1,3}$
  parameters:
    RuleId:
      name: ruleId
      in: path
      required: true
      description: 친구 규칙 id(TBL-116)
      schema:
        type: integer
        format: int64
        minimum: 1
    CardId:
      name: cardId
      in: path
      required: true
      description: 고르기 카드 id(TBL-119)
      schema:
        type: integer
        format: int64
        minimum: 1
    Before:
      name: before
      in: query
      required: false
      description: 이 항목 id보다 앞의 기억 항목(더 불러오기). 없으면 가장 최근부터. 고리는 첫 쪽에만 와요
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 화면이 누를 때마다 만드는 UUID. 다시 보낼 때 같은 값을 써요(TBL-129 request_key)
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  responses:
    BadRequest:
      description: 요청이 틀림
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too-long:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: text
                  reason: too_long
            not-an-option:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: value
                  reason: not_an_option
            first-set-needs-three:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-request
                title: 요청 모양이 틀림
                status: 400
                code: invalid_request
                traceId: 0af7651916cd43dd
                errors:
                - field: advice
                  reason: required
    Unauthenticated:
      description: 로그인 증명이 없거나 맞지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no-proof:
              value:
                type: https://marong.corthex-hq.com/problems/unauthenticated
                title: Access 로그인 증명이 없거나 맞지 않음
                status: 401
                code: unauthenticated
                traceId: 0af7651916cd43dd
    ForbiddenRead:
      description: 허용되지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-allowed:
              value:
                type: https://marong.corthex-hq.com/problems/not-allowed
                title: 허용 목록에 없는 계정이거나 마롱이 친구에 묶이지 않음
                status: 403
                code: not_allowed
                traceId: 00f067aa0ba902b7
            feature-off:
              value:
                type: https://marong.corthex-hq.com/problems/feature-off
