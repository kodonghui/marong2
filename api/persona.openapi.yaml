      description: 화면 '마롱이가 기억하는 나'(SCR-122)의 목록이에요. 지금 항목(`current`)을 들은 때 새것부터, 열린 고리를 기한 가까운 것부터 줘요. 민감 항목도 본인에게는 보여요(SPEC-234). 대체됨·철회됨·잊음·허락 기다림은 없어요. 항목은 한 번에 100개, 더 앞의 항목은 before로 불러요.
      x-corthex:
        id: API-134
        spec:
        - SPEC-229
        - SPEC-234
        - SPEC-226
        - SPEC-227
        - SPEC-228
        omit:
          '404': 경로가 id를 담지 않음. 항목이 없으면 200의 빈 목록
