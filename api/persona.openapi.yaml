        '403':
          $ref: '#/components/responses/ForbiddenWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/persona/api/cards/{cardId}/answer:
    post:
      operationId: answerChatCard
      summary: 글 대화 안 고르기 카드에 답하기
      description: 앱 글 대화의 마롱이 말에 붙은 카드(SCR-123, `api/app-chat.openapi.yaml`의 Message.card)에서 하나를 골라요. 디스코드 단추·카톡 번호와 같은 처리예요. 카드 종류마다 하는 일은 `effect`로 알려요. 첫 질문 1·2번이면 다음 질문 카드가 붙은 마롱이 말이 바로 생기고(계약 9) 글 대화 기다리기(API-104)로 와요. 전하기 확인(응)과 밤 전화 확인(응)은 대화 턴 그래프를 이어 가요(SPEC-241).
      x-corthex:
        id: API-136
        spec:
        - SPEC-192
        - SPEC-193
        - SPEC-196
        - SPEC-197
        - SPEC-231
        - SPEC-238
        - SPEC-241
        omit:
          '429': 카드 하나에 답은 한 번
      parameters:
      - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAnswer'
            examples:
              support:
                value:
                  value: listen
              draft-ok:
                value:
                  value: 'yes'
              keep-memory:
                value:
                  value: keep
      responses:
        '200':
          description: 답함(같은 카드에 같은 값을 다시 보냈을 때도 처음 결과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAnswerResult'
              examples:
                next-question:
                  value:
                    card:
                      id: 901
                      kind: card_question
                      step: 1
                      options:
                      - value: listen
