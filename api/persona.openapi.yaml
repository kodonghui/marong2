                      - value: side
                        label: 내 편
                      - value: solve
                        label: 같이 방법 찾기
                      - value: distract
                        label: 기분 전환
                      - value: chat
                        label: 그냥 수다
                      - value: ask
                        label: 그때그때 물어봐
                      status: answered
                      answer: listen
                      expiresAt: '2026-11-19T10:00:00+09:00'
                    effect: next_question
                    sentence: null
                card-set:
                  value:
                    card:
                      id: 903
                      kind: card_question
                      step: 3
                      options:
                      - value: gentle
                        label: 부드럽게
                      - value: direct
                        label: 솔직하게
                      - value: let_go
                        label: 그냥 넘어가 줘
                      status: answered
                      answer: gentle
                      expiresAt: '2026-11-19T10:04:00+09:00'
                    effect: card_set
                    sentence: 힘들다고 하면 일단 들을게, 조언은 네가 물어볼 때만 하고, 아닌 것 같을 땐 부드럽게 말할게
                draft-fix:
                  value:
                    card:
                      id: 910
                      kind: card_draft
                      step: null
                      options:
                      - value: 'yes'
                        label: 맞아
                      - value: fix
                        label: 고칠래
                      status: answered
                      answer: fix
                      expiresAt: '2026-11-19T11:00:00+09:00'
                    effect: open_card_screen
                    sentence: null
                memory-kept:
                  value:
