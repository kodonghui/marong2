            not-allowed:
              value:
                type: https://marong.corthex-hq.com/problems/not-allowed
                title: 허용 목록에 없는 계정이거나 마롱이 친구에 묶이지 않음
                status: 403
                code: not_allowed
                traceId: 00f067aa0ba902b7
            cross-site:
              value:
                type: https://marong.corthex-hq.com/problems/cross-site
                title: 다른 사이트에서 온 쓰기 요청
                status: 403
                code: cross_site
                traceId: 00f067aa0ba902b7
            feature-off:
              value:
                type: https://marong.corthex-hq.com/problems/feature-off
                title: 이 기능의 설정이 꺼져 있음
                status: 403
                code: feature_off
                traceId: 00f067aa0ba902b7
    NotFound:
      description: 없거나 로그인한 친구의 것이 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: https://marong.corthex-hq.com/problems/not-found
                title: 찾지 못함
                status: 404
                code: not_found
                traceId: 4bf92f3577b34da6
    RuleLimit:
      description: 그 종류의 친구 규칙이 이미 20개
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limit:
              value:
                type: https://marong.corthex-hq.com/problems/rule-limit
                title: 친구 규칙이 이미 20개
                status: 409
                code: rule_limit
                traceId: 4bf92f3577b34da6
    CardClosed:
      description: 카드가 닫혔거나 다른 값으로 답함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            closed:
              value:
                type: https://marong.corthex-hq.com/problems/card-closed
                title: 이 카드는 이제 못 고름
                status: 409
                code: card_closed
                traceId: 4bf92f3577b34da6
    TooManyRequests:
      description: 맞춤형 지침 저장을 1분에 5번 넘게 보냄
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too-many:
              value:
                type: https://marong.corthex-hq.com/problems/too-many-requests
                title: 맞춤형 지침 저장을 1분에 5번 넘게 보냄
                status: 429
                code: too_many_requests
                traceId: 4bf92f3577b34da6
    AiOrDbUnavailable:
      description: 모델이나 DB가 실패함(아무것도 저장하지 않음)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ai:
              value:
                type: https://marong.corthex-hq.com/problems/ai-unavailable
                title: 맞춤형 지침을 읽는 모델이 실패함
                status: 503
                code: ai_unavailable
                traceId: 4bf92f3577b34da6
            db:
              value:
                type: https://marong.corthex-hq.com/problems/db-unavailable
                title: DB에 닿지 않음
                status: 503
                code: db_unavailable
                traceId: 4bf92f3577b34da6
    DbUnavailable:
      description: DB에 닿지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            db:
              value:
                type: https://marong.corthex-hq.com/problems/db-unavailable
                title: DB에 닿지 않음
                status: 503
                code: db_unavailable
                traceId: 4bf92f3577b34da6
    Internal:
      description: 예상하지 못한 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: https://marong.corthex-hq.com/problems/internal
                title: 예상하지 못한 서버 오류
                status: 500
                code: internal
                traceId: 4bf92f3577b34da6
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 300
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - invalid_request
          - unauthenticated
          - not_allowed
          - cross_site
          - feature_off
          - needs_owner
          - not_found
          - card_closed
          - rule_limit
          - too_many_requests
          - ai_unavailable
          - db_unavailable
          - internal
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
        errors:
          type: array
          maxItems: 10
          description: 검증 오류 위치. 보낸 값은 담지 않음
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                enum:
                - body
                - support
                - advice
                - honesty
                - lead
                - proactive
                - kind
                - text
                - type
                - id
                - value
                - ruleId
                - cardId
                - before
                - Idempotency-Key
              reason:
                type: string
                enum:
                - required
                - too_short
                - too_long
                - bad_format
                - out_of_range
                - not_an_option
                - key_reused
            additionalProperties: false
      additionalProperties: false
    Support:
      type: string
      description: 지지 방식(TERM-042, TBL-115 support). 화면 이름은 08 단계(listen 그냥 들어주기, side 내 편, solve 같이 방법 찾기, distract 기분 전환, chat 그냥 수다, ask 그때그때 물어봐)
      enum:
      - listen
      - side
      - solve
      - distract
      - chat
      - ask
    Advice:
      type: string
      description: 조언(TBL-115 advice). asked 물어볼 때만, sometimes 괜찮아 보이면 가끔, any 언제든
      enum:
      - asked
      - sometimes
      - any
    Honesty:
      type: string
      description: 솔직함(TBL-115 honesty). gentle 부드럽게, direct 솔직하게, let_go 그냥 넘어가 줘
      enum:
      - gentle
      - direct
      - let_go
    Lead:
      type: string
      description: 대화 이끌기(TBL-115 lead). follow 따라갈게, lead 네가 이끌어 줘
      enum:
      - follow
      - lead
    Proactive:
      type: string
      description: 선톡 정도(TBL-115 proactive). normal 보통, less 적게(하루 1번), off 끔. 친구는 내리기만(SPEC-202)
      enum:
      - normal
      - less
      - 'off'
    Rule:
      type: object
      required:
      - id
      - kind
      - text
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/RuleKind'
        text:
          type: string
          minLength: 1
          maxLength: 20
      allOf:
      - if:
          properties:
            kind:
              const: avoid_topic
        then:
          properties:
            text:
              minLength: 2
        else:
          properties:
            text:
              maxLength: 4
      additionalProperties: false
    RuleKind:
      type: string
      description: no_vocative 금지 호칭, avoid_topic 싫은 주제, call_me 부르는 이름(TERM-044, TBL-116 kind)
      enum:
      - no_vocative
      - avoid_topic
      - call_me
    RuleNew:
      type: object
      required:
      - kind
      - text
      description: 길이는 TBL-116 CHECK와 같아요. 호칭·부르는 이름 1~4자, 싫은 주제 2~20자. 틀리면 400 too_short·too_long
      properties:
        kind:
          $ref: '#/components/schemas/RuleKind'
        text:
          type: string
          minLength: 1
          maxLength: 20
      allOf:
      - if:
          properties:
            kind:
              const: avoid_topic
        then:
          properties:
            text:
              minLength: 2
        else:
          properties:
            text:
              maxLength: 4
      additionalProperties: false
    Card:
      type: object
      required:
      - state
      - values
      - proactive
      - callFirst
      - sentence
      - source
      - setAt
      - want
      - rules
      - ruleMax
      properties:
        state:
          type: string
          description: none 아직 없음, asking 첫 질문 중, draft 초안 확인 중, set 설정됨(TBL-115 state)
          enum:
          - none
          - asking
          - draft
          - set
        values:
          type: object
          required:
          - support
          - advice
          - honesty
          - lead
          description: set·draft면 세 값이 다 있고, asking이면 고른 것만 있어요
          properties:
            support:
              oneOf:
              - $ref: '#/components/schemas/Support'
              - type: 'null'
            advice:
              oneOf:
              - $ref: '#/components/schemas/Advice'
              - type: 'null'
            honesty:
              oneOf:
              - $ref: '#/components/schemas/Honesty'
              - type: 'null'
            lead:
              $ref: '#/components/schemas/Lead'
          additionalProperties: false
        proactive:
          $ref: '#/components/schemas/Proactive'
        callFirst:
          type: boolean
          description: 먼저 전화 켜짐(TBL-126 hello_call, 줄이 없으면 true). 여기서는 보여 주기만(계약 5)
        sentence:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 약속 문장(명세 3.9 문장 틀). set·draft일 때만
        source:
          type:
          - string
          - 'null'
          enum:
          - questions
          - draft
          - draft_silent
          - default
          - proposal
          - talk
          - screen
          - admin
          - null
        setAt:
          type:
          - string
          - 'null'
          format: date-time
        want:
          description: 지금 바람(24시간, SPEC-195). 지났으면 null
          oneOf:
          - type: 'null'
          - type: object
            required:
            - value
            - until
            properties:
              value:
                $ref: '#/components/schemas/Support'
              until:
                type: string
                format: date-time
            additionalProperties: false
        rules:
          type: array
          maxItems: 60
          description: 지금 친구 규칙(지운 것 빼고)
          items:
            $ref: '#/components/schemas/Rule'
        ruleMax:
          type: integer
          const: 20
          description: 종류마다 한도
      additionalProperties: false
    CardChange:
      type: object
      minProperties: 1
      description: 바꿀 값만 보내요. 약속이 set이 아니면 support·advice·honesty 셋이 다 있어야 해요(없으면 400 required)
      properties:
        support:
          $ref: '#/components/schemas/Support'
        advice:
          $ref: '#/components/schemas/Advice'
        honesty:
          $ref: '#/components/schemas/Honesty'
        lead:
          $ref: '#/components/schemas/Lead'
        proactive:
          $ref: '#/components/schemas/Proactive'
      additionalProperties: false
    Instructions:
      type: object
      required:
      - text
      - understood
      - polite
      - version
      - updatedAt
      - max
      properties:
        text:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 500
          description: 친구가 적은 글(TBL-117 text). 화면에는 textContent로만
        understood:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 300
          description: 마롱이가 이해한 내용(AI-14)
        polite:
          type: boolean
          description: 존댓말을 바람(검사의 '갑자기 존댓말'을 끔)
        version:
          type: integer
          minimum: 0
          description: 0이면 한 번도 적은 적 없음
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        max:
          type: integer
          const: 500
      additionalProperties: false
    InstructionsNew:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: 앞뒤 빈칸을 뺀 뒤 1~500자. 빈 글은 400(지우기는 DELETE, 계약 7)
      additionalProperties: false
    InstructionsSaved:
      type: object
      required:
      - instructions
      - moved
      - ownerAsked
      - cannot
      properties:
        instructions:
          $ref: '#/components/schemas/Instructions'
        moved:
          type: object
          required:
          - rules
          - proactive
          description: 꼭 지킬 것 가운데 친구 규칙과 선톡 줄이기로 옮긴 것(D25 셋째)
          properties:
            rules:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/Rule'
            proactive:
              oneOf:
              - type: 'null'
              - type: string
                enum:
                - less
                - 'off'
          additionalProperties: false
        ownerAsked:
          type: boolean
          description: 올리는 쪽 부탁(선톡 더 자주 등)이 있어 동희님께 남겼는지(SPEC-202)
        cannot:
          type:
          - string
          - 'null'
          maxLength: 120
          description: 못 지키는 부분 한 줄(AI-14). 저장하지 않고 이 응답에만
      additionalProperties: false
    MemoryItem:
      type: object
      required:
      - id
      - kind
      - text
      - heardAt
      - channel
      - quote
      - scope
      - sensitive
      - validUntil
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          description: fact 사실, preference 취향, event 일·계획, relation 사람 관계, hard 힘든 일(TBL-123 kind)
          enum:
          - fact
          - preference
          - event
          - relation
          - hard
        text:
          type: string
          minLength: 1
          maxLength: 80
        heardAt:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
        quote:
          type:
          - string
          - 'null'
          maxLength: 120
          description: 친구가 한 말 그대로(본인 화면이라 보여요)
        scope:
          type: string
          description: me 친구 범위(1:1에서 들음), group 들은 단체방에서만 씀. 방 이름·키는 주지 않아요
          enum:
          - me
          - group
        sensitive:
          type: boolean
          description: 민감 기억(TERM-073). 종류는 주지 않아요
        validUntil:
          type:
          - string
          - 'null'
          format: date
      additionalProperties: false
    OpenLoop:
      type: object
      required:
      - id
      - text
      - due
      - heardAt
      - channel
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 60
        due:
          type:
          - string
          - 'null'
          format: date
        heardAt:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/Channel'
      additionalProperties: false
    Channel:
      type: string
      description: 들은 곳(TBL-123 channel). discord_dm 디스코드 DM, app 앱 글 대화, kakao_dm 카톡 1:1, kakao_group 카톡 단체방, discord_server 디스코드 서버, call 통화
      enum:
      - discord_dm
      - app
      - kakao_dm
      - kakao_group
      - discord_server
      - call
    MemoryPage:
      type: object
      required:
      - items
      - loops
      - hasMore
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemoryItem'
        loops:
          type: array
          maxItems: 50
          description: 열린 고리(before가 없을 때만, 그 밖은 빈 목록)
          items:
            $ref: '#/components/schemas/OpenLoop'
        hasMore:
          type: boolean
          description: 더 앞의 항목이 있는지
      additionalProperties: false
    ForgetRequest:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: item 기억 항목(TBL-123), loop 열린 고리(TBL-124)
          enum:
          - item
          - loop
        id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    ForgetResult:
      type: object
      required:
      - forgot
      - messages
      properties:
        forgot:
          type: integer
          minimum: 0
          maximum: 1000
          description: 잊은 기억 항목과 고리 수(같은 근거 말에서 나온 것 포함, TBL-129 items)
        messages:
          type: integer
          minimum: 0
          maximum: 1000
          description: 잊음 표시한 원문 메시지와 통화 턴 수(TBL-129 messages)
      additionalProperties: false
    ChatCard:
      type: object
      description: 글 대화 마롱이 말에 붙은 고르기 카드(SCR-123, TBL-119). 칸 이름(label)은 서버 상수예요. 묻는 글은 그 마롱이 말의 text에 있어요. 글 대화 API의 Message.card가 이 모양이에요
      required:
      - id
      - kind
      - step
      - options
      - status
      - answer
      - expiresAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          description: card_question 첫 질문, card_draft 약속 초안 확인, card_proposal 약속 바꾸기 제안, ask_support 지지 방식 묻기, memory_ok 민감 기억 허락, relay_confirm 전하기 확인, call_confirm 밤 전화 확인
          enum:
          - card_question
          - card_draft
          - card_proposal
          - ask_support
          - memory_ok
          - relay_confirm
          - call_confirm
        step:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3
          description: 첫 질문이면 1~3
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: object
            required:
            - value
            - label
            properties:
              value:
                type: string
                pattern: ^[a-z_]{1,20}$
              label:
                type: string
                minLength: 1
                maxLength: 20
            additionalProperties: false
        status:
          type: string
          enum:
          - open
          - answered
          - expired
          - replaced
        answer:
          type:
          - string
          - 'null'
          pattern: ^[a-z_]{1,20}$
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    CardAnswer:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          pattern: ^[a-z_]{1,20}$
          description: 카드 options의 value 하나. 아니면 400 not_an_option
      additionalProperties: false
    CardAnswerResult:
      type: object
      required:
      - card
      - effect
      - sentence
      properties:
        card:
          $ref: '#/components/schemas/ChatCard'
        effect:
          type: string
          description: |-
            next_question 다음 첫 질문 카드가 새 마롱이 말로 붙음 | card_set 친구 약속이 만들어짐(sentence 있음) | open_card_screen 화면이 SCR-120을 엶(초안 '고칠래') |
            proposal_accepted 제안대로 바뀜(sentence 있음) | proposal_declined 그대로, 쌓인 신호 닫음 | want_set 지금 바람 적음(지지 방식 묻기) |
            memory_kept 민감 기억을 지금 항목으로 | memory_forgotten 그 자리에서 잊음(SPEC-230) | relay_queued 전할 말을 보낼 표에 넣음 | relay_cancelled 전하지 않음 |
            call_placed 밤 전화를 검 | call_cancelled 걸지 않음
          enum:
          - next_question
          - card_set
          - open_card_screen
          - proposal_accepted
          - proposal_declined
          - want_set
          - memory_kept
          - memory_forgotten
          - relay_queued
          - relay_cancelled
          - call_placed
          - call_cancelled
        sentence:
          type:
          - string
          - 'null'
          maxLength: 200
          description: card_set·proposal_accepted일 때 새 약속 문장
      additionalProperties: false
