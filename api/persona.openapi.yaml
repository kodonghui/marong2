                status: 403
                code: feature_off
                traceId: 00f067aa0ba902b7
    ForbiddenWrite:
      description: 허용되지 않음(cross_site는 쓰기 요청에서만 나와요)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-allowed:
              value:
                type: https://marong.corthex-hq.com/problems/not-allowed
                title: 허용 목록에 없는 계정이거나 마롱이 친구에 묶이지 않음
                status: 403
                code: not_allowed
                traceId: 00f067aa0ba902b7
            cross-site:
              value:
                type: https://marong.corthex-hq.com/problems/cross-site
