# 마롱이 통합 앱의 반려동물 캐릭터 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/pet-app.md(SPEC-406~427), DB: marong/migrations/022_pet_app.sql(TBL-175~181), 표 설명: docs/05-erd/pet-app.md
openapi: 3.1.0
info:
  title: 마롱이 반려동물 캐릭터(통합 앱) API
  version: 0.1.0-draft
  description: |-
    통합 앱의 아이 소개(SCR-180), 상점(SCR-181), 아이템 보기(SCR-182), 보관함(SCR-183), 일기장 꾸미기(SCR-184), 스티커(SCR-185), 관리자 아이템(SCR-186) 화면과 글 대화·통화 화면의 장면 그림이 앱 서버(TERM-194)와 주고받는 계약이에요. 원본은 이 파일이고 코드는 이 파일을 따라가요(06 단계). 통합 앱 계약([unified.openapi.yaml](unified.openapi.yaml))과 같은 서버·같은 `/chat/` 아래이고 로그인·Origin·오류 모양·관리자 확인 규칙을 그대로 써요.

    - 로그인은 통합 앱과 같은 쿠키 `marong_session`이에요. 없거나 끝났으면 401 `login_required`예요.
    - 모든 값은 로그인한 친구의 id로만 읽고 바꿔요. 남의 캐릭터·일기나 없는 id는 없는 것과 같아요(404 `not_found`).
    - 쓰기 요청(PUT·POST)은 `Origin`이 `https://marong.corthex-hq.com`이어야 해요. 아니면 403 `cross_site`예요. 본문은 16KB까지예요.
    - 관리자 경로(`/chat/admin/api/`)는 Cloudflare Access 뒤에 있고 서버가 `Cf-Access-Jwt-Assertion`을 다시 확인해요(통합 앱 SPEC-395). 아니면 403 `not_allowed`예요.
    - 오류는 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요. JSON 응답은 모두 `Cache-Control: no-store`이고, 장면 그림은 `private`, 아이템 파일은 `public, max-age=31536000, immutable`이에요.
    - 응답에는 그림 지시 글, 모델 이름, 그림 한 장의 비용, 파일 시스템 경로, 대화 글이 없어요. 관리자 그림 비용(API-266)만 달 합을 보여요. 로그에는 결과 코드와 id만 남겨요(REQ-524).
    - 설정값 `MARONG_DECOR=0`이면 상점·보관함·차림·일기장 꾸밈·스티커·관리자 아이템 API(API-252\~255, API-258\~261, API-263\~265)가 404 `not_found`예요. 아이템 파일(API-257)도 404예요. 아이 소개(API-250·251), 장면 그림(API-262), 그림 비용(API-266)은 설정과 무관하게 답해요.
    - 페이지(`/chat/character/:id/intro`, `/chat/shop`, `/chat/closet`, `/chat/diary/:date`의 꾸미기·스티커, `/chat/admin/items`)와 그 js·css는 HTML과 파일이라 이 계약에 넣지 않았어요. 화면은 07 사이트맵과 08 화면 정의에 있어요.
    - API 256번은 쓰지 않은 번호예요. 267\~279번은 비워 둬요.

    이 파일 밖에서 바뀌는 것(같은 PR에서 그 계약 파일에 칸을 더했어요. 모두 선택 칸이라 지금 서버의 응답도 계약에 맞아요).
    1. 프로필(API-216)의 `character`에 `template`, `outfit`(이 파일의 `WornOutfit`), `introMissing`이 생겨요(SPEC-409, 421).
    2. 일기 한 날(API-110)에 `writer`(이 파일의 `DiaryWriter`)가 생겨요(SPEC-408, 413).
    3. 목소리 고르기(API-217)는 모양이 그대로이고, 서버가 `friend_profiles.voice_source`를 `chosen`으로 같이 적어요(SPEC-407).
    4. 글 대화 메시지의 `meta`에 `scene`(장면 그림 id)과 `reaction`(아이템 id)이 생길 수 있어요. 글 대화 화면은 `scene`이 있으면 API-262 주소로 그림을 그려요(SPEC-411, 416, 422). 통화 서버가 선 전화 화면에 보내는 화두 카드의 `picture`도 `/chat/api/scenes/{id}`일 수 있어요. 두 화면의 그림 주소 검사에 이 모양을 더해요.

    계약에서 정한 것(Claude 제안, 2026-11-21, 검토 대상).
    1. 검증 오류는 400 `invalid_input`이에요. 경로 id의 형식이 틀리면 400, 없거나 남의 것이면 404예요.
    2. 아이 소개 쓰기(API-251)는 칸 네 개를 모두 보내는 PUT이에요. 같은 값이면 200이고 바뀌는 것이 없어요. 추천 목소리는 처음 저장할 때만 걸려요.
    3. 받기(API-253)는 처음이면 201, 이미 받았으면 200이에요. 둘 다 본문이 같아요.
    4. 차림(API-255)과 일기장 꾸밈(API-259)은 자리를 모두 보내는 PUT이에요. 비울 자리는 `null`이에요(일기장 꾸밈은 비울 수 없어요).
    5. 스티커(API-261)는 그 날 스티커 전체를 보내는 PUT이에요. 배열 순서가 겹치는 순서(앞이 아래)예요. 빈 배열이면 모두 떼요.
    6. 상점은 지금 모든 값이 0원이에요(D113). `priceKrw`는 정수이고 지금은 늘 0이에요. 결제·충전 API는 없어요.

    Open: 기본 마롱이의 차림(질문 A)은 답이 온 뒤 API를 더해요. 추억 모드(D121)는 답 대기예요.
servers:
- url: https://marong.corthex-hq.com
  description: 앱 서버. 터널이 /chat/ 아래를 앱 서버로 보내요. /chat/admin/ 아래만 Cloudflare Access 뒤예요
security:
- session: []
paths:
  /chat/api/characters/{id}/intro:
    get:
      operationId: getPetIntro
      summary: 아이 소개 읽기
      description: 아이 소개 화면(SCR-180)과 내 마롱이(SCR-165)가 불러요. 아직 저장하지 않았으면 `intro`와 `introAt`이 null이에요.
      x-corthex:
        id: API-250
        spec:
        - SPEC-409
      parameters:
      - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: 지금 아이 소개
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntroEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotReady'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
    put:
      operationId: putPetIntro
      summary: 아이 소개 저장
      description: 성격(정한 8개 중 3개까지), 좋아하는 것·싫어하는 것(60자), 주인을 부르는 말(1\~10자)을 저장해요. 글은 줄바꿈·제어 문자·`#`·백틱·꺾쇠를 빼고 저장해요. 처음 저장이면 `introAt`을 채우고, 친구가 목소리를 직접 고르지 않았으면 추천 목소리를 걸어 응답의 `voice`·`voiceSource`로 알려 줘요(SPEC-407). 1인칭 구간(SPEC-406)은 다음 답부터 이 값을 써요.
      x-corthex:
        id: API-251
        spec:
        - SPEC-409
        - SPEC-407
      parameters:
      - $ref: '#/components/parameters/CharacterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Intro'
            examples:
              dog:
                value:
                  personality:
                  - 먹보
                  - 애교 많음
                  likes: 고구마, 산책
                  dislikes: 목욕
                  ownerCall: 누나
      responses:
        '200':
          description: 저장한 아이 소개와 지금 목소리
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntroEnvelope'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotReady'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/api/shop:
    get:
      operationId: getShop
      summary: 상점 목록
      description: 상점(SCR-181)이 불러요. 올린(`listed`) 아이템을 종류 순서(모자·옷·목도리·일기장 배경·속지·글꼴·스티커)와 올린 순서로 줘요. `owned`는 이 친구가 받았거나 처음 아이템이면 true예요.
      x-corthex:
        id: API-252
        spec:
        - SPEC-418
      responses:
        '200':
          description: 상점의 아이템
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/api/shop/{itemId}/claim:
    post:
      operationId: claimItem
      summary: 아이템 받기(0원)
      description: 결제 단계 없이 보관함에 넣어요(TBL-177). 같은 아이템을 다시 받으면 200이고 줄이 늘지 않아요. 내린 아이템은 새로 받을 수 없어요(404). 본문은 없어요.
      x-corthex:
        id: API-253
        spec:
        - SPEC-418
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 이미 받은 아이템
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '201':
          description: 새로 받음
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/api/closet:
    get:
      operationId: getCloset
      summary: 보관함
      description: 보관함(SCR-183)이 불러요. 받은 아이템과 처음 아이템, 쓰는 캐릭터의 차림(기본 마롱이면 null), 일기장 꾸밈을 줘요. 내린 아이템도 받은 것이면 보여요.
      x-corthex:
        id: API-254
        spec:
        - SPEC-419
      responses:
        '200':
          description: 보관함
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Closet'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/api/characters/{id}/outfit:
    put:
      operationId: putOutfit
      summary: 차림 바꾸기
      description: 세 자리(머리·몸·목)를 한 번에 바꿔요(TBL-178). 아이템은 보관함에 있고 자리가 맞아야 해요. 처음 입는 아이템이면 반응 선톡을 3분 뒤로 잡아요(SPEC-422). 여러 자리를 한 번에 처음 입히면 머리→몸→목 순서의 앞 하나만 반응해요. 응답은 입은 모습이에요. D190에 따라 400의 errors에 head·body·neck 자리와 required·bad_format·wrong_kind 규칙 코드를 담아요. 캐릭터 id 형식 오류는 id·bad_format, 본문 전체 형식 오류는 request·bad_format으로 몸 자리 body와 구분해요.
      x-corthex:
        id: API-255
        spec:
        - SPEC-420
        - SPEC-421
        - SPEC-422
      parameters:
      - $ref: '#/components/parameters/CharacterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitSet'
            examples:
              hat:
                value:
                  head: hat-knit
                  body: null
                  neck: null
      responses:
        '200':
          description: 바뀐 차림
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WornOutfit'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotOwnedOrNotReady'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/decor/{set}/{itemId}/{file}:
    get:
      operationId: getDecorFile
      summary: 아이템 파일
      description: 아이템 목록 폴더(`marong/decor/<set>/`)의 파일을 줘요. 목록 파일(`items.json`)에 그 아이템의 파일로 적힌 이름만 주고, 요청 글로 파일 경로를 만들지 않아요. 파일 이름에 세트 버전이 들어 있어 오래 저장해도 돼요. 글꼴은 이 서버에서만 줘요(바깥 CDN 없음).
      x-corthex:
        id: API-257
        spec:
        - SPEC-421
        - SPEC-425
      parameters:
      - $ref: '#/components/parameters/ItemSet'
      - $ref: '#/components/parameters/ItemId'
      - name: file
        in: path
        required: true
        description: 목록 파일에 적힌 파일 이름(`thumb.webp`, `dog_small.png`, `bg.webp`, `paper.webp`, `font.woff2`, `sticker.webp` 등)
        schema:
          type: string
          pattern: ^[a-z0-9_]{1,20}\.(webp|png|woff2)$
      responses:
        '200':
          description: 파일
          headers:
            Cache-Control:
              $ref: '#/components/headers/Immutable'
          content:
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            font/woff2:
              schema:
                type: string
                contentMediaType: font/woff2
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/diary/api/decor:
    get:
      operationId: getDiaryDecor
      summary: 일기장 꾸밈 읽기
      description: 일기장 화면(SCR-113, 116, 117)과 일기장 꾸미기(SCR-184)가 불러요. 고른 것이 없으면 처음 아이템 셋(지금 일기장 모습)이에요.
      x-corthex:
        id: API-258
        spec:
        - SPEC-423
      responses:
        '200':
          description: 지금 일기장 꾸밈
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryDecorView'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
    put:
      operationId: putDiaryDecor
      summary: 일기장 꾸밈 바꾸기
      description: 배경·속지·글꼴을 한 번에 바꿔요(TBL-180). 셋 다 보관함에 있는 그 종류 아이템이어야 해요. 모든 날의 일기장에 같이 보여요. D189에 따라 400의 errors에 해당 칸 backgroundId·paperId·fontId와 규칙 코드 required·bad_format·wrong_kind를 담아요. 본문 전체 형식 오류는 field body·bad_format이에요.
      x-corthex:
        id: API-259
        spec:
        - SPEC-423
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiaryDecorSet'
      responses:
        '200':
          description: 바뀐 일기장 꾸밈
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryDecorView'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotOwned'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/diary/api/days/{date}/stickers:
    get:
      operationId: getStickers
      summary: 그 날 스티커
      description: 일기 한 장 화면(SCR-113)과 스티커 편집(SCR-185)이 불러요. 일기가 `ready`가 아니면 빈 목록이에요. 숨긴 일기도 줘요.
      x-corthex:
        id: API-260
        spec:
        - SPEC-424
      parameters:
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: 붙인 스티커(겹치는 순서)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerList'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
    put:
      operationId: putStickers
      summary: 그 날 스티커 저장
      description: 그 날 스티커 전체(0\~10개)를 한 트랜잭션에서 바꿔요(TBL-181, 뗀 것은 `removed_at`). 글을 고치거나 다시 그려도 스티커는 그대로예요. D190에 따라 400의 errors에 body·date·stickers·itemId·x·y·scale·rotation 필드와 required·bad_format·out_of_range·wrong_kind 규칙 코드를 담고, 특정 스티커 오류에는 배열의 0부터 시작하는 index를 더해요. errors는 최대 10개이고 보낸 값은 담지 않아요.
      x-corthex:
        id: API-261
        spec:
        - SPEC-424
      parameters:
      - $ref: '#/components/parameters/Date'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StickerSet'
            examples:
              two:
                value:
                  stickers:
                  - itemId: st-paw
                    x: 120
                    y: 80
                    scale: 100
                    rotation: -15
                  - itemId: st-star
                    x: 880
                    y: 900
                    scale: 80
                    rotation: 0
      responses:
        '200':
          description: 저장한 스티커
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerList'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StickerConflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/api/scenes/{id}:
    get:
      operationId: getScenePicture
      summary: 장면 그림
      description: 글 대화 화면(SCR-107)과 통화 화면(SCR-002)의 화두 카드가 불러요. 로그인한 친구의 `done` 장면 그림 바이트를 줘요(TBL-176). id가 바뀌지 않아 그 브라우저에 오래 저장해도 돼요.
      x-corthex:
        id: API-262
        spec:
        - SPEC-411
        - SPEC-416
        - SPEC-422
      parameters:
      - name: id
        in: path
        required: true
        description: 장면 그림 id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 그림
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateCache'
          content:
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/LoginRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/items:
    get:
      operationId: listAdminItems
      summary: 관리자 아이템 목록
      description: 관리자 아이템 화면(SCR-186)이 불러요. 아이템 목록 폴더의 모든 아이템을 상태(`listed`·`unlisted`·`new`)와 검사 결과(빠진 것)와 함께 줘요. `new`는 폴더에 있지만 아직 한 번도 올리지 않은 아이템이에요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-263
        spec:
        - SPEC-417
      responses:
        '200':
          description: 폴더의 아이템
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItemList'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/items/{itemId}/list:
    post:
      operationId: listItem
      summary: 상점에 올리기
      description: 검사(파일, 착용 아이템은 몸 템플릿 5종 레이어, 라이선스 대장 줄, 0원)를 지나면 `listed`로 넣거나 바꿔요(TBL-175). 이미 올린 아이템이면 200이고 바뀌는 것이 없어요. 본문은 없어요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-264
        spec:
        - SPEC-417
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 올린 아이템
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ItemInvalid'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/items/{itemId}/unlist:
    post:
      operationId: unlistItem
      summary: 상점에서 내리기
      description: '`unlisted`로 바꿔요. 받은 친구의 보관함, 차림, 일기장 꾸밈, 붙인 스티커에는 그대로 보여요. 처음 아이템은 내릴 수 없어요(400). 이미 내렸으면 200이에요. 본문은 없어요.'
      security:
      - cfAccess: []
      x-corthex:
        id: API-265
        spec:
        - SPEC-417
      parameters:
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 내린 아이템
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
  /chat/admin/api/image-costs:
    get:
      operationId: getImageCosts
      summary: 이번 달 그림 비용
      description: 관리자 화면(SCR-169)이 불러요. 한국 시각 달력 달의 그림 비용을 종류별로 줘요(SPEC-414, 427). 예산은 금액으로 정해 둔 것만 한도와 비율이 있고, `unlimited`이면 null이에요(D119, 그림 월 예산 없음). 사람별 값은 없어요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-266
        spec:
        - SPEC-414
        - SPEC-427
      responses:
        '200':
          description: 이번 달 그림 비용
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageCosts'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/DbUnavailable'
components:
  x-corthex:
    errors:
      invalid_input:
        status: 400
        meaning: 요청 모양이 틀림(빠진 칸, 길이·범위 밖, 목록에 없는 성격, 성격 4개 이상, 자리와 종류가 맞지 않음, 일기장 칸에 다른 종류, 형식이 틀린 경로 값, 처음 아이템 내리기)
        message: 뭔가 잘못 보냈나 봐. 다시 해 볼게
        client: 입력 칸 오류면 그 칸 옆에 보이고, 아니면 오류 상태와 추적 id
      login_required:
        status: 401
        meaning: 로그인 쿠키가 없거나 끝남
        message: 다시 로그인해 줘
        client: 로그인 화면(SCR-164)으로 감
      cross_site:
        status: 403
        meaning: 쓰기 요청의 Origin이 없거나 다름
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태와 추적 id
      not_allowed:
        status: 403
        meaning: 관리자 경로에 Access 증명이 없거나 동희님 계정이 아님
        message: 관리자만 볼 수 있어요
        client: 관리자 화면이 막힘 상태
      not_found:
        status: 404
        meaning: 없거나 로그인한 친구의 것이 아님, 내린 아이템 받기, 목록에 없는 파일, 꺼진 기능(MARONG_DECOR=0)
        message: 찾지 못했어
        client: 빈 상태나 목록으로 돌아감
      not_ready:
        status: 409
        meaning: 캐릭터가 ready가 아니거나 보관 해제됨
        message: 아직 다 만들어지지 않았어
        client: 캐릭터 만들기 화면으로 안내
      not_owned:
        status: 409
        meaning: 보관함에 없는 아이템을 입히거나 일기장·스티커에 씀
        message: 아직 안 받은 거야. 상점에서 먼저 받아 줘
        client: 상점의 그 아이템으로 안내
      too_many_stickers:
        status: 409
        meaning: 한 장에 스티커 11개 이상
        message: 스티커는 한 장에 10개까지야
        client: 편집 화면이 더 붙이기를 막고 이 메시지
      item_invalid:
        status: 409
        meaning: 아이템 검사 실패(빠진 파일·레이어, 라이선스 대장 줄 없음, 0원이 아님). missing에 빠진 것
        message: 이 아이템은 아직 올릴 수 없어요
        client: 관리자 화면이 빠진 것 목록을 보여 줌
      too_large:
        status: 413
        meaning: 본문이 16KB를 넘음
        message: 너무 길어
        client: 오류 상태와 추적 id
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태, 다시 시도, 추적 id
      db_unavailable:
        status: 503
        meaning: DB 연결 실패
        message: 잠깐 문제가 생겼어. 조금 뒤에 다시 해 볼래?
        client: 오류 상태, 다시 시도
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: marong_session
      description: 통합 앱의 로그인 쿠키(TERM-174, unified.openapi.yaml과 같음)
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: 관리자 경로 전용. Cloudflare Access가 붙이는 JWT를 서버가 다시 확인해요(통합 앱 SPEC-395)
  headers:
    NoStore:
      description: JSON 응답은 저장하지 않게 해요
      schema:
        type: string
        enum:
        - no-store
    PrivateCache:
      description: 장면 그림은 그 사람의 브라우저에만 남겨요
      schema:
        type: string
        pattern: ^private, max-age=[0-9]{1,8}$
      example: private, max-age=31536000
    Immutable:
      description: 아이템 파일은 이름에 세트 버전이 있어 바뀌지 않아요
      schema:
        type: string
        enum:
        - public, max-age=31536000, immutable
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      description: 로그인한 친구의 캐릭터 id
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      description: 아이템 id(아이템 목록 폴더의 id)
      schema:
        $ref: '#/components/schemas/ItemIdValue'
    ItemSet:
      name: set
      in: path
      required: true
      description: 아이템 세트 버전
      schema:
        type: string
        pattern: ^v[0-9]{1,3}$
    Date:
      name: date
      in: path
      required: true
      description: 일기 날짜(한국 날짜, diary.openapi.yaml의 Date와 같음)
      schema:
        type: string
        format: date
  responses:
    InvalidInput:
      description: 요청이 틀림
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            personality:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청이 틀림
                status: 400
                code: invalid_input
                traceId: 4bf92f3577b34da6
                errors:
                - field: personality
                  reason: not_an_option
    LoginRequired:
      description: 로그인 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CrossSite:
      description: 다른 사이트에서 온 쓰기 요청
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminForbidden:
      description: 관리자 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 없거나 로그인한 친구의 것이 아님. 꺼진 기능도 같은 응답
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: https://marong.corthex-hq.com/problems/not-found
                title: 찾지 못함
                status: 404
                code: not_found
                traceId: 4bf92f3577b34da6
    NotReady:
      description: 캐릭터가 ready가 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotOwned:
      description: 보관함에 없는 아이템
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotOwnedOrNotReady:
      description: 보관함에 없는 아이템(not_owned) 또는 ready가 아닌 캐릭터(not_ready)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StickerConflict:
      description: 스티커 11개 이상(too_many_stickers) 또는 보관함에 없는 스티커(not_owned)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ItemInvalid:
      description: 아이템 검사 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing-layer:
              value:
                type: https://marong.corthex-hq.com/problems/item-invalid
                title: 아이템 검사 실패
                status: 409
                code: item_invalid
                traceId: 4bf92f3577b34da6
                missing:
                - layer:dog_long
                - license
    TooLarge:
      description: 본문이 16KB를 넘음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: 예상하지 못한 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DbUnavailable:
      description: DB 연결 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
          - invalid_input
          - login_required
          - cross_site
          - not_allowed
          - not_found
          - not_ready
          - not_owned
          - too_many_stickers
          - item_invalid
          - too_large
          - internal
          - db_unavailable
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
        errors:
          type: array
          maxItems: 10
          description: 검증 오류 위치. 보낸 값은 담지 않음
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                enum:
                - body
                - request
                - id
                - itemId
                - date
                - personality
                - likes
                - dislikes
                - ownerCall
                - head
                - neck
                - backgroundId
                - paperId
                - fontId
                - stickers
                - x
                - y
                - scale
                - rotation
              index:
                type: integer
                minimum: 0
                maximum: 9
                description: API-261 스티커 배열의 0부터 시작하는 위치(해당할 때만)
              reason:
                type: string
                enum:
                - required
                - too_short
                - too_long
                - bad_format
                - out_of_range
                - not_an_option
                - wrong_kind
        missing:
          type: array
          maxItems: 20
          description: item_invalid일 때 빠진 것(`file:<이름>`, `layer:<템플릿>`, `license`, `price`, `outside_slot:<템플릿>`)
          items:
            type: string
            pattern: ^[a-z_]{1,20}(:[a-z0-9_.]{1,30})?$
    ItemIdValue:
      type: string
      pattern: ^[a-z0-9-]{3,40}$
    Personality:
      type: string
      enum:
      - 활발함
      - 얌전함
      - 겁이 많음
      - 먹보
      - 애교 많음
      - 고집 셈
      - 호기심 많음
      - 느긋함
    Intro:
      type: object
      additionalProperties: false
      required:
      - personality
      - likes
      - dislikes
      - ownerCall
      properties:
        personality:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Personality'
        likes:
          type: string
          maxLength: 60
        dislikes:
          type: string
          maxLength: 60
        ownerCall:
          type: string
          minLength: 1
          maxLength: 10
          description: 아이가 주인을 부르는 말(예 누나, 엄마, 형아)
    IntroEnvelope:
      type: object
      additionalProperties: false
      required:
      - intro
      - introAt
      - voice
      - voiceSource
      properties:
        intro:
          oneOf:
          - $ref: '#/components/schemas/Intro'
          - type: 'null'
          description: 저장한 적이 없으면 null
        introAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        voice:
          oneOf:
          - type: string
            pattern: ^[A-Za-z]{2,24}$
          - type: 'null'
          description: 지금 통화 목소리. null이면 기본 목소리
        voiceSource:
          type: string
          enum:
          - none
          - recommended
          - chosen
          description: none 아무도 고르지 않음 | recommended 아이 소개로 추천 | chosen 친구가 고름
    ItemKind:
      type: string
      enum:
      - hat
      - top
      - scarf
      - background
      - paper
      - font
      - sticker
    Slot:
      type: string
      enum:
      - head
      - body
      - neck
    Item:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - slot
      - name
      - priceKrw
      - thumbUrl
      - owned
      - starter
      properties:
        id:
          $ref: '#/components/schemas/ItemIdValue'
        kind:
          $ref: '#/components/schemas/ItemKind'
        slot:
          oneOf:
          - $ref: '#/components/schemas/Slot'
          - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 20
          description: 화면에 보이는 한국어 이름
        priceKrw:
          type: integer
          const: 0
          description: 지금은 늘 0(D113)
        thumbUrl:
          type: string
          format: uri-reference
          description: 아이템 파일(API-257)의 썸네일 또는 스티커 그림
        owned:
          type: boolean
        starter:
          type: boolean
          description: 처음 아이템(모두가 가짐)
    Shop:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/Item'
    Claim:
      type: object
      additionalProperties: false
      required:
      - itemId
      - owned
      properties:
        itemId:
          $ref: '#/components/schemas/ItemIdValue'
        owned:
          type: boolean
          const: true
    OutfitSet:
      type: object
      additionalProperties: false
      required:
      - head
      - body
      - neck
      properties:
        head:
          oneOf:
          - $ref: '#/components/schemas/ItemIdValue'
          - type: 'null'
        body:
          oneOf:
          - $ref: '#/components/schemas/ItemIdValue'
          - type: 'null'
        neck:
          oneOf:
          - $ref: '#/components/schemas/ItemIdValue'
          - type: 'null'
    WornItem:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - layerUrl
      properties:
        id:
          $ref: '#/components/schemas/ItemIdValue'
        name:
          type: string
          maxLength: 20
        layerUrl:
          type: string
          format: uri-reference
          description: 그 캐릭터 몸 템플릿의 레이어(`/chat/decor/v1/{id}/{template}.png`, 1024×1024 투명). 표정 그림 위에 같은 크기로 겹쳐요
    WornOutfit:
      type: object
      additionalProperties: false
      required:
      - head
      - body
      - neck
      description: 입은 모습. 겹치는 순서는 몸→목→머리(옷 위에 목도리, 그 위에 모자)
      properties:
        head:
          oneOf:
          - $ref: '#/components/schemas/WornItem'
          - type: 'null'
        body:
          oneOf:
          - $ref: '#/components/schemas/WornItem'
          - type: 'null'
        neck:
          oneOf:
          - $ref: '#/components/schemas/WornItem'
          - type: 'null'
    Closet:
      type: object
      additionalProperties: false
      required:
      - items
      - characterId
      - outfit
      - diaryDecor
      properties:
        items:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/Item'
          description: 받은 아이템과 처음 아이템(내린 것도 포함)
        characterId:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
          - type: 'null'
          description: 쓰는 캐릭터. null이면 기본 마롱이(차림 없음)
        outfit:
          oneOf:
          - $ref: '#/components/schemas/WornOutfit'
          - type: 'null'
        diaryDecor:
          $ref: '#/components/schemas/DiaryDecorView'
    DiaryDecorSet:
      type: object
      additionalProperties: false
      required:
      - backgroundId
      - paperId
      - fontId
      properties:
        backgroundId:
          $ref: '#/components/schemas/ItemIdValue'
        paperId:
          $ref: '#/components/schemas/ItemIdValue'
        fontId:
          $ref: '#/components/schemas/ItemIdValue'
    DiaryDecorView:
      type: object
      additionalProperties: false
      required:
      - background
      - paper
      - font
      properties:
        background:
          type: object
          additionalProperties: false
          required:
          - id
          - imageUrl
          properties:
            id:
              $ref: '#/components/schemas/ItemIdValue'
            imageUrl:
              oneOf:
              - type: string
                format: uri-reference
              - type: 'null'
              description: null이면 지금 일기장 배경(처음 아이템)
        paper:
          type: object
          additionalProperties: false
          required:
          - id
          - imageUrl
          - style
          properties:
            id:
              $ref: '#/components/schemas/ItemIdValue'
            imageUrl:
              oneOf:
              - type: string
                format: uri-reference
              - type: 'null'
            style:
              oneOf:
              - type: string
                pattern: ^[a-z-]{1,20}$
              - type: 'null'
              description: CSS로 그리는 속지 이름(예 manuscript, 지금 원고지 칸)
        font:
          type: object
          additionalProperties: false
          required:
          - id
          - family
          - fontUrl
          properties:
            id:
              $ref: '#/components/schemas/ItemIdValue'
            family:
              type: string
              maxLength: 40
              description: '@font-face에 쓰는 이름'
            fontUrl:
              oneOf:
              - type: string
                format: uri-reference
              - type: 'null'
              description: null이면 지금 글꼴(처음 아이템)
    Sticker:
      type: object
      additionalProperties: false
      required:
      - itemId
      - x
      - y
      - scale
      - rotation
      properties:
        itemId:
          $ref: '#/components/schemas/ItemIdValue'
        x:
          type: integer
          minimum: 0
          maximum: 1000
          description: 일기 카드 너비의 천분율
        y:
          type: integer
          minimum: 0
          maximum: 1000
          description: 일기 카드 높이의 천분율
        scale:
          type: integer
          minimum: 50
          maximum: 200
          description: 크기(%)
        rotation:
          type: integer
          minimum: -180
          maximum: 180
          description: 기울기(도)
    StickerView:
      allOf:
      - $ref: '#/components/schemas/Sticker'
      - type: object
        required:
        - imageUrl
        properties:
          imageUrl:
            type: string
            format: uri-reference
    StickerSet:
      type: object
      additionalProperties: false
      required:
      - stickers
      properties:
        stickers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Sticker'
          description: 배열 순서가 겹치는 순서(앞이 아래). 11개 이상이면 409 too_many_stickers
    StickerList:
      type: object
      additionalProperties: false
      required:
      - date
      - stickers
      properties:
        date:
          type: string
          format: date
        stickers:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/StickerView'
    DiaryWriter:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - kind
      - faceUrl
      - active
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 12
        kind:
          type: string
          enum:
          - dog
          - cat
        faceUrl:
          type: string
          format: uri-reference
          description: 그 캐릭터의 smile 그림(통합 앱 API-242)
        active:
          type: boolean
          description: 보관 해제(retired)면 false. false면 다시 그리기 버튼을 그리지 않아요
    AdminItem:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - slot
      - name
      - state
      - starter
      - owners
      - missing
      properties:
        id:
          $ref: '#/components/schemas/ItemIdValue'
        kind:
          $ref: '#/components/schemas/ItemKind'
        slot:
          oneOf:
          - $ref: '#/components/schemas/Slot'
          - type: 'null'
        name:
          type: string
          maxLength: 20
        state:
          type: string
          enum:
          - listed
          - unlisted
          - new
        starter:
          type: boolean
        owners:
          type: integer
          minimum: 0
          description: 받은 친구 수(처음 아이템은 0)
        missing:
          type: array
          maxItems: 20
          description: 검사에서 빠진 것. 비어 있으면 올릴 수 있음
          items:
            type: string
    AdminItemList:
      type: object
      additionalProperties: false
      required:
      - set
      - items
      properties:
        set:
          type: string
          pattern: ^v[0-9]{1,3}$
        items:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/AdminItem'
    Budget:
      type: object
      additionalProperties: false
      required:
      - limitUsd
      - usedUsd
      - ratio
      properties:
        limitUsd:
          type: number
          minimum: 0
        usedUsd:
          type: number
          minimum: 0
        ratio:
          type: number
          minimum: 0
          description: usedUsd / limitUsd
    ImageCosts:
      type: object
      additionalProperties: false
      required:
      - month
      - byKind
      - budgets
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
          description: 한국 시각 달
        byKind:
          type: object
          additionalProperties: false
          required:
          - diary
          - topic
          - reaction
          - character
          properties:
            diary:
              type: number
              minimum: 0
            topic:
              type: number
              minimum: 0
            reaction:
              type: number
              minimum: 0
            character:
              type: number
              minimum: 0
        budgets:
          type: object
          additionalProperties: false
          required:
          - diary
          - character
          properties:
            diary:
              description: MARONG_DIARY_IMAGE_BUDGET_USD(일기 그림만. 장면 그림은 예산이 없어요, D119). 값이 unlimited이면 null
              oneOf:
              - $ref: '#/components/schemas/Budget'
              - type: 'null'
            character:
              description: MARONG_IMAGE_MONTHLY_USD(캐릭터 만들기). 통합 앱 SPEC-380 그대로
              oneOf:
              - $ref: '#/components/schemas/Budget'
              - type: 'null'
