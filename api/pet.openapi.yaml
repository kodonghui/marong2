              schema:
                type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - exhausted
              examples:
                ok:
                  value:
                    status: ok
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/BadSignature'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /internal/calls/{id}/end:
    post:
      operationId: endCall
      summary: 통화 끝(통화 서버)
      description: '자막은 대화에 `kind: call`로 들어가 그림일기 하루 모음에 쓰여요. 두 번째 부름은 204 그대로.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              - unchargedMinutes
              - transcript
              properties:
                reason:
                  type: string
                  enum:
                  - member
                  - quota
                  - error
                unchargedMinutes:
                  type: integer
                  minimum: 0
                  maximum: 240
                  description: 내부 API 실패로 못 쓴 분(끝날 때 한 번에 씀)
                transcript:
                  type: array
                  maxItems: 400
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - role
                    - text
                    - at
                    properties:
                      role:
                        type: string
                        enum:
                        - member
                        - pet
                      text:
                        type: string
                        maxLength: 1000
                      at:
                        type: string
                        format: date-time
            examples:
              end:
                value:
                  reason: member
                  unchargedMinutes: 0
                  transcript:
                  - role: member
                    text: 콩아 뭐 해?
                    at: '2026-11-17T06:40:00Z'
      security:
      - internalSecret: []
      x-corthex:
        id: API-209
        spec:
        - SPEC-345
        - SPEC-335
        omit:
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '409': 상태와 부딪히지 않음
      responses:
        '204':
          description: 성공(본문 없음)
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/BadSignature'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /healthz:
    get:
      operationId: health
      summary: 살아 있음
      security: []
      x-corthex:
        id: API-210
        spec:
        - SPEC-368
        omit:
          '400': 입력이 없음
          '401': 로그인 전에 부름
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              examples:
                ok:
                  value:
                    ok: true
        default:
          $ref: '#/components/responses/ServerError'
components:
