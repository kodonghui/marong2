# 마롱이 반려동물 서비스 API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/pet.md(SPEC-310~369), DB: marong/pet/schema.sql(TBL-140~163), 표 설명: docs/05-erd/pet.md
openapi: 3.1.0
info:
  title: 마롱이 반려동물 서비스 API
  version: 0.1.0
  description: '마롱이 반려동물 서비스(공개 서비스, 새 프로세스 `run_pet.py`, 새 DB `marong_pet`)의 모바일 웹(PWA)과 통화 서버가 쓰는 계약이에요. 설계: docs/04-functional-spec/pet.md(SPEC-310~369),
    DB: marong/pet/schema.sql(TBL-140~163), 표 설명: docs/05-erd/pet.md. 원본은 이 파일이고 코드는 이 파일을 따라가요(06 단계). 2026-11-17 16:33 KST 0.1.0으로 얼림(D72, 동희님 ''추천대로 모두 정하기''). 01 질문 1~3이 추천안과 다르거나 결제 대행·본인확인 기관을 고르면 아래 Open 칸만 바꿔요.


    - 로그인은 카카오·구글 OIDC이고 쿠키 `pet_session`이에요. 모든 값은 세션 회원으로만 읽고 바꿔요. 남의 것·없는 것·지운 것은 같은 404 `not_found`예요(SPEC-364).

    - 쓰기 요청(POST·PUT·PATCH·DELETE)은 `Origin`이 서비스 주소여야 해요. 없으면 `Sec-Fetch-Site: same-origin`일 때만(SPEC-365). 결제 대행 웹훅, OIDC 콜백, /internal/은 예외예요.

    - 오류는 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`이고 화면 글은 명세 3.10과 같아요.

    - 응답에 남은 한도 단위, 원가, 모델 이름, 공급자 `sub`, 생년월일이 없어요(SPEC-353, 366).

    - 페이지(`/`, `/pets/…`, `/create`, `/shop`, `/me`)와 정적 파일(`/static/…`), 서비스 워커는 이 계약에 없어요. 화면은 07 사이트맵과 08 화면 정의에 있어요.


    계약에서 정한 것(Claude 제안, 2026-11-17, 검토 대상).

    1. 검증 오류는 400이에요(422는 쓰지 않음). 다른 마롱이 계약과 같아요. 경로 id의 형식이 틀리면 400, 없거나 남의 것이면 404예요.

    2. 바꾸는 요청이 지금 상태와 같으면 200이고 아무것도 바뀌지 않아요(모드, 보관·꺼내기, 동의 값, 구독 해지).

    3. 모델을 부르는 긴 일(특징표, 미리 보기, 후보, 표정, 다시 그리기, 내보내기)은 202이고 결과는 상태로 알려요. 실패도 HTTP 오류가 아니라 상태의 `failure`·`lastRedraw`로 와요. 바로 답하는 작별 의식만 503 `farewell_failed`예요.

    4. 아이 답은 메시지 저장(201) 뒤 SSE로 와요. 모델 실패는 `system` 메시지 `reply_failed`이고, 거절·검사 실패는 정해 둔 답이에요(SPEC-327).

    5. 하루 한도·예산·잠듦은 409이고 미리 보기·내보내기 하루 수와 요청 빈도는 429예요. `quota_exhausted`는 `prompt`로 화면이 할 일을 알려요(SPEC-354, 339).

    6. 같은 요청 되풀이: 메시지는 `clientId`, 주문은 `idempotencyKey`, 결제 확인과 웹훅은 먼저 온 쪽, 통화 끝은 두 번째도 204예요.

    7. 가입 대기 세션은 `signup`만 받아요. 다른 API는 401이에요.


    Open: 결제 대행과 본인확인 기관을 고르면(02 질문 A·B) `Checkout.pg`, 웹훅 본문, 서명 헤더 이름을 그 회사 SDK에 맞춰요.'
servers:
- url: https://pet.example.com
  description: 공개 도메인(동희님 준비물, SPEC-368). Cloudflare Tunnel, Access 없음
- url: http://127.0.0.1:8797
  description: 서버 안(통화 서버의 /internal/ 호출과 확인용)
security:
- memberSession: []
paths:
  /api/auth/{provider}/start:
    get:
      operationId: authStart
      summary: 로그인 시작
      description: 인가 주소로 보내요(PKCE, state·nonce는 10분 쿠키 `pet_oidc`). `openid` 범위만.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - kakao
          - google
      security: []
      x-corthex:
        id: API-150
        spec:
        - SPEC-310
        omit:
          '400': 해당 없음
          '401': 로그인 전에 부름
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '302':
          description: 다른 주소로 보냄
          headers:
            Location:
              schema:
                type: string
                maxLength: 2000
        default:
          $ref: '#/components/responses/ServerError'
  /api/auth/{provider}/callback:
    get:
      operationId: authCallback
      summary: 로그인 돌아옴
      description: 회원이면 회원 세션과 `/`로, 처음이면 가입 대기 세션(30분)과 `/signup`으로 보내요. 쿠키 `pet_session`(HttpOnly, Secure, SameSite=Lax). 실패도 302이고 세션 없이 `/?loginError=auth_state`(`state`
        다름·만료) 또는 `/?loginError=auth_provider`(공급자 오류·토큰 확인 실패)로 보내요. 화면 글은 `components.x-corthex.errors`의 그 코드예요.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - kakao
          - google
      - name: code
        in: query
        required: true
        schema:
          type: string
          maxLength: 512
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 128
      security: []
      x-corthex:
        id: API-151
        spec:
        - SPEC-310
        omit:
          '400': 브라우저가 여는 주소라 실패도 302예요(`/?loginError=auth_state`·`auth_provider`, SPEC-310)
          '401': 로그인 전에 부름
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '302':
          description: 다른 주소로 보냄
          headers:
            Location:
              schema:
                type: string
                maxLength: 2000
        default:
          $ref: '#/components/responses/ServerError'
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: 그 세션을 지워요.
      security:
      - memberSession: []
      x-corthex:
        id: API-152
        spec:
        - SPEC-310
        omit:
          '400': 입력이 없음
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '204':
          description: 성공(본문 없음)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CrossSite'
        default:
          $ref: '#/components/responses/ServerError'
  /api/signup:
    post:
      operationId: signup
      summary: 가입
      description: 생년월일은 저장하지 않아요. 만 19세 미만이면 아무것도 저장하지 않고 가입 대기 세션을 지워요(403 `underage`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - birthDate
              - agreeTerms
              - agreePrivacy
              - aiNoticeConfirmed
              - overseasTransfer
              properties:
                birthDate:
                  type: string
                  format: date
                agreeTerms:
                  type: boolean
                agreePrivacy:
                  type: boolean
                aiNoticeConfirmed:
                  type: boolean
                overseasTransfer:
                  type: boolean
                inviteCode:
                  type: string
                  pattern: ^[A-Z0-9]{8}$
            examples:
              adult:
                value:
                  birthDate: '2007-11-17'
                  agreeTerms: true
                  agreePrivacy: true
                  aiNoticeConfirmed: true
                  overseasTransfer: true
                  inviteCode: INV12345
      security:
      - memberSession: []
      x-corthex:
        id: API-153
        spec:
        - SPEC-311
        - SPEC-346
        - SPEC-368
        omit:
          '404': 경로가 id를 담지 않음
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                member:
                  value:
                    memberNo: AB12CD34
                    status: active
                    identityVerified: false
                    freeTickets: 0
                    paymentsEnabled: false
                    overseasTransfer: true
                    business: null
        '400':
          description: '`consents_missing` · `invalid_input`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                consents_missing:
                  $ref: '#/components/examples/consents_missing'
                invalid_input:
                  $ref: '#/components/examples/invalid_input'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`underage` · `invite_required` · `cross_site`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                underage:
                  $ref: '#/components/examples/underage'
                invite_required:
                  $ref: '#/components/examples/invite_required'
                cross_site:
                  $ref: '#/components/examples/cross_site'
        '409':
          description: '`already_member`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                already_member:
                  $ref: '#/components/examples/already_member'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me:
    get:
      operationId: getMe
      summary: 내 정보
      security:
      - memberSession: []
      x-corthex:
        id: API-154
        spec:
        - SPEC-311
        - SPEC-312
        - SPEC-361
        - SPEC-362
        omit:
          '400': 입력이 없음
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                member:
                  value:
                    memberNo: AB12CD34
                    status: active
                    identityVerified: true
                    freeTickets: 1
                    paymentsEnabled: true
                    overseasTransfer: true
                    business:
                      상호: (예시 상호)
                      사업자등록번호: 000-00-00000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteAccount
      summary: 계정 지우기
      description: 세션을 모두 끊고 지우기 작업을 시작해요(24시간 안). 주문은 회원 없이 5년 남아요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - confirm
              properties:
                confirm:
                  type: string
                  maxLength: 10
            examples:
              confirm:
                value:
                  confirm: 계정 지우기
      security:
      - memberSession: []
      x-corthex:
        id: API-155
        spec:
        - SPEC-314
        - SPEC-359
        omit:
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              examples:
                accepted:
                  value:
                    ok: true
        '400':
          description: '`confirm_required` · `invalid_input`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                confirm_required:
                  $ref: '#/components/examples/confirm_required'
                invalid_input:
                  $ref: '#/components/examples/invalid_input'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CrossSite'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me/consents:
    get:
      operationId: getConsents
      summary: 동의 보기
      security:
      - memberSession: []
      x-corthex:
        id: API-156
        spec:
        - SPEC-312
        omit:
          '400': 입력이 없음
          '403': 회원마다 보이는 것이 다르지 않음. 남의 것은 404(SPEC-364)
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consents'
              examples:
                all:
                  value:
                    items:
                    - kind: overseas_transfer
                      value: true
                      docVersion: 2026-11
                      at: '2026-11-17T06:40:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me/consents/{kind}:
    put:
      operationId: setConsent
      summary: 동의 바꾸기
      description: 줄을 더해 바꿔요. 같은 값이면 200 그대로. 바꿀 수 있는 것은 `overseas_transfer`뿐이고, 이용약관·개인정보·AI 고지를 끄려 하면 400 `use_delete_account`예요(계정 지우기로 안내).
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - terms
          - privacy
          - ai_notice
          - overseas_transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - value
              properties:
                value:
                  type: boolean
            examples:
              'off':
                value:
                  value: false
      security:
      - memberSession: []
      x-corthex:
        id: API-157
        spec:
        - SPEC-312
        omit:
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consents'
              examples:
                'off':
                  value:
                    items:
                    - kind: overseas_transfer
                      value: false
                      docVersion: 2026-11
                      at: '2026-11-17T06:40:00Z'
        '400':
          description: '`use_delete_account` · `invalid_input`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                use_delete_account:
                  $ref: '#/components/examples/use_delete_account'
                invalid_input:
                  $ref: '#/components/examples/invalid_input'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CrossSite'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me/identity:
    post:
      operationId: verifyIdentity
      summary: 본인인증 결과 보내기
      description: '서버가 기관 API로 결과를 다시 받아 CI의 HMAC과 시각만 저장해요. Open: 본인확인 기관 선택(02 질문 B).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
                  type: string
                  maxLength: 500
            examples:
              token:
                value:
                  token: imp_000000000000
      security:
      - memberSession: []
      x-corthex:
        id: API-158
        spec:
        - SPEC-313
        omit:
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                verified:
                  value:
                    memberNo: AB12CD34
                    status: active
                    identityVerified: true
                    freeTickets: 0
                    paymentsEnabled: true
                    overseasTransfer: true
                    business: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`underage` · `cross_site`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                underage:
                  $ref: '#/components/examples/underage'
                cross_site:
                  $ref: '#/components/examples/cross_site'
        '502':
          description: '`identity_provider`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                identity_provider:
                  $ref: '#/components/examples/identity_provider'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me/push:
    post:
      operationId: addPushSubscription
      summary: 웹 푸시 구독
      description: 같은 endpoint면 200이 아니라 201로 같은 id(덮어씀). jobId 자리에 구독 id를 줘요.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - endpoint
              - keys
              properties:
                endpoint:
                  type: string
                  pattern: ^https://[^\s]{1,2000}$
                keys:
                  type: object
                  additionalProperties: false
                  required:
                  - p256dh
                  - auth
                  properties:
                    p256dh:
                      type: string
                      maxLength: 200
                    auth:
                      type: string
                      maxLength: 100
            examples:
              chrome:
                value:
                  endpoint: https://fcm.googleapis.com/fcm/send/abc
                  keys:
                    p256dh: BElz
                    auth: k3x
      security:
      - memberSession: []
      x-corthex:
        id: API-159
        spec:
        - SPEC-337
        omit:
          '404': 경로가 id를 담지 않음
          '409': 상태와 부딪히지 않음
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                saved:
                  value:
                    jobId: 00000000-0000-4000-8000-000000000011
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CrossSite'
        default:
          $ref: '#/components/responses/ServerError'
  /api/me/push/{id}:
    delete:
      operationId: removePushSubscription
      summary: 웹 푸시 구독 지우기
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - memberSession: []
      x-corthex:
        id: API-160
        spec:
        - SPEC-337
        omit:
          '409': 상태와 부딪히지 않음
      responses:
        '204':
          description: 성공(본문 없음)
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /api/reports:
    post:
      operationId: createReport
      summary: 신고
      description: 같은 대상 두 번이면 200과 앞 신고 id(201 대신). 남의 것·없는 것은 404. jobId 자리에 신고 id를 줘요.
