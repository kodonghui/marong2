      operationId: adminAddTickets
      summary: 티켓 넣기
      description: 그 회원의 티켓 잔액에 `add`만큼 더해요(1\~1000). 빼는 요청은 없어요. 판매·결제는 없고 동희님이 손으로 넣어요. 응답은 더한 뒤 잔액이에요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-237
        spec:
        - SPEC-394
        - SPEC-395
        omit:
          '401': Access 증명이 없어도 403 not_allowed(SPEC-395)
          '409': 부딪히는 상태가 없음
          '429': 동희님만 부름
      parameters:
      - $ref: '#/components/parameters/FriendId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketsAdd'
            examples:
              ten:
                value:
                  add: 10
      responses:
        '200':
          description: 더한 뒤 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tickets'
              examples:
                added:
                  value:
                    tickets: 10
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/AdminForbiddenWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/admin/api/members/{friendId}/limits:
    put:
      operationId: adminSetLimits
      summary: 계정 한도 바꾸기
      description: 그 회원의 계정 한도(TERM-199)를 정해요. `unlimited`(무제한)와 `default`(기본 한도 TERM-200을 따름)는 숫자를 보내지 않고, `custom`(직접)은 `dailyUnits`(하루 사용 단위 1\~100000)와 `callMonthlyUsd`(통화 월 달러 0.01\~1000, 소수 둘째 자리까지) 가운데 하나 이상을 보내요. 보내지 않은 쪽은 기본 한도를 따라요. 프로필 행 UPDATE 하나로 바꾸고, 그 친구의 다음 요청부터 적용돼요(서버 재시작 없음). 지금 값과 같으면 200이고 아무것도 바뀌지 않아요. 로그는 `admin_limits friend=<id> mode=<mode>`뿐이에요. 응답은 바꾼 뒤의 계정 한도와 유효 한도예요.
      security:
      - cfAccess: []
      x-corthex:
        id: API-243
        spec:
        - SPEC-398
        omit:
          '401': Access 증명이 없어도 403 not_allowed(SPEC-395)
          '409': 부딪히는 상태가 없음(마지막에 보낸 값이 이김)
          '429': 동희님만 부름
      parameters:
      - $ref: '#/components/parameters/FriendId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitsUpdate'
            examples:
              unlimited:
                value:
                  mode: unlimited
              default:
                value:
                  mode: default
              custom:
                value:
                  mode: custom
                  dailyUnits: 200
                  callMonthlyUsd: '5.00'
              customDailyOnly:
                value:
                  mode: custom
                  dailyUnits: 200
      responses:
        '200':
          description: 바꾼 뒤의 계정 한도와 유효 한도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsChanged'
              examples:
                unlimited:
                  value:
                    limits:
                      mode: unlimited
                      dailyUnits: null
                      callMonthlyUsd: null
                    effective:
                      dailyUnits: null
                      callMonthlyUsd: null
                customDailyOnly:
                  value:
                    limits:
                      mode: custom
                      dailyUnits: 200
                      callMonthlyUsd: null
                    effective:
                      dailyUnits: 200
                      callMonthlyUsd: '3.00'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/AdminForbiddenWrite'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
components:
  x-corthex:
    errors:
      invalid_input:
        status: 400
        meaning: 요청 모양이 틀림(빠진 칸, 길이·형식·범위 밖, 목록에 없는 값, 형식이 틀린 경로 id, join 초대에 친구 id를 넣거나 link·relogin 초대에 친구 id가 없음, relogin 초대인데 그 친구에게 프로필이 없음, 계정 한도의 mode가 목록 밖이거나 숫자가 범위 밖·소수 셋째 자리, custom인데 숫자가 없음, unlimited·default에 숫자가 있음)
        message: 뭔가 잘못 보냈나 봐. 다시 해 볼게
        client: 입력 칸 오류면 그 칸 옆에 보이고, 아니면 오류 상태와 추적 id
      voice_unknown:
        status: 400
        meaning: 고른 목소리가 설정값 MARONG_CALL_VOICES 목록에 없음(목록이 바뀐 뒤 옛 화면에서 고른 경우)
        message: 그 목소리는 지금 못 골라. 목록을 다시 보여 줄게
        client: 목소리 목록(API-218)을 다시 불러 보여 줌
      photo_invalid:
        status: 400
        meaning: 사진이 없거나 3장을 넘음, JPEG·PNG·WebP가 아님, 열리지 않는 파일, 한 장이 8MB를 넘음, 긴 변이 4096px를 넘음
        message: 이 사진은 못 쓰겠어. 다른 사진으로 해 줄래?
        client: 고른 사진을 그대로 두고 틀린 장을 표시함
      self_request:
        status: 400
        meaning: 내 친구 코드로 친구 요청을 보냄
        message: 그건 네 코드야!
        client: 입력 칸 옆에 보임
      login_required:
        status: 401
        meaning: 로그인 쿠키가 없거나, 모르는 값이거나, 만료됐거나, 끊긴 세션
        message: 다시 들어와 줘
        client: 로그인 화면(SCR-164)으로 보냄
      code_wrong:
        status: 401
        meaning: 기기 추가 코드가 틀렸거나, 10분이 지났거나, 이미 쓴 코드(셋을 구분하지 않음)
        message: 코드가 안 맞아. 다시 확인해 줘
        client: 입력 칸을 비우고 다시 넣게 함
      cross_site:
        status: 403
        meaning: 쓰기 요청의 Origin이 https://marong.corthex-hq.com이 아님
        message: 이 화면에서 다시 해 줘
        client: 오류 상태. 자동으로 다시 보내지 않음
      not_allowed:
        status: 403
        meaning: '관리자 경로에 Cloudflare Access 증명이 없거나 맞지 않음, 또는 그 이메일이 동희님 계정이 아님(SPEC-395: 둘 다 403)'
        message: 이 계정으로는 열 수 없어
        client: 쓸 수 없는 계정 상태. 다시 시도하지 않음
      not_found:
        status: 404
        meaning: 없는 캐릭터·그림·친구·회원이거나 로그인한 친구의 것이 아님(뺀 캐릭터, 기다리는 요청이 없는 친구 포함). 설정이 꺼진 캐릭터 API(MARONG_CHARACTER=0)와 친구 API(MARONG_FRIENDS=0)도 이 코드
        message: 찾지 못했어. 새로 보여 줄게
        client: 목록을 다시 불러 보여 줌
      invite_not_found:
        status: 404
        meaning: 모르는 토큰이거나 형식이 틀린 토큰
        message: 이 링크는 못 쓰는 링크야. 동희한테 새로 받아 줘
        client: 가입 화면의 못 쓰는 링크 상태
      code_not_found:
        status: 404
        meaning: 그 친구 코드를 가진 사람이 없음
        message: 그런 코드는 없어. 다시 확인해 줘
        client: 입력 칸 옆에 보임
      too_many_characters:
        status: 409
        meaning: 만드는 중이거나 다 만든 캐릭터가 이미 3개(REQ-446)
        message: 캐릭터는 3개까지야. 하나를 빼고 다시 해 줘
        client: 캐릭터 목록에서 빼기를 권함
      image_budget:
        status: 409
        meaning: 이번 달 만들기 작업 비용의 합이 MARONG_IMAGE_MONTHLY_USD에 닿음(SPEC-380)
        message: 이번 달엔 그림을 더 못 그려. 다음 달에 다시 하자
        client: 만들기 단추를 막고 다음 달 안내를 보임. 만들던 캐릭터는 그대로 둠
      wrong_stage:
        status: 409
        meaning: 캐릭터의 만들기 단계(stage)가 이 요청이 받는 단계가 아님
        message: 순서가 안 맞아. 지금 상태를 다시 보여 줄게
        client: 캐릭터(API-221)를 다시 불러 그 단계 화면으로 보냄
      job_running:
        status: 409
        meaning: 그 캐릭터에 기다리거나 도는 만들기 작업이 이미 있음
        message: 아직 만드는 중이야. 조금만 기다려 줘
        client: 진행 상태를 보이고 API-221을 다시 부름
      no_regen_left:
        status: 409
        meaning: 후보 다시 만들기 2번을 다 씀(regenLeft 0)
        message: 다시 만들기는 다 썼어. 이 중에서 골라 줘
        client: 다시 만들기 단추를 막음
      not_ready:
        status: 409
        meaning: 캐릭터가 ready 상태가 아님(만드는 중)
        message: 아직 다 못 만들었어. 끝까지 만들고 하자
        client: 만들기 화면으로 보냄
      already_friends:
        status: 409
        meaning: 그 사람과 이미 아는 사이(accepted)
        message: 이미 친구야!
        client: 친구 목록을 다시 불러 보여 줌
      request_exists:
        status: 409
        meaning: 같은 두 사람 사이에 기다리는 친구 요청이 이미 있음(내가 보냈거나 상대가 보냄)
        message: 이미 요청이 가 있어
        client: 친구 목록을 다시 불러 받은 요청·보낸 요청을 보여 줌
      invite_used:
        status: 410
        meaning: 이미 쓴 초대 링크
        message: 이 링크는 이미 썼어. 다른 기기라면 기기 추가 코드로 들어와 줘
        client: 가입 화면의 이미 쓴 링크 상태. 로그인 화면으로 가는 단추
      invite_expired:
        status: 410
        meaning: 만든 지 7일(MARONG_INVITE_DAYS)이 지났거나 동희님이 거둔 초대 링크
        message: 이 링크는 기한이 지났어. 동희한테 새로 받아 줘
        client: 가입 화면의 기한 지난 링크 상태
      too_large:
        status: 413
        meaning: 요청 본문 전체가 26MB를 넘음(한 장이 8MB를 넘는 것은 400 photo_invalid)
        message: 사진이 너무 커. 조금 줄여서 올려 줘
        client: 고른 사진을 그대로 두고 줄여서 다시 올리게 함
      too_many_tries:
        status: 429
        meaning: 같은 주소에서 틀린 기기 추가 코드를 10분에 5번 넣음. 10분 동안 막음
        message: 너무 많이 틀렸어. 조금 있다가 다시 해 줘
        client: Retry-After까지 입력 칸을 막고 남은 시간을 보여 줌
      too_many_codes:
        status: 429
        meaning: 기기 추가 코드를 한 시간에 5번 넘게 만듦
        message: 코드를 너무 많이 만들었어. 조금 있다가 다시 해 줘
        client: Retry-After까지 단추를 막음
      request_limit:
        status: 429
        meaning: 친구 요청을 하루(새벽 4시 기준)에 10번 넘게 보냄
        message: 오늘은 요청을 다 썼어. 내일 다시 해 줘
        client: Retry-After까지 요청 단추를 막음
      check_unavailable:
        status: 503
        meaning: 사람 얼굴을 찾는 모델을 읽지 못해 사진을 받지 않음(SPEC-317). 아무것도 저장하지 않음
        message: 지금은 사진을 살펴볼 수가 없어. 조금 있다가 다시 올려 줘
        client: 고른 사진을 그대로 두고 다시 올리기 버튼을 보임
      db_unavailable:
        status: 503
        meaning: DB에 닿지 않거나 로그인 확인이 2초를 넘김(관리자 경로는 Access 공개키 포함). 로그인 화면으로 보내지 않음
        message: 잠깐 문제가 생겼어. 조금 있다가 다시 해 줘
        client: 다시 연결하는 중 상태. 5초 뒤부터 늘려 가며 다시
      internal:
        status: 500
        meaning: 예상하지 못한 서버 오류
        message: 잠깐 문제가 생겼어. 다시 해 볼래?
        client: 오류 상태, 다시 시도, 추적 id 보여 줌
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: marong_session
      description: 로그인 쿠키(TERM-174). 초대 링크로 가입하거나 기기 추가 코드로 로그인할 때 서버가 줘요. HttpOnly라 화면의 js는 읽지 못해요. 서버는 값의 SHA-256을 TBL-165에서 찾고 끊김·만료를 봐요.
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: 관리자 경로 전용. Cloudflare Access가 붙이는 JWT(RS256). 서버가 Access 공개키로 서명·aud·iss·exp를 확인하고 email의 sha256이 동희님 계정인지 봐요. 브라우저가 직접 넣지 않아요.
  headers:
    RetryAfter:
      description: 다시 보낼 수 있을 때까지의 초
      schema:
        type: string
        pattern: ^[0-9]{1,5}$
    SetSession:
      description: 로그인 쿠키를 줘요. 값은 추측할 수 없는 토큰(32바이트)이에요
      schema:
        type: string
      example: marong_session=<토큰>; Path=/; Max-Age=7776000; HttpOnly; Secure; SameSite=Lax
    ClearSession:
      description: 로그인 쿠키를 지워요
      schema:
        type: string
      example: marong_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
    NoStore:
      description: 토큰·코드가 오가는 응답은 저장하지 않게 해요
      schema:
        type: string
        enum:
        - no-store
    PrivateCache:
      description: 그림은 그 사람의 브라우저에만 남겨요
      schema:
        type: string
        pattern: ^private, max-age=[0-9]{1,6}$
      example: private, max-age=3600
  parameters:
    InviteToken:
      name: token
      in: path
      required: true
      description: 초대 링크의 토큰. 로그에 남기지 않아요
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CharacterId:
      name: id
      in: path
      required: true
      description: 캐릭터 id(TBL-169)
      schema:
        type: integer
        format: int64
        minimum: 1
    Slot:
      name: slot
      in: path
      required: true
      description: 그림 자리(TBL-170 slot)
      schema:
        type: string
        enum:
        - photo_1
        - photo_2
        - photo_3
        - preview
        - candidate_1
        - candidate_2
        - candidate_3
        - candidate_4
        - front
        - smile
        - excited
        - sleepy
        - surprised
        - sad
        - pout
    FriendId:
      name: friendId
      in: path
      required: true
      description: 상대 친구의 id(관리자 경로에서는 그 회원의 id)
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    InvalidInput:
      description: 요청이 틀림
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            too-long:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청 모양이 틀림
                status: 400
                code: invalid_input
                traceId: 0af7651916cd43dd
                errors:
                - field: name
                  reason: too_long
            missing:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청 모양이 틀림
                status: 400
                code: invalid_input
                traceId: 0af7651916cd43dd
                errors:
                - field: body
                  reason: required
            bad-id:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청 모양이 틀림
                status: 400
                code: invalid_input
                traceId: 0af7651916cd43dd
                errors:
                - field: id
                  reason: bad_format
    ProfileInvalid:
      description: 요청이 틀림, 또는 목록에 없는 목소리
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            name-too-long:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청 모양이 틀림
                status: 400
                code: invalid_input
                traceId: 0af7651916cd43dd
                errors:
                - field: botName
                  reason: too_long
            voice-unknown:
              value:
                type: https://marong.corthex-hq.com/problems/voice-unknown
                title: 목록에 없는 목소리
                status: 400
                code: voice_unknown
                traceId: 0af7651916cd43dd
    PhotoInvalid:
      description: 쓸 수 없는 사진, 또는 형식이 틀린 경로 id
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            photo-invalid:
              value:
                type: https://marong.corthex-hq.com/problems/photo-invalid
                title: 쓸 수 없는 사진
                status: 400
                code: photo_invalid
                traceId: 0af7651916cd43dd
                errors:
                - field: photos
                  reason: bad_format
            bad-id:
              value:
                type: https://marong.corthex-hq.com/problems/invalid-input
                title: 요청 모양이 틀림
                status: 400
                code: invalid_input
                traceId: 0af7651916cd43dd
                errors:
                - field: id
                  reason: bad_format
    FriendRequestInvalid:
      description: 요청이 틀림, 또는 내 친구 코드
      content:
