        dailyUnits:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        callMonthlyUsd:
          oneOf:
          - $ref: '#/components/schemas/Usd'
          - type: 'null'
    LimitsUpdate:
      type: object
      additionalProperties: false
      description: 계정 한도 바꾸기(API-243). unlimited·default는 숫자를 보내지 않아요. custom은 하나 이상을 보내요
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - unlimited
          - default
          - custom
        dailyUnits:
          type: integer
          minimum: 1
          maximum: 100000
        callMonthlyUsd:
          type: string
          pattern: ^[0-9]{1,4}(\.[0-9]{1,2})?$
          description: 0.01\~1000, 소수 둘째 자리까지. "5", "5.5", "5.00" 모두 받아요
      oneOf:
      - properties:
          mode:
            enum:
            - unlimited
            - default
        not:
          anyOf:
          - required:
            - dailyUnits
          - required:
            - callMonthlyUsd
      - properties:
          mode:
            const: custom
        anyOf:
        - required:
          - dailyUnits
        - required:
          - callMonthlyUsd
    LimitsChanged:
      type: object
      additionalProperties: false
      required:
      - limits
      - effective
      properties:
        limits:
          $ref: '#/components/schemas/AccountLimits'
        effective:
          $ref: '#/components/schemas/LimitValues'
