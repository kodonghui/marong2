  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 300
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
          - invalid_input
          - voice_unknown
          - photo_invalid
          - self_request
          - login_required
          - code_wrong
          - cross_site
          - not_allowed
          - not_found
          - invite_not_found
          - code_not_found
          - too_many_characters
          - image_budget
          - wrong_stage
          - job_running
          - no_regen_left
          - not_ready
          - already_friends
          - request_exists
          - invite_used
          - invite_expired
          - too_large
          - too_many_tries
          - too_many_codes
          - request_limit
          - check_unavailable
          - db_unavailable
          - internal
        traceId:
          type: string
          pattern: ^[0-9a-f]{16}$
        errors:
          type: array
          maxItems: 10
          description: 검증 오류 위치. 보낸 값은 담지 않음
          items:
            type: object
            required:
            - field
            - reason
            properties:
              field:
                type: string
                enum:
                - body
                - token
                - name
                - code
                - botName
                - voice
                - share
                - kind
                - photos
                - traits
                - template
                - tone
                - slot
                - characterId
                - friendCode
                - action
                - close
                - friendId
                - note
                - add
                - id
              reason:
                type: string
                enum:
                - required
                - too_short
                - too_long
                - bad_format
                - out_of_range
                - not_an_option
    InviteCheck:
      type: object
      additionalProperties: false
      required:
      - kind
      - state
      properties:
        kind:
          type: string
          enum:
          - join
          - link
          - relogin
          description: join이면 화면이 이름 칸을 보여요
        state:
          type: string
          enum:
          - open
          description: 쓸 수 있는 링크만 200이라 늘 open
    JoinRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 초대 링크의 토큰(32바이트의 base64url)
        name:
          type: string
          minLength: 1
          maxLength: 12
          description: 내 이름. 종류가 join이면 꼭 있어야 해요(앞뒤 공백은 떼고 세요)
    Session:
      type: object
      additionalProperties: false
      required:
      - friendName
      - botName
      properties:
        friendName:
          type: string
          maxLength: 40
          description: 로그인한 친구의 이름
        botName:
          type: string
          minLength: 1
          maxLength: 12
          description: 마롱이 이름(TERM-178)
    CodeLogin:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: 기기 추가 코드(TERM-175)
    DeviceCode:
      type: object
      additionalProperties: false
      required:
      - code
      - expiresAt
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
        expiresAt:
          type: string
          format: date-time
          description: 만든 때부터 10분 뒤
    UsageToday:
      type: object
      additionalProperties: false
      required:
      - chatTurns
      - callSeconds
      - images
      - units
      properties:
        chatTurns:
          type: integer
          minimum: 0
          description: 글 답 수
        callSeconds:
          type: integer
          minimum: 0
          description: 통화 초
        images:
          type: integer
          minimum: 0
          description: 그린 그림 수
        units:
          type: integer
          minimum: 0
          description: 사용 단위(TERM-191)로 합친 값
      description: 오늘(새벽 4시 기준) 쓴 양. 관리자 회원 목록(API-236)만 써요. 친구가 받는 모양은 Usage예요
    Usage:
      type: object
      additionalProperties: false
      description: 내 사용량(SPEC-399). API-234와 프로필(API-216)의 `usageToday`가 같은 모양이에요. 로그인한 친구의 값만 있어요
      required:
      - day
      - chatTurns
      - callSeconds
      - images
      - units
      - limit
      - tickets
      - callMonth
      properties:
        day:
          type: string
          format: date
          description: 사용량의 하루(한국 시간 새벽 4시에 바뀜)
        chatTurns:
          type: integer
          minimum: 0
          description: 글 답 수
        callSeconds:
          type: integer
          minimum: 0
          description: 통화 초
        images:
          type: integer
          minimum: 0
          description: 그린 그림 수
        units:
          type: integer
          minimum: 0
          description: 사용 단위(TERM-191)로 합친 값
        limit:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 100000
            description: 그 친구의 유효 하루 한도(SPEC-397 3.1)
          - type: 'null'
          description: 유효 하루 한도. 무제한이거나 기본인데 MARONG_DAILY_UNITS가 비어 있으면 null(막지 않음)
        tickets:
          type: integer
          minimum: 0
          description: 남은 티켓(TERM-192)
        callMonth:
          $ref: '#/components/schemas/CallMonth'
    CallMonth:
      type: object
      additionalProperties: false
      description: 이번 달(UTC 달) 통화가 유효 통화 월 한도의 몇 %인지. 달러는 없어요(SPEC-399)
      required:
      - limited
      - percent
      - resetsAt
      properties:
        limited:
          type: boolean
          description: 유효 통화 월 한도가 있는지. false면 percent·resetsAt이 null이고 화면은 '무제한'
        percent:
          oneOf:
          - type: integer
            minimum: 0
            description: 내림(이번 달 합 ÷ 유효 통화 월 한도 × 100). 통화 중에 넘으면 100보다 클 수 있어요
          - type: 'null'
          description: limited가 false이거나 이번 달 합을 읽지 못했으면 null
        resetsAt:
          oneOf:
          - type: string
            format: date-time
            description: 다음 UTC 달 1일 00:00(한국 시각 1일 오전 9시). +09:00으로 줘요
