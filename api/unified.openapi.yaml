# 마롱이 통합 앱(MVP) API 계약(OpenAPI 3.1). 설계: docs/04-functional-spec/unified.md(SPEC-370~396), DB: marong/migrations/020_unified.sql(TBL-164~172), 표 설명: docs/05-erd/unified.md
# 사람별 사용 한도(2026-11-21): docs/04-functional-spec/usage-limit.md(SPEC-397~399), DB: marong/migrations/021_usage_limit.sql, marong/call/migrations/009_usage_limit.sql, 표 설명: docs/05-erd/usage-limit.md
openapi: 3.1.0
info:
  title: 마롱이 통합 앱(MVP) API
  version: 0.2.0-draft
  description: |-
    앱과 브라우저의 가입(SCR-163), 로그인(SCR-164), 내 마롱이(SCR-165), 입혀 보기(SCR-166), 목소리 고르기(SCR-167), 친구(SCR-168), 관리자(SCR-169), 캐릭터 만들기(SCR-170\~174) 화면이 앱 서버(TERM-194)와 주고받는 계약이에요. 원본은 이 파일이고 코드는 이 파일을 따라가요(06단계). 글 대화 API(`api/app-chat.openapi.yaml`)와 같은 서버·같은 `/chat/` 아래예요. 범위는 동희님 주변 사람이 쓰는 MVP예요(D103). 고지, 동의, 나이 확인, 결제는 없어요.

    - 로그인은 쿠키 `marong_session`이에요(HttpOnly, Secure, SameSite=Lax, Path=/, Max-Age 90일). 쿠키에는 토큰이 있고 서버에는 그 SHA-256만 있어요(TBL-165). 쓸 때 하루에 한 번 만료를 90일 뒤로 밀어요. 쿠키가 없거나 끝났으면 401 `login_required`예요. 통화 서버도 같은 쿠키를 같은 표에서 확인해요(SPEC-374).
    - 로그인 없이 부르는 것은 초대 링크 확인(API-211), 가입(API-212), 코드 로그인(API-213) 셋뿐이에요.
    - 모든 값은 로그인한 친구의 id로만 읽고 바꿔요. 경로에 내 친구 id는 없어요. 남의 캐릭터나 없는 id는 없는 것과 같아요(404 `not_found`).
    - 쓰기 요청(POST·PUT·PATCH·DELETE)은 `Origin`이 `https://marong.corthex-hq.com`이어야 해요. 아니면 403 `cross_site`예요. 본문은 16KB까지이고 사진 올리기(API-220)만 26MB까지예요.
    - 관리자 경로(`/chat/admin/api/`)는 Cloudflare Access 뒤에 그대로 있어요. 서버가 `Cf-Access-Jwt-Assertion`을 다시 확인하고 이메일 해시가 동희님 계정인지 봐요. 로그인 쿠키는 보지 않아요. 증명이 없거나 동희님이 아니면 403 `not_allowed`예요(SPEC-395). 설정값 `MARONG_AUTH`와 무관하게 이 경로는 늘 Access로만 확인해요.
    - 오류는 다른 계약과 같은 RFC 9457 Problem Details에 `code`와 `traceId`를 더한 모양이에요. 코드 목록은 `components.x-corthex.errors`예요. JSON 응답은 모두 `Cache-Control: no-store`이고 그림만 `private`이에요.
    - 응답에는 토큰·코드의 해시, 파일 경로, 모델 이름, 작업 비용, 대화 글이 없어요. 초대 링크 주소(API-235)와 기기 추가 코드(API-214)는 만든 응답에 한 번만 있어요. 로그에는 결과 코드와 친구의 짧은 키만 남기고 토큰·코드·이름은 남기지 않아요.
    - 페이지(`/chat/join/:token`, `/chat/login`, `/chat/me`, `/chat/friends`, `/chat/character/…`, `/chat/admin/`)와 그 js·css, 목소리 견본 파일은 HTML과 파일이라 이 계약에 넣지 않았어요. 화면은 07 사이트맵과 08 화면 정의에 있어요.
    - 이 파일 밖에서 바뀌는 것: 글 대화(API-101\~106), 성향 맞춤, 앱 업데이트(API-141), 통화 서버의 API는 경로와 모양이 그대로이고 로그인만 이 계약의 쿠키로 바뀌어요(`no_dm`이 없어져요). 글 보내기(API-103)에 429 `daily_limit`(그 친구의 유효 하루 한도(SPEC-397)가 있고 티켓이 0일 때만)이 생겨요. 통화 시작(API-107)은 웹소켓이라 브라우저가 상태 번호를 읽지 못해요. 그래서 통화 시작의 거절은 지금의 `call_busy`·`budget_exhausted`처럼 연결을 받은 뒤 보내고 닫는 메시지예요: `{"type":"call_busy"}`(그 친구가 이미 통화 중), `{"type":"calls_full"}`(서버가 `MARONG_CALL_MAX`에 닿음), `{"type":"daily_limit"}`(하루 한도), `{"type":"budget_exhausted"}`(전체 예산과 그 친구의 유효 통화 월 한도). 통화 홈 상태(API-124)의 `blockedReason`에 `daily_limit`이 늘어서 화면이 걸기 전에 버튼을 막아요. 그 고침은 각 계약 파일에서 해요(TASK-395, TASK-401, TASK-406).

    계약에서 정한 것(Claude 제안, 2026-11-19, 검토 대상).
    1. 검증 오류는 400 `invalid_input`이에요(422는 쓰지 않음). 경로 id의 형식이 틀리면 400, 없거나 남의 것이면 404예요. 초대 토큰만은 형식이 틀려도 404 `invite_not_found`예요.
    2. 바꾸는 요청이 지금 값과 같으면 200이고 아무것도 바뀌지 않아요(프로필 값, 같은 캐릭터 적용, 가까운 사이 값). 이미 뺀 캐릭터 빼기와 세션 없는 로그아웃은 204예요.
    3. 표가 상태 코드만 정한 성공 응답의 본문은 이렇게 두었어요: 코드 로그인(API-213)은 가입과 같은 `{friendName, botName}`, 작업을 넣는 요청(API-223\~225)은 사진 올리기와 같은 `{character}`, 친구 요청(API-231)은 `{request}`, 요청 답(API-232)은 `{state}`.
    4. 틀린 코드, 기한 지난 코드, 이미 쓴 코드는 모두 401 `code_wrong`이에요. 같은 주소에서 10분에 5번 틀리면 10분 동안 429 `too_many_tries`예요.
    5. 캐릭터 설정(`MARONG_CHARACTER=0`)이 꺼져 있으면 캐릭터를 만들고 바꾸는 API(API-219\~229, API-238)가, 친구 설정(`MARONG_FRIENDS=0`)이 꺼져 있으면 친구 API(API-230\~233, API-239)가 404 `not_found`예요(명세 공통 9). 따로 코드를 두지 않았어요. 화면은 그 메뉴를 그리지 않아요. 그림 읽기(API-242)와 프로필의 캐릭터 값(API-216)은 설정이 꺼져 있어도 답해서, 이미 적용한 캐릭터의 얼굴은 그대로 보여요.
    6. 만들기 단계가 받는 요청: `photos`·`traits`에서 사진 올리기, `traits`·`preview`에서 특징표 정하기, `preview`에서 미리 보기, `preview`(미리 보기 그림이 있을 때)·`candidates`에서 후보 그리기, `candidates`(와 표정 작업이 실패한 `sheet`)에서 고르기, `name`·`done`에서 이름. 그 밖은 409 `wrong_stage`예요. 캐릭터 하나에 기다리거나 도는 작업은 하나뿐이고(TBL-171 고유 색인) 그동안 바꾸는 요청은 409 `job_running`이에요. 작업 결과는 API-221을 다시 물어서 봐요.
    7. 적용(API-228)은 캐릭터와 마롱이 이름을 한 번에 바꿔요. 기본 마롱이로 되돌리면 이름은 '마롱이'가 돼요. 적용 뒤 이름만 따로 바꾸는 것은 API-217이에요.
    8. 그림 예산을 다 쓰면 그림을 그리는 요청(API-219, 223, 224)이 409 `image_budget`이에요. 표정 그리기(API-225)는 막지 않아요(고른 후보를 버리지 않으려고). 만들던 캐릭터는 그대로 두고 다음 달에 이어요.
    9. 친구 요청은 같은 두 사람 사이에 하나예요. 답하기(API-232)의 `friendId`는 요청을 보낸 친구이고, 기다리는 요청이 없으면 404예요. 친구 끊기와 가까운 사이는 아는 사이(`accepted`)에만 돼요.
    10. 사용량 응답의 칸은 글 답 수, 통화 초, 그림 수, 사용 단위예요. 검색 수와 쇼핑 읽기 수는 TBL-172에 세기만 하고 응답에 넣지 않았어요.
    11. Access로만 확인된 기존 친구(`MARONG_AUTH`가 `access`·`both`일 때)가 이 계약의 API를 부르면, 프로필 행이 없을 때 서버가 `link`와 같은 방법으로 빠진 행을 먼저 만들어요(SPEC-374). 그래서 프로필(API-216)은 늘 친구 코드를 가져요.
    12. 약속 전화의 받기(REQ-464): 프로필(API-216)의 `pendingRing`이 지금 울리는 약속 전화예요. 웹 화면은 그 값이 있으면 받기 버튼을 그리고, 누르면 통화 화면을 `ring` 값과 함께 열어요. 통화 서버가 지금처럼 그 벨을 받음으로 바꿔요(API-107).
    13. 친구 요청의 `requestedAt`은 TBL `friendships.requested_at`이에요. 거절했거나 끊긴 쌍에 다시 요청하면 같은 행의 보낸 사람과 보낸 때를 새로 쓰고 답한 때를 비워요.

    사람별 사용 한도에서 정한 것(Claude 제안, 2026-11-21, 0.2.0-draft, 검토 대상. SPEC-397\~399, D106).
    14. 계정 한도(TERM-199)는 `mode`가 `unlimited`(무제한), `default`(기본 한도 TERM-200을 따름), `custom`(직접 정한 숫자, 빈 쪽은 기본 한도) 셋이에요. 바꾸기(API-243)는 PUT이라 세 칸을 통째로 정해요. 같은 값이면 200이고 아무것도 바뀌지 않아요(위 2와 같음).
    15. 달러 값은 JSON 숫자가 아니라 소수 둘째 자리까지의 문자열이에요(`"5.00"`, 정규식 `^[0-9]{1,4}\.[0-9]{2}$`). 받을 때는 소수 둘째 자리까지면 `"5"`, `"5.5"`도 받아요. 부동소수 반올림이 끼지 않게 하려고요.
    16. 친구가 받는 응답(API-216·234)에는 달러가 없어요. 통화는 유효 통화 월 한도의 몇 %인지(`callMonth.percent`, 내림)와 다시 채워지는 때만 있어요. 달러는 관리자 응답(API-236·243)에만 있어요.
    17. `limit`(유효 하루 한도)과 `callMonth.limited`는 서버가 계산한 값이라, 화면은 무제한인지 스스로 판단하지 않고 이 값만 봐요. 프로필 행이 없는 친구는 이 계약의 API를 부르기 전에 행이 생겨서(11) '기본'이에요.
    18. 오늘 사용량(API-234)과 프로필의 `usageToday`(API-216)는 같은 `Usage` 모양이에요. 지금 코드가 프로필에 `day`·`tickets`·`limit`을 이미 넣고 있어서, 계약을 코드에 맞추면서 `callMonth`를 더했어요(계약 손봄).

    Open: 초대 링크를 거두는 요청(TBL-164 `revoked_at`)과 보낸 친구 요청을 거두는 요청은 이 계약에 없어요. 필요해지면 ID를 더해요. 로컬 서버 포트는 앱 서버 진입점(SPEC-376)을 만들 때 확정해요.
servers:
- url: https://marong.corthex-hq.com
  description: 앱 서버. 터널이 /chat/ 아래를 앱 서버로 보내요. /chat/admin/ 아래만 Cloudflare Access 뒤예요
- url: http://127.0.0.1:8796
  description: '서버 안에서 직접(배포 확인용). 지금 글 대화 서버의 포트예요 [추정: 앱 서버가 같은 포트를 이어받음]'
security:
- session: []
paths:
  /chat/api/invites/{token}:
    get:
      operationId: checkInvite
      summary: 초대 링크 확인
      description: 가입 화면(SCR-163)이 열릴 때 불러요. 쓸 수 있는 링크면 종류를 돌려줘요. 종류가 `join`이면 화면이 이름 칸을 보여요. 누구의 링크인지(친구 id, 이름, 메모)는 돌려주지 않아요. 이 요청은 링크를 쓴 것으로 치지 않아요.
      security: []
      x-corthex:
        id: API-211
        spec:
        - SPEC-370
        omit:
          '400': 형식이 틀린 토큰도 404 invite_not_found
          '401': 로그인 없이 부름
          '403': 읽기라 Origin을 보지 않음
          '409': 쓴 링크는 410
          '429': 횟수 제한이 없음
      parameters:
      - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: 쓸 수 있는 초대 링크
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCheck'
              examples:
                join:
                  value:
                    kind: join
                    state: open
                link:
                  value:
                    kind: link
                    state: open
        '404':
          $ref: '#/components/responses/InviteNotFound'
        '410':
          $ref: '#/components/responses/InviteGone'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/api/join:
    post:
      operationId: joinWithInvite
      summary: 초대 링크로 가입·연결·다시 로그인
      description: 초대 링크를 쓰고 이 기기를 로그인시켜요. `join`이면 친구 행, 프로필(친구 코드 포함), 먼저 말 걸기 설정, 방, 통화 계정을 한 트랜잭션에서 만들고(SPEC-373) 링크를 쓴 것으로 적어요. `link`는 동희님이 고른 기존 친구 행에 빠진 행(프로필, 먼저 말 걸기 설정, 방)만 만들고, `relogin`은 세션만 만들어요. `name`은 `join`에서만 쓰고 다른 종류에서는 보내도 읽지 않아요. 이미 로그인된 기기가 보내도 받아서 그 기기의 쿠키를 새 로그인으로 바꾸고, 앞의 로그인은 끊지 않아요(화면은 보내기 전에 SCR-163#signed-in에서 한 번 물어요). 같은 링크를 두 기기가 동시에 쓰면 하나만 201이고 다른 하나는 410이에요.
      security: []
      x-corthex:
        id: API-212
        spec:
        - SPEC-370
        - SPEC-371
        - SPEC-373
        omit:
          '401': 로그인 없이 부름
          '409': 쓴 링크는 410
          '429': 횟수 제한이 없음
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
            examples:
              join:
                value:
                  token: example-token-not-real-00000000000000000000
                  name: 하늘
              link:
                value:
                  token: example-token-not-real-00000000000000000000
      responses:
        '201':
          description: 가입(또는 연결·다시 로그인)됨. 로그인 쿠키를 줘요
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                joined:
                  value:
                    friendName: 하늘
                    botName: 마롱이
        '400':
          $ref: '#/components/responses/InvalidInput'
        '403':
          $ref: '#/components/responses/CrossSite'
        '404':
          $ref: '#/components/responses/InviteNotFound'
        '410':
          $ref: '#/components/responses/InviteGone'
        '503':
          $ref: '#/components/responses/DbUnavailable'
        default:
          $ref: '#/components/responses/Internal'
  /chat/api/login/code:
    post:
      operationId: loginWithDeviceCode
      summary: 기기 추가 코드로 로그인
      description: 로그인 화면(SCR-164)에서 다른 기기가 만든 6자리 코드를 넣어요. 맞으면 코드를 쓴 것으로 적고 이 기기에 로그인 쿠키를 줘요. 틀린 코드, 10분이 지난 코드, 이미 쓴 코드는 모두 401 `code_wrong`이에요. 같은 주소에서 10분에 5번 틀리면 10분 동안 429예요(맞는 코드도 그동안은 429).
      security: []
      x-corthex:
        id: API-213
        spec:
        - SPEC-372
        omit:
          '404': 없는 코드는 401 code_wrong
          '409': 쓴 코드는 401 code_wrong
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeLogin'
            examples:
              code:
                value:
                  code: '402917'
      responses:
        '200':
          description: 로그인됨. 로그인 쿠키를 줘요
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                logged-in:
                  value:
                    friendName: 하늘
                    botName: 초코
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/CodeWrong'
        '403':
          $ref: '#/components/responses/CrossSite'
        '429':
