# The Marong app (docs/app-chat.md, docs/app-ring.md) for the Discord DM bot. Install as
# /etc/systemd/system/marong-discord.service.d/app.conf after migrations 014 and 015 (with a DB backup first).
#
# 1. In /etc/marong-discord/config (root:root 600, outside Git), set the same Access values the call server uses:
#      MARONG_APP_CHAT=1
#      MARONG_APP_ORIGIN=https://<call page address>        (the call page and /chat/ share it)
#      CF_ACCESS_TEAM_DOMAIN=<team>.cloudflareaccess.com
#      CF_ACCESS_AUD=<the Access application's AUD tag>
#      CF_ACCESS_EMAILS=<allowed emails, comma separated>
#      FCM_PROJECT_ID=<Firebase project id>                 (optional: the key file's project_id by default)
#      MARONG_APP_RING=1                                    (only after the app 0.2.0 rings on a real phone)
#    Without the Access values the chat server stays off and the bot runs as before (TC-119).
# 2. /etc/marong-discord/fcm-service-account.json (root:root 600): the FCM-only service account key. systemd refuses
#    to start the bot when a credential file is missing, so put the key there before installing this file. Without
#    this drop-in the in-app chat still works and every notification goes to the Discord DM (D18).
# 3. The tunnel sends only ^/chat(/|$) to 127.0.0.1:${MARONG_APP_PORT:-8796}, behind the same Access application.
[Service]
LoadCredential=fcm-service-account.json:/etc/marong-discord/fcm-service-account.json
