# Google Calendar for the Discord DM bot. Install as
# /etc/systemd/system/marong-discord.service.d/google.conf only after
# /etc/marong-discord/google-client.json (root:root 600, the web client JSON from Google Cloud) exists:
# systemd refuses to start the bot when a credential file is missing.
# The bot then listens on 127.0.0.1:${MARONG_GOOGLE_PORT:-8795}; the tunnel sends only /google/ there.
[Service]
LoadCredential=google-client.json:/etc/marong-discord/google-client.json
