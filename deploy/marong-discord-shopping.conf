# 디스코드 DM 마롱이의 네이버 쇼핑 검색(shop_search) 키를 넘기는 drop-in.
# 키 파일을 먼저 만든 뒤에만 깐다(파일이 없으면 서비스가 시작하지 못함):
#   /etc/marong-discord/naver-shop  root:root 600, 두 줄: 네이버 개발자 센터 애플리케이션의 Client ID, Client Secret
#   이 파일 → /etc/systemd/system/marong-discord.service.d/shopping.conf
#   systemctl daemon-reload && systemctl restart marong-discord.service  (로그에 'shop_search on')
# 끄려면 이 drop-in을 지우고 daemon-reload 뒤 재시작한다. 키가 없으면 마롱이는 가격을 못 찾아본다고 말한다.
[Service]
LoadCredential=naver-shop:/etc/marong-discord/naver-shop
