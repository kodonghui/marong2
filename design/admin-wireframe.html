:root { --page:#f4f4f4; --surface:#fff; --line:#cfcfcf; --text:#222; --muted:#666; --fill:#e6e6e6; --strong:#444 }

nav.jump { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 24px }
nav.jump a { color:var(--text); border:1px solid var(--line); background:var(--surface); padding:4px 10px; border-radius:999px; text-decoration:none; font-size:13px }
section.screen { margin:0 0 40px }
section.screen > h2 { font-size:18px; margin:0 0 4px }
section.screen > p { margin:0 0 12px; color:var(--muted) }
.state { margin:0 0 20px }
.state h3 { font:600 13px/1.4 ui-monospace, Consolas, monospace; margin:0 0 6px }
.pair { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start }
.frame { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; flex:none }
.frame .w { font:11px ui-monospace, Consolas, monospace; color:var(--muted); padding:4px 8px; border-bottom:1px dashed var(--line) }
.frame.w360 { width:360px } .frame.w430 { width:430px }
@media (max-width: 860px) { .frame.w430 { display:none } }
@media (max-width: 400px) { .frame.w360 { width:100% } }
.scr { padding:12px 16px 16px; display:grid; gap:8px }
.title { font-weight:700; font-size:15px }
.tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin:0 -16px; padding:0 16px; scrollbar-width:none }
.tabs span { flex:none; padding:10px 8px; min-height:44px; color:var(--muted); font-size:14px }
.tabs span.on { color:var(--text); font-weight:700; border-bottom:2px solid var(--strong) }
.g { font-size:12px; color:var(--muted); margin-top:6px }
.row { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; gap:8px; align-items:center }
.row .t { flex:1; min-width:0; overflow-wrap:anywhere } .row .t div + div { color:var(--muted); font-size:13px }
.row.dim { opacity:.55 } .row.bold .t div:first-child { font-weight:700 }
.card { background:var(--fill); border-radius:8px; padding:10px 12px; overflow-wrap:anywhere }
.btn { display:inline-block; border:1px solid var(--strong); border-radius:8px; padding:8px 12px; min-height:40px; text-align:center }
.btn.danger { border-width:2px; font-weight:700 }
.chips { display:flex; gap:6px; flex-wrap:wrap } .chips span { border:1px solid var(--line); border-radius:999px; padding:4px 10px } .chips span.on { border-color:var(--strong); font-weight:700 }
.skel { height:40px; background:var(--fill); border-radius:8px }
.band { border-left:4px solid var(--strong); background:var(--fill); padding:8px 10px }
.warnb { border:2px dashed var(--strong); padding:8px 10px; border-radius:8px }
.input { border:1px solid var(--strong); border-radius:6px; padding:8px 10px; color:var(--muted) }
.empty { color:var(--muted); padding:12px 0; text-align:center }
.att { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere }
.att::before { content:"●"; color:#999 } .att.d { font-weight:700 } .att.d::before { color:#222 }
.bar { height:8px; background:var(--fill); border-radius:4px; overflow:hidden } .bar i { display:block; height:100%; background:var(--strong) }
.small { font-size:12px; color:var(--muted) }
