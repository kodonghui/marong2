<title>마롱이 관리 페이지 와이어프레임</title>
<style>
/* 08 단계 와이어프레임: 회색, 시스템 글꼴, 자리표시 글. 색과 토큰은 09 단계(지금 unified.css·chat.css와 design/base.tokens.json)에서 와요.
   원본은 docs/08-screens/admin.md. 상태마다 한 칸이에요. 폭 360px와 430px를 나란히, 그 아래에 노트북 폭 1280px와 1440px(넓은 배치, 1024px부터, 1.1절)를 그려요.
   숫자와 이름은 지어낸 값이에요. 노트북 칸은 페이지 폭에 맞게 줄여 보여요(zoom).
   2026-11-24 기능 변경 3(체크포인트 전 제안): SCR-186#decor-off, SCR-201#app-removed, SCR-203#app-removed 칸을 더했어요. */
:root { --page:#f4f4f4; --surface:#fff; --line:#cfcfcf; --text:#222; --muted:#666; --fill:#e6e6e6; --strong:#444 }
* { box-sizing: border-box }
body { margin:0; background:var(--page); color:var(--text); font:14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; padding:24px 16px 48px }
h1 { font-size:22px; margin:0 0 4px }
.lead { color:var(--muted); margin:0 0 16px; max-width:72ch }
nav.jump { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 24px }
nav.jump a { color:var(--text); border:1px solid var(--line); background:var(--surface); padding:4px 10px; border-radius:999px; text-decoration:none; font-size:13px }
.view { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; font-size:13px; color:var(--muted) }
.view button { font:inherit; color:var(--text); border:1px solid var(--line); background:var(--surface); padding:4px 10px; border-radius:999px; min-height:32px; cursor:pointer }
.view button[aria-pressed="true"] { border-color:var(--strong); font-weight:700 }
section.screen { margin:0 0 40px }
section.screen > h2 { font-size:18px; margin:0 0 4px }
section.screen > p { margin:0 0 12px; color:var(--muted); max-width:90ch }
.state { margin:0 0 20px }
.state h3 { font:600 13px/1.4 ui-monospace, Consolas, monospace; margin:0 0 6px }
.pair { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start }
.frame { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; flex:none }
.frame .w { font:11px ui-monospace, Consolas, monospace; color:var(--muted); padding:4px 8px; border-bottom:1px dashed var(--line) }
.frame.w360 { width:360px } .frame.w430 { width:430px }
.frame.w768 { width:768px } .frame.w1024 { width:1024px } .frame.w1280 { width:1280px } .frame.w1440 { width:1440px }
@media (max-width: 860px) { .frame.w430 { display:none } }
@media (max-width: 400px) { .frame.w360 { width:100% } }
.wbox { margin-top:12px; width:100%; overflow:hidden }
body[data-view="phone"] .wbox.lap { display:none }
body[data-view="wide"] .state .pair { display:none }
.scr { padding:12px 16px 16px; display:grid; gap:8px }
/* 1023px 이하: 승인된 한 줄 기둥(본문 최대 720px, 가운데, 좌우 여백 16px). 360·430px에서는 아무것도 바뀌지 않아요 */

.title { font-weight:700; font-size:15px }
.tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin:0 -16px; padding:0 16px; scrollbar-width:none }
.tabs span { flex:none; padding:10px 8px; min-height:44px; color:var(--muted); font-size:14px }
.tabs span.on { color:var(--text); font-weight:700; border-bottom:2px solid var(--strong) }
.g { font-size:12px; color:var(--muted); margin-top:6px }
.row { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; gap:8px; align-items:center }
.row .t { flex:1; min-width:0; overflow-wrap:anywhere } .row .t div + div { color:var(--muted); font-size:13px }
.row.dim { opacity:.55 } .row.bold .t div:first-child { font-weight:700 }
.row.sel { border:2px solid var(--strong); background:var(--fill); padding:7px 9px } .row.sel .t div:first-child { font-weight:700 }
.card { background:var(--fill); border-radius:8px; padding:10px 12px; overflow-wrap:anywhere }
.btn { display:inline-block; border:1px solid var(--strong); border-radius:8px; padding:8px 12px; min-height:40px; text-align:center }
.btn.danger { border-width:2px; font-weight:700 }
.chips { display:flex; gap:6px; flex-wrap:wrap } .chips span { border:1px solid var(--line); border-radius:999px; padding:4px 10px } .chips span.on { border-color:var(--strong); font-weight:700 }
.skel { height:40px; background:var(--fill); border-radius:8px }
.skw { display:grid; gap:8px }
.band { border-left:4px solid var(--strong); background:var(--fill); padding:8px 10px }
.warnb { border:2px dashed var(--strong); padding:8px 10px; border-radius:8px }
.input { border:1px solid var(--strong); border-radius:6px; padding:8px 10px; color:var(--muted) }
.empty { color:var(--muted); padding:12px 0; text-align:center }
.att { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere }

.bar { height:8px; background:var(--fill); border-radius:4px; overflow:hidden } .bar i { display:block; height:100%; background:var(--strong) }
.small { font-size:12px; color:var(--muted) }
.trow { display:grid; grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 120px; gap:12px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line); overflow-wrap:anywhere }
.trow.th { color:var(--muted); font-size:12px; padding-top:4px }
.trow .thumb { width:40px; height:40px; border-radius:8px; background:var(--fill) }
.trow .btn { min-height:36px; padding:6px 10px }
.frame.wide .trow .btn { min-width:0 }

/* 칸 나눔. 좁은 폭에서는 칸 상자가 없는 것처럼 보여요(display:contents) → 승인된 폰 배치와 글자 하나까지 같아요.
   ~ 표시 칸은 넓은 폭에서만, ^ 표시 칸은 좁은 폭에서만 보여요 */
.rg { display:contents } .rg.wo { display:none }

.frame.wide .scr { max-width:1264px; margin:0 auto; padding:16px 32px 24px; column-gap:24px; row-gap:16px; align-items:start }
.frame.wide .rg { display:grid; gap:8px; align-content:start; min-width:0 }
.frame.wide .rg.no { display:none }
.frame.wide .rg[data-r="head"] { grid-area:head } .frame.wide .rg[data-r="top"] { grid-area:top } .frame.wide .rg[data-r="list"] { grid-area:list }
.frame.wide .rg[data-r="a"] { grid-area:a } .frame.wide .rg[data-r="b"] { grid-area:b } .frame.wide .rg[data-r="c"] { grid-area:c }
.frame.wide .tabs { margin:0; padding:0; overflow-x:visible }
.frame.wide .btn { justify-self:start; min-width:160px }
.frame.wide .rg.cols2 { grid-template-columns:repeat(2, minmax(0,1fr)) }
.frame.wide .rg.cols2 > .g, .frame.wide .rg.cols2 > .bar, .frame.wide .rg.cols2 > .span2, .frame.wide .rg.cols2 > .empty, .frame.wide .rg.cols2 > .warnb { grid-column:1 / -1 }
.frame.wide .rg.cols2 > .skw { grid-column:1 / -1; grid-template-columns:repeat(2, minmax(0,1fr)) }
.frame.wide .L1   { grid-template-columns:minmax(0,1fr); grid-template-areas:"head" "a" }
.frame.wide .L169 { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-areas:"head head" "a b" }
.frame.wide .L200 { grid-template-columns:360px repeat(2, minmax(0,1fr)); grid-template-rows:auto auto 1fr; grid-template-areas:"head head head" "list top top" "list b b" }
.frame.wide .L201 { grid-template-columns:360px repeat(2, minmax(0,1fr)); grid-template-rows:auto auto 1fr; grid-template-areas:"head head head" "list top top" "list a b" }
.frame.wide .L202 { grid-template-columns:360px minmax(0,1fr); grid-template-areas:"head head" "a b" }
.frame.wide .L203 { grid-template-columns:minmax(0,3fr) minmax(0,2fr); grid-template-areas:"head head" "top top" "a b" }
.frame.wide .L204 { grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-areas:"head head head" "a b c" }
</style>
</head>
