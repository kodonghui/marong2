<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마롱이 홈 화면 웹앱 알림 · 09 목업 후보</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="preview.css">
<script defer src="fixtures.js"></script>
<script defer src="preview.js"></script>
</head>
<body data-theme="chestnut">
<main class="review">
  <header class="review-heading">
    <p class="eyebrow">마롱이 · 09 목업 후보</p>
    <h1>홈 화면 웹앱 알림</h1>
    <p>같은 상태에서 A는 설명 바로 아래, B는 화면 하단에 동작을 둡니다. 실제 알림과 통화 대신 합성 결과로 흐름을 검토합니다.</p>
  </header>
  <section class="review-controls" aria-label="미리보기 설정">
    <label class="wide">화면 상태<select id="state"></select></label>
    <label>폭<select id="width"><option value="360">360px</option><option value="430">430px</option></select></label>
    <label>테마<select id="theme"><option value="chestnut">군밤 크림</option><option value="night">밤하늘</option></select></label>
  </section>
  <details class="simulation">
    <summary>알림과 통화 흐름 체험</summary>
    <div class="sim-body">
      <label>실행할 사례<select id="scenario">
        <option value="normal">유효한 약속 전화</option>
        <option value="denied">대상 접근 불가</option>
        <option value="offline">연결 미확인</option>
        <option value="reauth-expired">재로그인 중 미수락 만료</option>
        <option value="accept-expired">받기 직전 미수락 만료</option>
        <option value="answered">다른 기기의 선행 수락</option>
        <option value="lost">받기 응답 유실</option>
        <option value="mic-denied">마이크 권한 거절</option>
      </select></label>
      <button type="button" id="launch">시스템 알림 보기</button>
      <button type="button" id="next" disabled>합성 응답 적용</button>
      <button type="button" id="disconnect" disabled>연결 끊김 재현</button>
      <p id="sim-note" role="status">시스템 알림을 열거나 미리보기의 조작을 선택할 수 있습니다.</p>
    </div>
  </details>
  <div class="frames" id="frames"></div>
  <p class="review-footer"><a href="../../iphone-webapp-09-mockup-checkpoint-2026-11-25.md">후보 비교와 검증 기록</a></p>
</main>
