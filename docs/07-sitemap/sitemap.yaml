# 마롱이 웹 화면 목록(07단계 원본). 보기는 sitemap.md 에 이 파일에서 그려요.
# 통화 웹앱(SCR-001~005)과, 봇의 글 대화 서버가 /chat/ 아래로 내보내는 일기장(SCR-113~118)·듣기 시험(SCR-119)·성향 맞춤(SCR-120~122)이 있어요.
# SCR-113~119는 2026-11-16, SCR-120~122는 2026-11-17 설계예요(아직 만들지 않음, SCR-120~122는 성향 맞춤 스레드 PR #30의 docs/08-screens/persona.md 1절에서 옮김). 앱 화면 가운데 08 화면 정의가 있는 것(SCR-101, SCR-107~112, SCR-130)은 아래 '안드로이드 앱' 절에 적어요(2026-11-17 더함). SCR-102~106(앱 창의 연결 실패·로그인·권한 안내 등)은 docs/android-app.md에만 있어요.
# 마롱이 화면 전체의 번호표(어느 번호를 어느 맥락이 쓰는지, SCR-120~ 범위 포함)와 토큰·부품 기준은 design/README.md 에 있어요(2026-11-17).
# 앱 자동 업데이트(CTX-021, 2026-11-17)는 웹 화면이 없어요: 앱 글 대화 메뉴 SCR-109의 '자동 업데이트' 줄(FL-148, TERM-092·097)과 안드로이드 알림 SCR-130(FL-148, TERM-095·098). 정의 docs/08-screens/app-update.md.
#   화면이 없는 흐름 FL-146(서버 명령)·FL-147(조용히 일어남), 화면이 없는 용어 TERM-093·094·096·099·100.
#   2026-11-22 기능 변경(D129·D130·D131): 통화 홈 SCR-001과 글 대화 SCR-107에 같은 업데이트 배너(TERM-224, FL-148)가 늘어요. 새 화면은 없어요. 상태는 docs/08-screens/app-update.md의 'SCR-001 통화 홈의 업데이트 배너'와 'SCR-107 글 대화의 업데이트 배너' 절.
#   화면이 없는 흐름 FL-193(서버가 뒤처진 폰 깨우기)·FL-194(업데이트 상태 보고). 관리자가 읽는 버전 기록·업데이트 기록(API-267)의 화면은 관리 페이지 다시 만들기가 정해요.
#   without a screen: TERM-219(업데이트 데이터 메시지, 화면에 아무것도 띄우지 않음), TERM-220(업데이트 상태, 서버 기록), TERM-221(릴리스 노트)·TERM-222(버전 기록)·TERM-223(업데이트 기록), 관리자 읽기 API뿐(화면은 관리 페이지 다시 만들기)
# 지금 반영된 서버에서 친구용 화면(SCR-001~005, SCR-107~122)은 Cloudflare Access 뒤에 있어서, 허용된 Google 계정으로 로그인한 통화하는 친구만 봐요(REQ-001). 반려동물 서비스(SCR-140~162)는 처음부터 Access 뒤가 아니에요.
# 통합 앱(MVP, 2026-11-19 설계, D97·D104)으로 바뀌면 관리자 화면(SCR-169)만 Access 뒤에 남아요. 그 밖의 친구용 화면은 초대 링크로 가입한 사람의 기기 로그인(쿠키)으로 열고(REQ-430~438), 로그인이 없으면 로그인 화면(SCR-164)으로 보내요(REQ-436).
# 그때 아래 access 칸의 '허용된 Google 계정(통화하는 친구 …)'은 '로그인한 사람(초대 링크로 가입)'이 되고 '디스코드 DM 연결 있음' 조건은 없어져요(REQ-439). 전환은 설정값 MARONG_AUTH(access → both → session)로 하고, 있는 화면의 access 글은 전환을 끝내는 변경에서 고쳐요.
# FL-010(카톡 마롱이가 통화를 이어 알기)은 카톡에서 일어나서 화면이 없어요.
# without a screen: TERM-004(로그인 이메일, Access 로그인 화면은 Cloudflare가 그림), TERM-008(위임, 목소리로만 답함), TERM-013(신호), TERM-016(sideband), TERM-020(미리 넘기기, 친구에게 보이지 않음)
- id: SCR-001
  name: 통화 홈
  path: /
  access: 허용된 Google 계정(통화하는 친구)
  status: active
  flows: [FL-001, FL-002, FL-006, FL-007, FL-008, FL-009, FL-121, FL-148, FL-177, FL-179]
  terms: [CTX-002, CTX-006, CTX-021, CTX-029, TERM-001, TERM-003, TERM-014, TERM-018, TERM-167, TERM-178, TERM-190, TERM-199, TERM-224]
  children:
    - id: SCR-002
      name: 통화 중
      path: /call
      access: 허용된 Google 계정(통화하는 친구)
      status: active
      flows: [FL-002, FL-003, FL-004, FL-005, FL-006, FL-007, FL-009, FL-142, FL-178]
      terms: [CTX-002, CTX-003, CTX-020, TERM-001, TERM-002, TERM-009, TERM-010, TERM-011, TERM-012, TERM-017, TERM-018, TERM-019, TERM-080, TERM-083, TERM-179, TERM-197]
      # 선 전화·그림 화두(CTX-020, 2026-11-16): 새 화면은 없고 있는 화면의 상태만 늘어요(08단계 docs/08-screens/call-first.md).
      # 통화 중(SCR-002)에 선 전화 그림 카드가 떠요(FL-142). 앱 화면은 그 문서에 있어요: 벨 화면 SCR-110과 전화 알림 SCR-111(docs/app-ring.md)은
      # '마롱이가 먼저 걸었어요'(FL-142·143), 앱 알림 SCR-108과 글 대화 SCR-107·글 대화 창 SCR-112(docs/app-chat.md)는 그림 말풍선과 '먼저 건 전화' 태그(FL-141·143·144).
      # 디스코드 DM의 그림 첨부는 디스코드 화면이에요. FL-140(화두 고르기)은 서버 판단, FL-145(그림 세트)는 관리 도구라 화면이 없어요.
      # without a screen: TERM-082(화두, 그림 화두 글과 선 전화 통화로만 보임), TERM-084(그림 세트, 저장소 폴더),
      # without a screen: TERM-085(검수, 서버 밖), TERM-086(화두 시각, 서버가 셈), TERM-087(선 전화 시간대)·TERM-090(선 전화 설정, 말과 관리 도구로만 바꿈),
      # without a screen: TERM-088(화두 답)·TERM-089(간격 늘리기, 서버 기록과 계산)
    - id: SCR-003
      name: 지난 통화
      path: /calls
      access: 허용된 Google 계정(통화하는 친구)
      status: active
      flows: [FL-008]
      terms: [CTX-004, TERM-001, TERM-006]
      children:
        - id: SCR-004
          name: 통화 상세
          path: /calls/:id
          access: 허용된 Google 계정(통화하는 친구, 자기 통화만)
          status: active
          flows: [FL-007, FL-008]
          terms: [CTX-004, TERM-001, TERM-005, TERM-006, TERM-007, TERM-015]
    - id: SCR-005
      name: 마롱이 기억
      path: /memories
      access: 허용된 Google 계정(통화하는 친구, 자기 기억만)
      status: active
      flows: [FL-008]
      terms: [CTX-004, TERM-007]

# 일기장(CTX-007, 2026-11-16). /chat/diary/ 아래 페이지 하나(같은 HTML)예요. :date 는 YYYY-MM-DD 이고, 비우면(/chat/diary/) 가장 최근 일기 날이에요(SPEC-158, API-108).
# '#' 뒤 이름은 같은 페이지 위에 뜨는 칸이에요. 서버로 가지 않아서 04·06 의 주소가 바뀌지 않고, 브라우저의 뒤로 가기는 칸만 닫아요.
# 들어오는 곳: 글 대화(SCR-107) 머리의 '일기장' 버튼, 글 대화와 디스코드 DM의 아침 알림 말에 붙은 주소(FL-115). 글 대화는 통화 홈 머리의 '글 대화'에서 열려요.
# 앱에서는 글 대화 창 안에서 열리고, 그 창의 뒤로 가기는 창을 닫아요(docs/app-chat.md SPEC-143). 그래서 일기장 머리에 '글 대화로' 버튼을 둬요(앱은 바꾸지 않음).
# without a screen: TERM-023(하루 모음, 밤 작업 안에서만), TERM-025(장면, 친구에게 보이지 않음), TERM-033(아침 알림, 앱 알림과 디스코드 DM의 말 한 줄)
- id: SCR-113
  name: 일기장 한 날
  path: /chat/diary/:date
  access: 허용된 Google 계정(통화하는 친구, 디스코드 DM 연결 있음, 자기 일기만)
  status: active
  flows: [FL-115, FL-116, FL-117, FL-118, FL-119]
  terms: [CTX-007, TERM-021, TERM-022, TERM-024, TERM-026, TERM-027, TERM-028, TERM-029]
  children:
    - id: SCR-114
      name: 말로 고치기
      path: '/chat/diary/:date#fix'
      access: 허용된 Google 계정(통화하는 친구, 자기 일기만)
      status: active
      flows: [FL-116]
      terms: [CTX-007, TERM-021]
    - id: SCR-115
      name: 다시 그리기
      path: '/chat/diary/:date#redraw'
      access: 허용된 Google 계정(통화하는 친구, 자기 일기만)
      status: active
      flows: [FL-116]
      terms: [CTX-007, TERM-024, TERM-028, TERM-032]
    - id: SCR-116
      name: 한 달 달력
      path: '/chat/diary/:date#calendar'
      access: 허용된 Google 계정(통화하는 친구, 자기 일기만)
      status: active
      flows: [FL-117]
      terms: [CTX-007, TERM-022, TERM-026, TERM-027, TERM-029]
    - id: SCR-117
      name: 숨긴 일기
      path: '/chat/diary/:date#hidden'
      access: 허용된 Google 계정(통화하는 친구, 자기 일기만)
      status: active
      flows: [FL-117]
      terms: [CTX-007, TERM-021, TERM-029]
    - id: SCR-184
      name: 일기장 꾸미기
      path: /chat/diary/decor
      access: 로그인한 사람(초대 링크로 가입)
      status: active
      flows: [FL-191]
      terms: [CTX-030, CTX-007, TERM-213, TERM-214, TERM-215]
    - id: SCR-185
      name: 스티커 붙이기
      path: '/chat/diary/:date#stickers'
      access: 로그인한 사람(초대 링크로 가입, 자기 일기만)
      status: active
      flows: [FL-191]
      terms: [CTX-030, CTX-007, TERM-216]
    - id: SCR-118
      name: 내 모습 카드
      path: '/chat/diary/:date#look'
      access: 허용된 Google 계정(통화하는 친구, 자기 카드만)
      status: active
      flows: [FL-119]
      terms: [CTX-007, TERM-030, TERM-031]

# 듣기 시험(CTX-002, 2026-11-16). 동희님이 보내 준 주소로만 들어와요. 다른 화면에서 가는 경로는 두지 않아요(시험이 끝나면 번들을 치움).
# without a screen: TERM-034(통화 사용량), TERM-035(단가표), TERM-036(지출 상한 예산, Google Cloud 콘솔), TERM-037(설정 실험), TERM-038(글로 갈아타기). 동희님 관리 명령·시트만이거나 친구에게 보이지 않아요
- id: SCR-119
  name: 듣기 시험
  path: /chat/listen/
  access: 허용된 Google 계정(통화하는 친구, 디스코드 DM 연결 있음)
  status: active
  flows: [FL-123]
  terms: [CTX-002, TERM-039]

# 성향 맞춤·친구 기억(CTX-008·CTX-011, 2026-11-17 설계, 아직 만들지 않음). /chat/persona/ 아래 페이지 세 개예요(docs/08-screens/persona.md).
# 들어오는 곳: 글 대화(SCR-107) 머리의 '나' 버튼(API-127이 200일 때만 보임), 약속 초안 카드 '고칠래'(SCR-123, FL-125).
# 앱에서는 글 대화 창 안에서 열리고 그 창의 뒤로 가기는 창을 닫아서, 세 페이지 머리 왼쪽에 돌아가는 버튼을 둬요(SCR-120은 '글 대화', SCR-121·122는 '친구 약속').
# SCR-123(글 대화 안 고르기 카드)은 SCR-107 메시지 안 부품이라 여기 적지 않아요. 그 카드에 보이는 용어: TERM-041(첫 질문), TERM-045(지지 방식 묻기), TERM-047(약속 바꾸기 제안), TERM-061(전하기), TERM-062(부탁 확인).
# without a screen: TERM-046(선호 신호, 서버가 셈), TERM-049~057(선톡 칸·게이트·이유·기억형 선톡·안 보냄·답 없는 선톡·백오프·잠금 화면 등급·꺼낼 얘기, 선톡 그래프 안), TERM-058(기능 목록, 코드), TERM-059·060(부탁·조건 연락, 대화로만), TERM-065(기억 연산), TERM-067~070(돌봄 안부·고정 요약·찾은 기억·정리 작업, 서버 안), TERM-074·075(위기 상태·위기 신호, 화면에 보이지 않음), TERM-076~079(보내기 전 검사·기운 단계·통화 화제 목록·그림자 모드, 서버 안)
- id: SCR-120
  name: 친구 약속
  path: /chat/persona/
  access: 허용된 Google 계정(통화하는 친구, 마롱이 친구에 묶임, 자기 약속만)
  status: active
  flows: [FL-124, FL-125, FL-126, FL-127]
  terms: [CTX-008, CTX-020, TERM-040, TERM-041, TERM-042, TERM-044, TERM-048, TERM-090]
  children:
    - id: SCR-121
      name: 맞춤형 지침
      path: /chat/persona/instructions
      access: 허용된 Google 계정(통화하는 친구, 마롱이 친구에 묶임, 자기 지침만)
      status: active
      flows: [FL-128]
      terms: [CTX-008, TERM-043, TERM-044]
    - id: SCR-122
      name: 마롱이가 기억하는 나
      path: /chat/persona/memory
      access: 허용된 Google 계정(통화하는 친구, 마롱이 친구에 묶임, 자기 기억만)
      status: active
      flows: [FL-135]
      terms: [CTX-011, TERM-063, TERM-064, TERM-066, TERM-071, TERM-072, TERM-073]

# 안드로이드 앱(2026-11-17 더함). 화면 정의는 docs/08-screens/call-first.md(SCR-101·107·108·110·111·112)와 docs/08-screens/app-update.md(SCR-109·130, SCR-001·107의 업데이트 배너)에 있고,
# 처음 설계는 docs/android-app.md·docs/app-chat.md·docs/app-ring.md예요. 경로 앞의 `app:`은 앱 안이라는 뜻이에요: 웹을 띄우는 창은 그 창 이름, 네이티브 화면은 Activity 이름, 알림은 알림 채널이에요.
# 글 대화(SCR-107)는 웹 주소 /chat/이고, 앱에서는 글 대화 창(SCR-112) 안에서 열려요. 통화 화면(SCR-101)은 앱 창 안에서 통화 웹(SCR-001·002)을 띄워요.
# without a screen: TERM-161(방)·TERM-162(친구)·TERM-164(요약)·TERM-165(메모)·TERM-166(공유 메모), 카톡·디스코드 대화와 서버 안
# without a screen: TERM-169(앱 기기, 서버 기록), TERM-170(서명한 APK, 올리기 도구), TERM-171(앱 화면 상태, 앱이 셈)
