<!doctype html>
<html lang="ko" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121729">
  <title>마롱이</title>
  <link rel="icon" href="/face/v1/01-neutral.webp">
  <link rel="stylesheet" href="/chat/chat.css">
  <link rel="stylesheet" href="/chat/unified.css">
  <script src="/chat/unified.js" defer></script>
  <script src="/chat/account.js" defer></script>
  <link rel="manifest" href="/chat/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/chat/icon-180.png">
</head>
<body>
  <main class="unified">
    <header><h1>마롱이</h1></header>
    <section class="stack centered" id="account" aria-live="polite" aria-busy="true">
      <div class="account-face" id="face"></div>
      <p class="title" id="headline"></p>
      <p class="caption" id="hint" hidden></p>
      <div class="stack" id="actions"></div>
      <p class="err" id="error" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
