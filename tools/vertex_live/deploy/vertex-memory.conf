# User-unit drop-in for marong-vertex-live.service.
# Keep the existing Cloudflare Access allowlist/audience configuration in place.
[Service]
Environment=VERTEX_AUTH_MODE=api_key
Environment="MARONG_CALL_DSN=dbname=marong user=marong_call"
ExecStart=
ExecStart=%h/marong-vertex-test/venv-memory2/bin/python %h/marong-vertex-test/app/server.py
